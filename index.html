<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S4Memo - Sims 4 Memorable</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4ede6;
            --bg-pattern: radial-gradient(#d5c4b3 1.5px, transparent 1.5px);
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-solid: #ffffff;
            --text-color: #2c221e;
            --subtext-color: #7a6a60;
            --border-color: rgba(213, 196, 179, 0.5);
            --accent-color: #2ed573;
            --accent-hover: #26af5f;
            --active-glow: rgba(46, 213, 115, 0.35);
            --shadow-color: rgba(44, 34, 30, 0.08);
            --nav-bg: rgba(255, 255, 255, 0.75);
            --input-bg: #fcf9f6;

            --btn-pink: #ff5e7e;
            --btn-pink-hover: #e04867;
            --btn-green: #2ed573;
            --btn-green-hover: #24b05d;
            --line-pink: #ff5e7e;
            --line-green: #2ed573;
            --line-blue: #70a1ff;

            --sim-node-clip-path: none;
            --sim-node-radius: 50%;
            --line-stroke-width: 3.5px;
            
            --custom-bg-size: cover;
            --custom-bg-position: center;
            --bg-blur: 0px;
        }

        [data-theme="dark"] {
            --bg-color: #121110;
            --bg-pattern: radial-gradient(#2a2623 1.5px, transparent 1.5px);
            --card-bg: rgba(30, 26, 24, 0.85);
            --card-solid: #1e1a18;
            --text-color: #f5ebe6;
            --subtext-color: #a39288;
            --border-color: rgba(60, 50, 45, 0.6);
            --accent-color: #2ed573;
            --accent-hover: #3be380;
            --active-glow: rgba(46, 213, 115, 0.4);
            --shadow-color: rgba(0, 0, 0, 0.4);
            --nav-bg: rgba(24, 20, 18, 0.75);
            --input-bg: #26211e;

            --btn-pink: #ff5e7e;
            --btn-pink-hover: #ff3b61;
            --btn-green: #2ed573;
            --btn-green-hover: #219d52;
            --line-pink: #ff5e7e;
            --line-green: #2ed573;
            --line-blue: #70a1ff;
        }

        #bgBlurOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            backdrop-filter: blur(var(--bg-blur));
            -webkit-backdrop-filter: blur(var(--bg-blur));
            transition: backdrop-filter 0.1s ease;
        }

        body.bg-dots { background-image: var(--bg-pattern); background-size: 24px 24px; }
        body.bg-clean { background-image: none !important; }
        body.bg-grid { 
            background-image: linear-gradient(var(--border-color) 1px, transparent 1px), linear-gradient(90deg, var(--border-color) 1px, transparent 1px);
            background-size: 30px 30px; 
        }
        body.bg-custom {
            background-size: var(--custom-bg-size);
            background-position: var(--custom-bg-position);
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        * {
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            min-height: 100vh;
        }

        svg path {
            fill: none !important;
            stroke-linecap: round;
        }

        .top-nav-container { padding: 16px 24px 0 24px; position: relative; z-index: 1100; }
        .top-nav {
            background-color: var(--nav-bg); padding: 10px 24px;
            display: flex; align-items: center; justify-content: space-between;
            border-radius: 24px; box-shadow: 0 8px 25px var(--shadow-color); border: 1px solid var(--border-color);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        }
        .nav-left { display: flex; align-items: center; gap: 24px; }
        .nav-right { display: flex; align-items: center; gap: 10px; }
        .nav-links { display: flex; gap: 8px; align-items: center; }
        .top-nav a.nav-item {
            text-decoration: none; font-size: 14px; color: var(--subtext-color);
            padding: 8px 16px; border-radius: 14px; font-weight: 700; cursor: pointer;
        }
        .top-nav a.nav-item:hover { color: var(--text-color); background-color: rgba(255,255,255,0.1); }
        .top-nav a.nav-item.active { color: #ffffff; background-color: var(--accent-color); box-shadow: 0 4px 14px var(--active-glow); }

        .logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 800; color: var(--text-color); letter-spacing: -0.5px; font-family: 'Playfair Display', serif; }

        .page-view { display: none; padding: 30px 20px; max-width: 1100px; margin: 0 auto; position: relative; z-index: 10; }
        .page-view.active { display: block; }
        .main-card {
            background-color: var(--card-bg); padding: 40px; border-radius: 32px;
            box-shadow: 0 16px 40px var(--shadow-color); border: 1px solid var(--border-color);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        }

        .context-menu {
            position: fixed; display: none; background-color: var(--nav-bg);
            border: 1px solid var(--border-color); border-radius: 18px;
            box-shadow: 0 12px 32px var(--shadow-color); z-index: 6000;
            padding: 6px; min-width: 190px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        }
        .context-menu.active { display: block; }
        .context-menu-item {
            padding: 8px 14px; font-size: 12px; font-weight: 700; color: var(--text-color);
            cursor: pointer; display: flex; align-items: center; gap: 10px; border-radius: 10px; margin: 2px 0;
        }
        .context-menu-item:hover { background-color: var(--card-solid); color: var(--accent-color); transform: translateX(2px); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(0, 0, 0, 0.4); z-index: 3000;
            display: none; align-items: center; justify-content: center;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }
        .modal-overlay.active { display: flex; }
        
        .modal-card {
            background-color: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 28px; width: 480px; max-width: 92%; padding: 24px;
            box-shadow: 0 20px 50px var(--shadow-color); max-height: 90vh; overflow-y: auto;
            position: relative; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        }

        .close-btn {
            position: absolute; top: 16px; right: 20px; background: none; border: none;
            color: var(--subtext-color); font-size: 20px; cursor: pointer; font-weight: 800; z-index: 10;
        }

        .modal-header { border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 16px; }
        .modal-title { margin: 0 0 10px 0; font-size: 18px; font-weight: 800; color: var(--text-color); }

        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
        .btn-secondary { background-color: transparent; border: 1px solid var(--border-color); color: var(--text-color); padding: 8px 14px; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 12px; }
        .btn-primary { background-color: var(--accent-color); border: none; color: white; padding: 8px 16px; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 12px; box-shadow: 0 4px 12px var(--active-glow); }
        .btn-danger-sm { background-color: #ff5e7e; border: none; color: white; padding: 4px 8px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 11px; }

        /* KAPCSOLATOK TÖRLÉSE LISTA STÍLUSOK */
        .disconnect-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 14px;
        }
        .disconnect-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
        }
        .disconnect-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .disconnect-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-color);
        }
        .disconnect-type {
            font-size: 10px;
            font-weight: 800;
            color: var(--accent-color);
            text-transform: uppercase;
        }
    </style>
</head>
<body class="bg-dots">

    <div id="bgBlurOverlay"></div>

    <!-- NAVIGÁCIÓ -->
    <div class="top-nav-container" id="topNavContainer">
        <nav class="top-nav">
            <div class="nav-left">
                <div class="logo">S4Memo</div>
            </div>
        </nav>
    </div>

    <!-- FŐOLDAL -->
    <div class="page-view active" id="homeView">
        <main class="main-card">
            <h1>Sims 4 Családfa Kezelő</h1>
            <p>Jobb klikk a Simre a kapcsolatok kezeléséhez és törléséhez.</p>
        </main>
    </div>

    <!-- KONTEXTUS MENÜ -->
    <div class="context-menu" id="contextMenu">
        <div class="context-menu-item" onclick="contextAction('edit')">✏️ Szerkesztés</div>
        <div class="context-menu-item" onclick="contextAction('connect')">🔗 Kapcsolat hozzáadása...</div>
        <div class="context-menu-item" onclick="contextAction('disconnect')">✂️ Kapcsolatok törlése</div>
        <div class="context-menu-item" style="color: #ff5e7e;" onclick="contextAction('delete')">🗑️ Karakter törlése</div>
    </div>

    <!-- KAPCSOLATOK TÖRLÉSE MODAL -->
    <div class="modal-overlay" id="disconnectModal">
        <div class="modal-card">
            <button type="button" class="close-btn" onclick="closeDisconnectModal()">&times;</button>
            <div class="modal-header">
                <h3 class="modal-title">Kapcsolatok törlése</h3>
            </div>
            <p style="font-size: 12px; color: var(--subtext-color); margin: 0;">Válaszd ki, melyik kapcsolatot szeretnéd eltávolítani erről a Simről:</p>
            
            <div class="disconnect-list" id="disconnectList">
                <!-- Dinamikusan generált kapcsolatok -->
            </div>

            <div class="modal-actions" style="margin-top: 20px;">
                <button type="button" class="btn-secondary" onclick="closeDisconnectModal()">Bezárás</button>
            </div>
        </div>
    </div>

    <script>
        const contextMenu = document.getElementById('contextMenu');
        const disconnectModal = document.getElementById('disconnectModal');
        const disconnectList = document.getElementById('disconnectList');

        let contextSimId = 'sim_1'; // Példa az kiválasztott Sim ID-ra

        let familyTrees = [
            {
                id: 'tree_1',
                name: 'Goth család',
                sims: [
                    { id: 'sim_1', firstName: 'Bella', lastName: 'Goth', partnerId: 'sim_2', parentIds: [], customRelations: [], relationType: 'Házas' },
                    { id: 'sim_2', firstName: 'Mortimer', lastName: 'Goth', partnerId: 'sim_1', parentIds: [], customRelations: [], relationType: 'Házas' },
                    { id: 'sim_3', firstName: 'Cassandra', lastName: 'Goth', partnerId: null, parentIds: ['sim_1', 'sim_2'], customRelations: [], relationType: null }
                ]
            }
        ];
        let currentTreeId = 'tree_1';

        function getSimById(simId) {
            const tree = familyTrees.find(t => t.id === currentTreeId);
            return tree ? tree.sims.find(s => s.id === simId) : null;
        }

        function contextAction(action) {
            contextMenu.classList.remove('active');
            if (action === 'disconnect') {
                openDisconnectModal(contextSimId);
            }
        }

        function openDisconnectModal(simId) {
            contextSimId = simId;
            renderDisconnectList();
            disconnectModal.classList.add('active');
        }

        function closeDisconnectModal() {
            disconnectModal.classList.remove('active');
        }

        function renderDisconnectList() {
            const currentSim = getSimById(contextSimId);
            const tree = familyTrees.find(t => t.id === currentTreeId);
            disconnectList.innerHTML = '';

            if (!currentSim || !tree) return;

            let relationsFound = false;

            // 1. Házastárs / Partner kapcsolat
            if (currentSim.partnerId) {
                const partner = getSimById(currentSim.partnerId);
                if (partner) {
                    relationsFound = true;
                    disconnectList.appendChild(createDisconnectItem(
                        partner.id,
                        `${partner.firstName} ${partner.lastName}`,
                        currentSim.relationType || 'Partner',
                        'partner'
                    ));
                }
            }

            // 2. Szülők kapcsolat
            if (currentSim.parentIds && currentSim.parentIds.length > 0) {
                currentSim.parentIds.forEach(pId => {
                    const parentSim = getSimById(pId);
                    if (parentSim) {
                        relationsFound = true;
                        disconnectList.appendChild(createDisconnectItem(
                            parentSim.id,
                            `${parentSim.firstName} ${parentSim.lastName}`,
                            'Szülő',
                            'parent'
                        ));
                    }
                });
            }

            // 3. Gyermekek kapcsolat
            const children = tree.sims.filter(s => s.parentIds && s.parentIds.includes(currentSim.id));
            children.forEach(child => {
                relationsFound = true;
                disconnectList.appendChild(createDisconnectItem(
                    child.id,
                    `${child.firstName} ${child.lastName}`,
                    'Gyermek',
                    'child'
                ));
            });

            // 4. Egyedi / Egyéb kapcsolatok
            if (currentSim.customRelations && currentSim.customRelations.length > 0) {
                currentSim.customRelations.forEach(rel => {
                    const relSim = getSimById(rel.targetId);
                    if (relSim) {
                        relationsFound = true;
                        disconnectList.appendChild(createDisconnectItem(
                            relSim.id,
                            `${relSim.firstName} ${relSim.lastName}`,
                            rel.type,
                            'custom'
                        ));
                    }
                });
            }

            if (!relationsFound) {
                disconnectList.innerHTML = '<div style="font-size:12px; color:var(--subtext-color); text-align:center; padding:10px;">Ennek a Simnek nincsenek törölhető kapcsolatai.</div>';
            }
        }

        function createDisconnectItem(targetId, targetName, relationType, relationCategory) {
            const item = document.createElement('div');
            item.className = 'disconnect-item';
            item.innerHTML = `
                <div class="disconnect-info">
                    <span class="disconnect-name">${targetName}</span>
                    <span class="disconnect-type">(${relationType})</span>
                </div>
                <button class="btn-danger-sm" onclick="removeSpecificRelation('${targetId}', '${relationCategory}')">Törlés</button>
            `;
            return item;
        }

        function removeSpecificRelation(targetId, relationCategory) {
            const currentSim = getSimById(contextSimId);
            const targetSim = getSimById(targetId);

            if (!currentSim || !targetSim) return;

            if (relationCategory === 'partner') {
                currentSim.partnerId = null;
                currentSim.relationType = null;
                if (targetSim.partnerId === currentSim.id) {
                    targetSim.partnerId = null;
                    targetSim.relationType = null;
                }
            } else if (relationCategory === 'parent') {
                currentSim.parentIds = currentSim.parentIds.filter(id => id !== targetId);
            } else if (relationCategory === 'child') {
                targetSim.parentIds = targetSim.parentIds.filter(id => id !== currentSim.id);
            } else if (relationCategory === 'custom') {
                if (currentSim.customRelations) {
                    currentSim.customRelations = currentSim.customRelations.filter(r => r.targetId !== targetId);
                }
                if (targetSim.customRelations) {
                    targetSim.customRelations = targetSim.customRelations.filter(r => r.targetId !== currentSim.id);
                }
            }

            // Újrarendereljük a listát
            renderDisconnectList();
        }
    </script>
</body>
</html>
