<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S4Memo - Sims 4 Memorable</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4ede6;
            --bg-pattern: radial-gradient(#d5c4b3 1.5px, transparent 1.5px);
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-solid: #ffffff;
            --text-color: #2c221e;
            --subtext-color: #7a6a60;
            --border-color: rgba(213, 196, 179, 0.5);
            --accent-color: #2ed573;
            --accent-hover: #26af5f;
            --active-glow: rgba(46, 213, 115, 0.35);
            --shadow-color: rgba(44, 34, 30, 0.08);
            --nav-bg: rgba(255, 255, 255, 0.75);
            --modal-overlay: rgba(44, 34, 30, 0.4);
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-title: 'Playfair Display', serif;
        }

        [data-theme="dark"] {
            --bg-color: #1a1614;
            --bg-pattern: radial-gradient(#3a322d 1.5px, transparent 1.5px);
            --card-bg: rgba(35, 29, 26, 0.85);
            --card-solid: #231d1a;
            --text-color: #f4ede6;
            --subtext-color: #a39285;
            --border-color: rgba(75, 62, 53, 0.5);
            --shadow-color: rgba(0, 0, 0, 0.3);
            --nav-bg: rgba(26, 22, 20, 0.85);
            --modal-overlay: rgba(0, 0, 0, 0.7);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            background-image: var(--bg-pattern);
            background-size: 24px 24px;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.3s, color 0.3s;
            overflow-x: hidden;
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }

        .header-bg-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        header {
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px var(--shadow-color);
        }

        .logo { font-family: var(--font-title); font-size: 1.6rem; font-weight: 600; font-style: italic; display: flex; align-items: center; gap: 8px; }
        .logo span { font-family: var(--font-main); font-style: normal; font-size: 0.8rem; font-weight: 700; background: var(--accent-color); color: white; padding: 2px 8px; border-radius: 20px; }

        .nav-actions { display: flex; gap: 12px; }
        .btn {
            background: var(--card-solid);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px var(--shadow-color);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.9rem;
        }

        .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px var(--shadow-color); }
        .btn-primary { background: var(--accent-color); color: white; border: none; }
        .btn-primary:hover { background: var(--accent-hover); }

        .tree-tabs-bar {
            display: flex;
            gap: 8px;
            padding: 10px 2rem;
            background: var(--card-solid);
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
            align-items: center;
        }

        .tree-tab {
            padding: 6px 14px;
            border-radius: 20px;
            background: var(--bg-color);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tree-tab.active {
            background: var(--accent-color);
            color: white;
        }

        .sidebar {
            position: fixed;
            top: 0; right: -360px;
            width: 360px; height: 100vh;
            background: var(--card-solid);
            border-left: 1px solid var(--border-color);
            box-shadow: -10px 0 30px var(--shadow-color);
            z-index: 200;
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 2rem;
            display: flex;
            flex-direction: column;
        }

        .sidebar.open { right: 0; }
        .sidebar-toggle {
            position: fixed;
            top: 80px; right: 20px;
            z-index: 150;
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-toggle.open { right: 380px; }

        .main-container {
            display: flex;
            flex: 1;
            position: relative;
        }

        .canvas-area {
            flex: 1;
            overflow: auto;
            padding: 3rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: calc(100vh - 70px);
            position: relative;
        }

        .connections-svg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .tree-grid {
            display: flex;
            flex-direction: column;
            gap: 80px;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        .generation-row {
            display: flex;
            gap: 40px;
            justify-content: center;
            align-items: center;
        }

        .sim-card {
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 1rem;
            width: 170px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            box-shadow: 0 8px 24px var(--shadow-color);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sim-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-color);
        }

        .sim-card.selected {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 4px var(--active-glow);
        }

        .sim-avatar-wrapper {
            width: 80px;
            height: 80px;
            min-width: 80px;
            min-height: 80px;
            max-width: 80px;
            max-height: 80px;
            border-radius: 50%;
            overflow: hidden;
            margin-bottom: 0.8rem;
            border: 3px solid var(--card-solid);
            box-shadow: 0 4px 10px var(--shadow-color);
            background: #eee;
            flex-shrink: 0;
        }

        .sim-avatar { width: 100%; height: 100%; object-fit: cover; }
        .sim-name { font-weight: 700; font-size: 0.95rem; line-height: 1.2; margin-bottom: 4px; }
        .sim-title { font-size: 0.75rem; color: var(--accent-color); font-weight: 600; margin-bottom: 4px; }
        .sim-gen { font-size: 0.7rem; color: var(--subtext-color); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

        .sim-pets-container {
            display: flex;
            gap: 4px;
            margin-top: 6px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
        }

        .pet-avatar-small {
            width: 24px;
            height: 24px;
            min-width: 24px;
            min-height: 24px;
            max-width: 24px;
            max-height: 24px;
            border-radius: 50%;
            border: 1px solid var(--card-solid);
            object-fit: cover;
            flex-shrink: 0;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--modal-overlay);
            backdrop-filter: blur(4px);
            z-index: 300;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal {
            background: var(--card-solid);
            padding: 2rem;
            border-radius: 24px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 40px var(--shadow-color);
            border: 1px solid var(--border-color);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header { font-family: var(--font-title); font-size: 1.4rem; font-weight: 600; margin-bottom: 1.5rem; }

        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--subtext-color); margin-bottom: 0.4rem; text-transform: uppercase; }
        .form-control {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            font-size: 0.95rem;
            outline: none;
        }

        .journal-section {
            margin-top: 2rem;
            border-top: 1px solid var(--border-color);
            padding-top: 1.5rem;
        }

        .journal-entry {
            background: var(--bg-color);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        .bg-selector-grid {
            display: grid;
            grid-template-columns: repeat(3, 110px);
            gap: 12px;
            max-height: 300px;
            overflow-y: auto;
            padding: 6px;
        }

        .bg-option-card {
            border: 2px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            text-align: center;
            background: var(--card-solid);
            transition: all 0.2s;
        }

        .bg-option-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .bg-option-card img {
            width: 100%;
            height: 60px;
            object-fit: cover;
        }

        .bg-option-card span {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            S4Memo <span>PRO</span>
        </div>
        <div class="nav-actions">
            <button class="btn" onclick="openBgModal()">🖼️ Világok</button>
            <button class="btn" onclick="openTreeModal()">🌳 Családfák</button>
            <button class="btn" id="themeBtn" onclick="toggleTheme()">🌙 Dark</button>
            <button class="btn btn-primary" onclick="openAddSimModal()">+ Új Sim</button>
        </div>
    </header>

    <div class="tree-tabs-bar" id="treeTabsBar"></div>

    <div class="main-container">
        <div class="canvas-area" id="canvasArea">
            <svg class="connections-svg" id="svgCanvas"></svg>
            <div class="tree-grid" id="treeGrid"></div>
        </div>
    </div>

    <button class="btn sidebar-toggle" id="toggleBtn">📖 Napló</button>
    <div class="sidebar" id="sidebar">
        <h3 style="margin-bottom: 1rem; font-family: var(--font-title);">Családi Krónika</h3>
        <button class="btn btn-primary" style="width: 100%; margin-bottom: 1rem;" onclick="openJournalModal()">+ Új Bejegyzés</button>
        <div id="journalEntriesList" style="overflow-y: auto; flex: 1;"></div>
    </div>

    <div class="modal-overlay" id="simModal">
        <div class="modal">
            <div class="modal-header" id="modalTitle">Új Sim Hozzáadása</div>
            <input type="hidden" id="simId">
            <div class="form-group">
                <label>Név</label>
                <input type="text" id="simName" class="form-control" placeholder="pl. Bella Goth">
            </div>
            <div class="form-group">
                <label>Rang / Titulus</label>
                <input type="text" id="simTitleInput" class="form-control" placeholder="pl. Bárónő, Örökös">
            </div>
            <div class="form-group">
                <label>Generáció</label>
                <input type="number" id="simGen" class="form-control" value="1" min="1">
            </div>
            <div class="form-group">
                <label>Kép URL</label>
                <input type="text" id="simAvatar" class="form-control" placeholder="https://...">
            </div>
            <div class="form-group">
                <label>Galéria Képek (vesszővel elválasztva)</label>

                <input type="text" id="simGallery" class="form-control" placeholder="URL1, URL2, URL3">
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 1.5rem;">
                <button class="btn" onclick="closeModal()">Mégse</button>
                <button class="btn btn-primary" onclick="saveSim()">Mentés</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="bgModal">
        <div class="modal" style="max-width: 420px;">
            <div class="modal-header">Háttér Választása</div>
            <div class="bg-selector-grid" id="bgSelectorGrid"></div>
            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 1.5rem;">
                <button class="btn" onclick="closeBgModal()">Bezárás</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="treeModal">
        <div class="modal">
            <div class="modal-header">Családfák Kezelése</div>
            <div class="form-group">
                <label>Új Családfa Neve</label>
                <input type="text" id="newTreeName" class="form-control" placeholder="pl. Goth Dinasztia">
            </div>
            <button class="btn btn-primary" style="width: 100%; margin-bottom: 1.5rem;" onclick="createNewTree()">+ Létrehozás</button>
            <div id="treesList"></div>
            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 1.5rem;">
                <button class="btn" onclick="closeTreeModal()">Bezárás</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="journalModal">
        <div class="modal">
            <div class="modal-header">Új Krónika Bejegyzés</div>
            <div class="form-group">
                <label>Cím</label>
                <input type="text" id="journalTitle" class="form-control">
            </div>
            <div class="form-group">
                <label>Szöveg</label>
                <textarea id="journalText" class="form-control" rows="4"></textarea>
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 1.5rem;">
                <button class="btn" onclick="closeJournalModal()">Mégse</button>
                <button class="btn btn-primary" onclick="saveJournalEntry()">Mentés</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="connectModal">
        <div class="modal">
            <div class="modal-header">Kapcsolat Hozzáadása</div>
            <div class="form-group">
                <label>Kapcsolat Típusa</label>
                <select id="relType" class="form-control">
                    <option value="Házastárs">Házastárs / Partner</option>
                    <option value="Szülő">Szülője a célpontnak</option>
                    <option value="Gyermek">Gyermeke a célpontnak</option>
                    <option value="Testvér">Testvér</option>
                    <option value="Állat">Háziállat</option>
                </select>
            </div>
            <div class="form-group">
                <label>Célpont Sim</label>
                <select id="targetSimSelect" class="form-control"></select>
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 1.5rem;">
                <button class="btn" onclick="closeConnectionModal()">Mégse</button>
                <button class="btn btn-primary" onclick="saveConnection()">Összekötés</button>
            </div>
        </div>
    </div>

    <script>
        const worlds = [
            { id: 'willow_creek', name: 'Willow Creek', img: 'https://images.unsplash.com/photo-1518780664697-55e3ad937233?auto=format&fit=crop&w=600&q=80' },
            { id: 'oasis_springs', name: 'Oasis Springs', img: 'https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?auto=format&fit=crop&w=600&q=80' },
            { id: 'henford', name: 'Henford-on-Bagley', img: 'https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=600&q=80' },
            { id: 'sulani', name: 'Sulani', img: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80' },
            { id: 'san_myshuno', name: 'San Myshuno', img: 'https://images.unsplash.com/photo-1477959858617-67f30ac4ce71?auto=format&fit=crop&w=600&q=80' },
            { id: 'windenburg', name: 'Windenburg', img: 'https://images.unsplash.com/photo-1467269204594-9661b134dd2b?auto=format&fit=crop&w=600&q=80' }
        ];

        let trees = JSON.parse(localStorage.getItem('s4m_trees')) || [
            { id: 'tree_1', name: 'Fő Családfa', background: 'willow_creek', sims: [], journal: [] }
        ];
        let currentTreeId = localStorage.getItem('s4m_currentTreeId') || 'tree_1';
        let selectedSimId = null;

        function getCurrentTree() {
            return trees.find(t => t.id === currentTreeId) || trees[0];
        }

        function saveTreesToStorage() {
            localStorage.setItem('s4m_trees', JSON.stringify(trees));
            localStorage.setItem('s4m_currentTreeId', currentTreeId);
        }

        function renderTreeTabs() {
            const bar = document.getElementById('treeTabsBar');
            bar.innerHTML = '';
            trees.forEach(t => {
                const tab = document.createElement('div');
                tab.className = `tree-tab ${t.id === currentTreeId ? 'active' : ''}`;
                tab.innerText = t.name;
                tab.onclick = () => {
                    currentTreeId = t.id;
                    saveTreesToStorage();
                    renderTreeTabs();
                    renderTree();
                    renderJournalEntries();
                    applyPageBackground();
                };
                bar.appendChild(tab);
            });
        }

        function applyPageBackground() {
            const tree = getCurrentTree();
            const world = worlds.find(w => w.id === tree.background);
            if (world) {
                document.body.style.backgroundImage = `linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.2)), url('${world.img}')`;
            } else {
                document.body.style.backgroundImage = 'var(--bg-pattern)';
            }
        }

        function renderTree() {
            const tree = getCurrentTree();
            const grid = document.getElementById('treeGrid');
            grid.innerHTML = '';

            if (!tree.sims || tree.sims.length === 0) {
                grid.innerHTML = '<div style="color: var(--subtext-color);">Még nincsenek Sim-ek ebben a családfában. Add hozzá az elsőt!</div>';
                drawConnections();
                return;
            }

            const generations = {};
            tree.sims.forEach(sim => {
                const gen = sim.gen || 1;
                if (!generations[gen]) generations[gen] = [];
                generations[gen].push(sim);
            });

            const sortedGens = Object.keys(generations).sort((a, b) => a - b);

            sortedGens.forEach(genNum => {
                const row = document.createElement('div');
                row.className = 'generation-row';
                
                generations[genNum].forEach(sim => {
                    const card = document.createElement('div');
                    card.className = `sim-card ${selectedSimId === sim.id ? 'selected' : ''}`;
                    card.id = `sim-card-${sim.id}`;
                    card.onclick = (e) => {
                        e.stopPropagation();
                        selectedSimId = sim.id;
                        renderTree();
                    };

                    let petsHtml = '';
                    if (sim.petIds && sim.petIds.length > 0) {
                        petsHtml = '<div class="sim-pets-container">';
                        sim.petIds.forEach(petId => {
                            const pet = tree.sims.find(s => s.id === petId);
                            if (pet) {
                                petsHtml += `<img src="${pet.avatar || 'https://via.placeholder.com/80'}" class="pet-avatar-small" title="${pet.name}">`;
                            }
                        });
                        petsHtml += '</div>';
                    }

                    card.innerHTML = `
                        <div class="sim-avatar-wrapper">
                            <img src="${sim.avatar || 'https://via.placeholder.com/80'}" class="sim-avatar">
                        </div>
                        <div class="sim-name">${sim.name}</div>
                        ${sim.title ? `<div class="sim-title">${sim.title}</div>` : ''}
                        <div class="sim-gen">${sim.gen || 1}. Generáció</div>
                        ${petsHtml}
                        ${selectedSimId === sim.id ? `
                            <div style="margin-top: 10px; display: flex; gap: 4px; flex-wrap: wrap; justify-content: center;">
                                <button class="btn" style="padding: 2px 6px; font-size: 0.7rem;" onclick="openEditSimModal('${sim.id}')">✏️</button>
                                <button class="btn" style="padding: 2px 6px; font-size: 0.7rem;" onclick="openConnectModal('${sim.id}')">🔗</button>
                                <button class="btn" style="padding: 2px 6px; font-size: 0.7rem; background: #ff4757; color: white;" onclick="deleteSim('${sim.id}')">🗑️</button>
                            </div>
                        ` : ''}
                    `;
                    row.appendChild(card);
                });

                grid.appendChild(row);
            });

            setTimeout(drawConnections, 50);
        }

        function drawConnections() {
            const svg = document.getElementById('svgCanvas');
            svg.innerHTML = '';
            const tree = getCurrentTree();
            if (!tree.sims) return;

            const canvasRect = document.getElementById('canvasArea').getBoundingClientRect();

            tree.sims.forEach(sim => {
                const sourceCard = document.getElementById(`sim-card-${sim.id}`);
                if (!sourceCard) return;
                const sourceRect = sourceCard.getBoundingClientRect();

                // Spouse connection
                if (sim.spouseId) {
                    const targetCard = document.getElementById(`sim-card-${sim.spouseId}`);
                    if (targetCard && sim.id < sim.spouseId) {
                        const targetRect = targetCard.getBoundingClientRect();
                        const x1 = sourceRect.left + sourceRect.width / 2 - canvasRect.left;
                        const y1 = sourceRect.top + sourceRect.height / 2 - canvasRect.top;
                        const x2 = targetRect.left + targetRect.width / 2 - canvasRect.left;
                        const y2 = targetRect.top + targetRect.height / 2 - canvasRect.top;

                        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                        line.setAttribute('x1', x1);
                        line.setAttribute('y1', y1);
                        line.setAttribute('x2', x2);
                        line.setAttribute('y2', y2);
                        line.setAttribute('stroke', '#ff4757');
                        line.setAttribute('stroke-width', '3');
                        line.setAttribute('stroke-dasharray', '5,5');
                        svg.appendChild(line);
                    }
                }

                // Parent-Child connection
                if (sim.parentIds && sim.parentIds.length > 0) {
                    sim.parentIds.forEach(parentId => {
                        const parentCard = document.getElementById(`sim-card-${parentId}`);
                        if (parentCard) {
                            const parentRect = parentCard.getBoundingClientRect();
                            const x1 = parentRect.left + parentRect.width / 2 - canvasRect.left;
                            const y1 = parentRect.bottom - canvasRect.top;
                            const x2 = sourceRect.left + sourceRect.width / 2 - canvasRect.left;
                            const y2 = sourceRect.top - canvasRect.top;

                            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                            const midY = y1 + (y2 - y1) / 2;
                            const d = `M ${x1} ${y1} C ${x1} ${midY}, ${x2} ${midY}, ${x2} ${y2}`;
                            path.setAttribute('d', d);
                            path.setAttribute('stroke', '#2ed573');
                            path.setAttribute('stroke-width', '2');
                            path.setAttribute('fill', 'none');
                            svg.appendChild(path);
                        }
                    });
                }
            });
        }

        // BACKGROUNDS
        function openBgModal() {
            const grid = document.getElementById('bgSelectorGrid');
            grid.innerHTML = '';
            const currentTree = getCurrentTree();

            worlds.forEach(w => {
                const card = document.createElement('div');
                card.className = 'bg-option-card';
                if (currentTree.background === w.id) card.style.borderColor = 'var(--accent-color)';
                card.innerHTML = `
                    <img src="${w.img}">
                    <span>${w.name}</span>
                `;
                card.onclick = () => {
                    currentTree.background = w.id;
                    saveTreesToStorage();
                    applyPageBackground();
                    closeBgModal();
                };
                grid.appendChild(card);
            });

            document.getElementById('bgModal').style.display = 'flex';
        }
        function closeBgModal() { document.getElementById('bgModal').style.display = 'none'; }

        // TREES MODAL
        function openTreeModal() {
            renderTreesList();
            document.getElementById('treeModal').style.display = 'flex';
        }
        function closeTreeModal() { document.getElementById('treeModal').style.display = 'none'; }

        function renderTreesList() {
            const list = document.getElementById('treesList');
            list.innerHTML = '';
            trees.forEach(t => {
                const item = document.createElement('div');
                item.style.display = 'flex';
                item.style.justifySpaceBetween = 'space-between';
                item.style.alignItems = 'center';
                item.style.padding = '8px 0';
                item.style.borderBottom = '1px solid var(--border-color)';
                item.innerHTML = `
                    <span>${t.name}</span>
                    ${trees.length > 1 ? `<button class="btn" style="padding:2px 8px; font-size:0.75rem; background:#ff4757; color:white;" onclick="deleteTree('${t.id}')">Törlés</button>` : ''}
                `;
                list.appendChild(item);
            });
        }

        function createNewTree() {
            const nameInput = document.getElementById('newTreeName');
            if (!nameInput.value.trim()) return;
            const newTree = {
                id: 'tree_' + Date.now(),
                name: nameInput.value.trim(),
                background: 'willow_creek',
                sims: [],
                journal: []
            };
            trees.push(newTree);
            currentTreeId = newTree.id;
            saveTreesToStorage();
            nameInput.value = '';
            renderTreeTabs();
            renderTree();
            renderJournalEntries();
            applyPageBackground();
            closeTreeModal();
        }

        function deleteTree(id) {
            if (confirm('Biztosan törlöd ezt a családfát?')) {
                trees = trees.filter(t => t.id !== id);
                if (currentTreeId === id) currentTreeId = trees[0].id;
                saveTreesToStorage();
                renderTreeTabs();
                renderTree();
                renderJournalEntries();
                applyPageBackground();
                renderTreesList();
            }
        }

        // SIM CREATION / EDITING
        function openAddSimModal() {
            document.getElementById('modalTitle').innerText = 'Új Sim Hozzáadása';
            document.getElementById('simId').value = '';
            document.getElementById('simName').value = '';
            document.getElementById('simTitleInput').value = '';
            document.getElementById('simGen').value = '1';
            document.getElementById('simAvatar').value = '';
            document.getElementById('simGallery').value = '';
            document.getElementById('simModal').style.display = 'flex';
        }

        function openEditSimModal(simId) {
            const tree = getCurrentTree();
            const sim = tree.sims.find(s => s.id === simId);
            if (!sim) return;

            document.getElementById('modalTitle').innerText = 'Sim Szerkesztése';
            document.getElementById('simId').value = sim.id;
            document.getElementById('simName').value = sim.name;
            document.getElementById('simTitleInput').value = sim.title || '';
            document.getElementById('simGen').value = sim.gen || 1;
            document.getElementById('simAvatar').value = sim.avatar || '';
            document.getElementById('simGallery').value = sim.gallery ? sim.gallery.join(', ') : '';
            document.getElementById('simModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('simModal').style.display = 'none'; }

        function saveSim() {
            const id = document.getElementById('simId').value;
            const name = document.getElementById('simName').value.trim();
            const title = document.getElementById('simTitleInput').value.trim();
            const gen = parseInt(document.getElementById('simGen').value) || 1;
            const avatar = document.getElementById('simAvatar').value.trim();
            const galleryStr = document.getElementById('simGallery').value.trim();
            const gallery = galleryStr ? galleryStr.split(',').map(s => s.trim()) : [];

            if (!name) return;

            const tree = getCurrentTree();

            if (id) {
                const sim = tree.sims.find(s => s.id === id);
                if (sim) {
                    sim.name = name;
                    sim.title = title;
                    sim.gen = gen;
                    sim.avatar = avatar;
                    sim.gallery = gallery;
                }
            } else {
                const newSim = {
                    id: 'sim_' + Date.now(),
                    name,
                    title,
                    gen,
                    avatar,
                    gallery,
                    spouseId: null,
                    parentIds: [],
                    petIds: []
                };
                tree.sims.push(newSim);
            }

            saveTreesToStorage();
            closeModal();
            renderTree();
        }

        function deleteSim(simId) {
            if (confirm('Biztosan törlöd ezt a Simet?')) {
                const tree = getCurrentTree();
                tree.sims = tree.sims.filter(s => s.id !== simId);
                tree.sims.forEach(s => {
                    if (s.spouseId === simId) s.spouseId = null;
                    if (s.parentIds) s.parentIds = s.parentIds.filter(pid => pid !== simId);
                    if (s.petIds) s.petIds = s.petIds.filter(pid => pid !== simId);
                });
                selectedSimId = null;
                saveTreesToStorage();
                renderTree();
            }
        }

        // CONNECTIONS
        function openConnectModal(simId) {
            const tree = getCurrentTree();
            const sourceSim = tree.sims.find(s => s.id === simId);
            const select = document.getElementById('targetSimSelect');
            select.innerHTML = '';

            tree.sims.filter(s => s.id !== simId).forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.id;
                opt.innerText = `${s.name} (${s.gen}. gen)`;
                select.appendChild(opt);
            });

            document.getElementById('connectModal').style.display = 'flex';
        }

        function closeConnectionModal() { document.getElementById('connectModal').style.display = 'none'; }

        function saveConnection() {
            const tree = getCurrentTree();
            const sourceSim = tree.sims.find(s => s.id === selectedSimId);
            const targetId = document.getElementById('targetSimSelect').value;
            const targetSim = tree.sims.find(s => s.id === targetId);
            const relType = document.getElementById('relType').value;

            if (!sourceSim || !targetSim) return;

            if (relType === 'Házastárs') {
                sourceSim.spouseId = targetSim.id;
                targetSim.spouseId = sourceSim.id;
            } else if (relType === 'Szülő') {
                if (!targetSim.parentIds) targetSim.parentIds = [];
                if (!targetSim.parentIds.includes(sourceSim.id)) targetSim.parentIds.push(sourceSim.id);
            } else if (relType === 'Gyermek') {
                if (!sourceSim.parentIds) sourceSim.parentIds = [];
                if (!sourceSim.parentIds.includes(targetSim.id)) sourceSim.parentIds.push(targetSim.id);
            } else if (relType === 'Állat') {
                if (!sourceSim.petIds) sourceSim.petIds = [];
                if (!sourceSim.petIds.includes(targetSim.id)) sourceSim.petIds.push(targetSim.id);
            }

            saveTreesToStorage();
            closeConnectionModal();
            renderTree();
        }

        // JOURNAL
        function openJournalModal() { document.getElementById('journalModal').style.display = 'flex'; }
        function closeJournalModal() { document.getElementById('journalModal').style.display = 'none'; }

        function saveJournalEntry() {
            const title = document.getElementById('journalTitle').value.trim();
            const text = document.getElementById('journalText').value.trim();
            if (!title || !text) return;

            const tree = getCurrentTree();
            if (!tree.journal) tree.journal = [];

            tree.journal.push({
                id: 'j_' + Date.now(),
                title,
                text,
                date: new Date().toLocaleDateString('hu-HU')
            });

            saveTreesToStorage();
            document.getElementById('journalTitle').value = '';
            document.getElementById('journalText').value = '';
            closeJournalModal();
            renderJournalEntries();
        }

        function renderJournalEntries() {
            const list = document.getElementById('journalEntriesList');
            list.innerHTML = '';
            const tree = getCurrentTree();

            if (!tree.journal || tree.journal.length === 0) {
                list.innerHTML = '<div style="font-size: 0.85rem; color: var(--subtext-color);">Nincsenek bejegyzések.</div>';
                return;
            }

            tree.journal.slice().reverse().forEach(entry => {
                const item = document.createElement('div');
                item.className = 'journal-entry';
                item.innerHTML = `
                    <div style="font-weight: 700; font-size: 0.9rem; margin-bottom: 2px;">${entry.title}</div>
                    <div style="font-size: 0.75rem; color: var(--subtext-color); margin-bottom: 6px;">${entry.date}</div>
                    <div>${entry.text}</div>
                `;
                list.appendChild(item);
            });
        }

        function toggleTheme() {
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.body.removeAttribute('data-theme');
                document.getElementById('themeBtn').innerText = '🌙 Dark';
            } else {
                document.body.setAttribute('data-theme', 'dark');
                document.getElementById('themeBtn').innerText = '☀️ Light';
            }
        }

        const toggleBtn = document.getElementById('toggleBtn');
        const sidebar = document.getElementById('sidebar');

        toggleBtn.onclick = () => {
            sidebar.classList.toggle('open');
            toggleBtn.classList.toggle('open');
        };

        window.onload = () => {
            renderTreeTabs();
            renderTree();
            renderJournalEntries();
            applyPageBackground();
        };

        window.onresize = () => {
            drawConnections();
        };
    </script>
</body>
</html>
