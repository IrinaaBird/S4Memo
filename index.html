<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sims Interaktív Családfa Engine</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; user-select: none; overflow: hidden; }
        
        .tree-viewport {
            background-color: #0f172a;
            background-image: radial-gradient(#334155 1.5px, transparent 1.5px);
            background-size: 32px 32px;
            width: 100vw;
            height: calc(100vh - 73px);
            position: relative;
            overflow: hidden;
            cursor: grab;
        }

        .tree-viewport:active {
            cursor: grabbing;
        }

        #pan-zoom-world {
            position: absolute;
            top: 0;
            left: 0;
            width: 100000px;
            height: 100000px;
            transform-origin: 0 0;
            overflow: visible !important;
        }

        .sim-node {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: absolute;
            z-index: 10;
            cursor: move;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), z-index 0.25s;
        }

        .sim-node.locked {
            cursor: default !important;
        }

        .sim-node.selected {
            z-index: 50 !important;
            transform: scale(1.18) translateY(-10px);
        }

        .sim-node.selected .sim-avatar {
            border-color: #34d399 !important;
            box-shadow: 0 0 30px rgba(52, 211, 153, 0.9), 0 0 10px rgba(255, 255, 255, 0.8) !important;
        }

        .sim-node.selected .selected-badge {
            display: flex !important;
        }

        .sim-avatar-wrapper {
            position: relative;
        }

        .sim-avatar {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            border: 4px solid #10b981;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
            object-fit: cover;
            background-color: #334155;
            transition: box-shadow 0.2s, border-color 0.2s;
            pointer-events: none;
        }

        .sim-node:hover .sim-avatar {
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.8);
        }

        #svg-connectors {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: visible !important;
        }

        .line-parent-child-bg {
            stroke: #059669;
            stroke-width: 5;
            fill: none;
            stroke-linecap: round;
            opacity: 0.5;
            filter: drop-shadow(0 0 6px rgba(16, 185, 129, 0.6));
        }

        .line-parent-child-fg {
            stroke: #6ee7b7;
            stroke-width: 3;
            fill: none;
            stroke-linecap: round;
            stroke-dasharray: 8 12;
            animation: flowGreen 1.5s linear infinite;
        }

        @keyframes flowGreen {
            from { stroke-dashoffset: 40; }
            to { stroke-dashoffset: 0; }
        }

        .line-romantic-bg {
            stroke: #db2777;
            stroke-width: 5;
            fill: none;
            stroke-linecap: round;
            opacity: 0.5;
            filter: drop-shadow(0 0 8px rgba(244, 114, 182, 0.7));
        }

        .line-romantic-fg {
            stroke: #f472b6;
            stroke-width: 3;
            fill: none;
            stroke-linecap: round;
            stroke-dasharray: 6 10;
            animation: flowPink 1.2s linear infinite;
        }

        @keyframes flowPink {
            from { stroke-dashoffset: 32; }
            to { stroke-dashoffset: 0; }
        }

        .line-ex {
            stroke: #64748b;
            stroke-width: 2.5;
            fill: none;
            stroke-dasharray: 4 4;
        }

        #context-menu {
            position: fixed;
            display: none;
            z-index: 10000;
        }
    </style>
</head>
<body class="h-screen flex flex-col justify-between">

    <!-- Bejelentkezési Képernyő -->
    <div id="auth-screen" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl max-w-md w-full shadow-2xl">
            <div class="text-center mb-6">
                <i class="fa-solid fa-gem text-4xl text-emerald-400 mb-2 animate-pulse"></i>
                <h2 class="text-2xl font-bold text-white">Plumtree Legacy Engine</h2>
                <p class="text-xs text-slate-400 mt-1">Lépj be a családfa szerkesztéséhez</p>
            </div>
            <form onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">E-mail cím</label>
                    <input type="email" id="auth-email" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Jelszó</label>
                    <input type="password" id="auth-password" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div class="flex space-x-2 pt-2">
                    <button type="submit" onclick="authMode='login'" class="w-1/2 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-lg text-sm transition">Bejelentkezés</button>
                    <button type="submit" onclick="authMode='register'" class="w-1/2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-semibold py-2.5 rounded-lg text-sm transition">Regisztráció</button>
                </div>
            </form>
            <div id="auth-error" class="mt-4 text-xs text-red-400 text-center hidden"></div>
        </div>
    </div>

    <!-- Jobb Klikk Kontextus Menü -->
    <div id="context-menu" class="bg-slate-900/95 backdrop-blur border border-slate-700 text-slate-200 rounded-xl shadow-2xl py-2 w-56 text-sm">
        <div class="px-3 py-1.5 border-b border-slate-800 text-[11px] font-bold text-slate-400 uppercase tracking-wider" id="ctx-sim-name">Sim Neve</div>
        
        <button id="ctx-rel-direct-btn" onclick="openRelFromCtxDirect()" class="w-full text-left px-4 py-2 hover:bg-pink-950/40 text-pink-300 flex items-center space-x-2 transition font-medium hidden">
            <i class="fa-solid fa-heart text-pink-400 w-4"></i>
            <span id="ctx-rel-direct-text">Kapcsolat összevonása</span>
        </button>

        <button onclick="toggleLockSim()" class="w-full text-left px-4 py-2 hover:bg-slate-800 flex items-center justify-between transition">
            <span id="ctx-lock-text">Pozíció Fixálása</span>
            <i id="ctx-lock-icon" class="fa-solid fa-lock text-amber-400"></i>
        </button>

        <button onclick="openEditFromCtx()" class="w-full text-left px-4 py-2 hover:bg-slate-800 flex items-center space-x-2 transition">
            <i class="fa-solid fa-pen text-blue-400 w-4"></i>
            <span>Szerkesztés</span>
        </button>

        <div class="border-t border-slate-800 my-1"></div>
        <button onclick="deleteSimFromCtx()" class="w-full text-left px-4 py-2 hover:bg-red-900/30 text-red-400 flex items-center space-x-2 transition">
            <i class="fa-solid fa-trash w-4"></i>
            <span>Sim Törlése</span>
        </button>
    </div>

    <!-- Header / Navbar -->
    <header class="bg-slate-900 border-b border-slate-800 text-white shadow-lg relative z-20">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-gem text-3xl text-emerald-400 animate-pulse"></i>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">Plumtree Legacy Engine</h1>
                    <p class="text-xs text-slate-400">Kattintás = Kijelölés • Jobb Klikk = Menü • + Gombok = Kapcsolat hozzáadása</p>
                </div>
            </div>
            <div class="flex items-center space-x-2 bg-slate-800 p-1.5 rounded-xl border border-slate-700">
                <button onclick="changeZoom(-0.1)" class="w-8 h-8 rounded-lg bg-slate-700 hover:bg-slate-600 flex items-center justify-center text-slate-200 transition">
                    <i class="fa-solid fa-minus"></i>
                </button>
                <span id="zoom-percentage" class="text-xs font-mono font-bold w-12 text-center text-emerald-400">100%</span>
                <button onclick="changeZoom(0.1)" class="w-8 h-8 rounded-lg bg-slate-700 hover:bg-slate-600 flex items-center justify-center text-slate-200 transition">
                    <i class="fa-solid fa-plus"></i>
                </button>
                <button onclick="resetZoomPan()" class="px-2 h-8 rounded-lg bg-slate-700 hover:bg-slate-600 text-xs font-semibold text-slate-300 transition" title="Alaphelyzet">
                    <i class="fa-solid fa-rotate-left mr-1"></i> Visszaállít
                </button>
            </div>
            <div class="flex space-x-3">
                <button onclick="openConfigModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg text-xs transition border border-slate-700">
                    <i class="fa-solid fa-key mr-1"></i> Supabase
                </button>
                <button onclick="openAddSimModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-4 py-1.5 rounded-lg text-sm flex items-center space-x-2 transition shadow-lg shadow-emerald-900/40">
                    <i class="fa-solid fa-user-plus"></i>
                    <span>Új Sim</span>
                </button>
                <button onclick="handleLogout()" class="bg-red-900/40 hover:bg-red-900/60 text-red-300 px-3 py-1.5 rounded-lg text-xs transition border border-red-800/50">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Config Modal -->
    <div id="config-modal" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-slate-800 text-slate-100 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-700">
            <h2 class="text-xl font-bold mb-4 flex items-center text-emerald-400">
                <i class="fa-solid fa-database mr-2"></i> Adatbázis Beállítás
            </h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Supabase URL</label>
                    <input type="text" id="cfg-url" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Publishable Key</label>
                    <input type="password" id="cfg-key" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
            </div>
            <div class="mt-6 flex justify-end space-x-2">
                <button onclick="saveConfig()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">Mentés</button>
            </div>
        </div>
    </div>

    <!-- Tree Canvas Area -->
    <main class="w-full h-full relative">
        <div class="tree-viewport" id="viewport">
            <div id="pan-zoom-world">
                <svg id="svg-connectors"></svg>
                <div id="tree-canvas" class="relative z-10"></div>
            </div>
        </div>
    </main>

    <!-- 2 Lépcsős Keresős / Lenyíló Kapcsolatválasztó Modal -->
    <div id="picker-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4" onclick="closePickerModal()">
        <div class="bg-slate-900 border border-slate-700 text-slate-100 rounded-2xl max-w-md w-full p-6 shadow-2xl" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
                <h3 id="picker-title" class="font-bold text-base text-slate-200">Kapcsolat Hozzáadása</h3>
                <button onclick="closePickerModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <!-- 1. LÉPÉS: Sim kiválasztása kereséssel és lenyílóval -->
            <div id="picker-step-1" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">1. Keresés névre</label>
                    <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                        <input type="text" id="picker-search-input" oninput="filterPickerDropdown()" placeholder="Írj be egy nevet..." class="w-full bg-slate-800 border border-slate-700 rounded-xl pl-8 pr-3 py-2 text-sm text-white focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">2. Válassz Simet a listából</label>
                    <select id="picker-sim-select" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:ring-2 focus:ring-emerald-500 outline-none cursor-pointer">
                    </select>
                </div>

                <div class="pt-2 flex justify-between items-center">
                    <button onclick="pickerCreateNewSim()" class="text-xs text-emerald-400 hover:underline flex items-center space-x-1">
                        <i class="fa-solid fa-user-plus"></i>
                        <span>+ Új Sim Létrehozása</span>
                    </button>
                    <button onclick="proceedToStep2()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-4 py-2 rounded-xl text-xs flex items-center space-x-2 transition">
                        <span>Tovább a kapcsolathoz</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </div>

            <!-- 2. LÉPÉS: Kapcsolat típusának kiválasztása lenyílókból -->
            <div id="picker-step-2" class="space-y-4 hidden">
                <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-700 flex items-center justify-between">
                    <div class="text-xs text-slate-300">
                        Kiválasztott Sim: <strong id="selected-target-name" class="text-emerald-400"></strong>
                    </div>
                    <button onclick="backToStep1()" class="text-[11px] text-slate-400 hover:text-white underline">Módosít</button>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Kapcsolat típusa</label>
                    <select id="picker-rel-type-select" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:ring-2 focus:ring-pink-500 outline-none cursor-pointer">
                        <option value="married">💍 Házaspár</option>
                        <option value="engaged">💎 Eljegyzett / Jegyesek</option>
                        <option value="partner">❤️ Párkapcsolat / Partner</option>
                        <option value="parent_child">👶 Szülő - Gyerek kapcsolat</option>
                        <option value="ex">💔 Ex-partner / Elvált</option>
                    </select>
                </div>

                <div class="pt-3 flex justify-end space-x-2">
                    <button onclick="closePickerModal()" class="px-3 py-2 text-xs text-slate-400 hover:text-white">Mégse</button>
                    <button onclick="confirmPickerRelationship()" class="bg-pink-600 hover:bg-pink-500 text-white font-semibold px-5 py-2 rounded-xl text-xs transition flex items-center space-x-2 shadow-lg shadow-pink-900/30">
                        <i class="fa-solid fa-check"></i>
                        <span>Kapcsolat Mentése</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Relationship Selection Modal (Jobb klikkes menünek) -->
    <div id="relationship-modal" class="fixed inset-0 bg-black/75 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-slate-800 text-slate-100 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-pink-500/30 text-center">
            <div class="flex justify-center items-center space-x-4 mb-4">
                <img id="rel-sim1-img" class="w-16 h-16 rounded-full border-2 border-emerald-500 object-cover">
                <i class="fa-solid fa-heart text-2xl text-pink-400 animate-bounce"></i>
                <img id="rel-sim2-img" class="w-16 h-16 rounded-full border-2 border-emerald-500 object-cover">
            </div>
            <h3 class="text-lg font-bold text-slate-100 mb-1" id="rel-title">Milyen kapcsolatban állnak?</h3>
            <p class="text-xs text-slate-400 mb-6" id="rel-subtitle"></p>

            <div class="space-y-2">
                <button onclick="setRelationship('married')" class="w-full bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 border border-amber-500/40 p-3 rounded-xl font-semibold flex items-center justify-between transition">
                    <span>💍 Házaspár</span>
                    <i class="fa-solid fa-rings-wedding text-amber-400"></i>
                </button>
                <button onclick="setRelationship('engaged')" class="w-full bg-pink-500/10 hover:bg-pink-500/20 text-pink-300 border border-pink-500/40 p-3 rounded-xl font-semibold flex items-center justify-between transition">
                    <span>💎 Eljegyzett / Jegyesek</span>
                    <i class="fa-solid fa-gem text-pink-400"></i>
                </button>
                <button onclick="setRelationship('partner')" class="w-full bg-rose-500/10 hover:bg-rose-500/20 text-rose-300 border border-rose-500/40 p-3 rounded-xl font-semibold flex items-center justify-between transition">
                    <span>❤️ Párkapcsolat / Partner</span>
                    <i class="fa-solid fa-heart text-rose-400"></i>
                </button>
                <button onclick="setRelationship('parent_child')" class="w-full bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 p-3 rounded-xl font-semibold flex items-center justify-between transition">
                    <span>👶 Szülő - Gyerek kapcsolat</span>
                    <i class="fa-solid fa-child text-emerald-400"></i>
                </button>
                <button onclick="setRelationship('ex')" class="w-full bg-slate-700/40 hover:bg-slate-700/60 text-slate-300 border border-slate-600 p-3 rounded-xl font-semibold flex items-center justify-between transition">
                    <span>💔 Ex-partner / Elvált</span>
                    <i class="fa-solid fa-heart-crack text-slate-400"></i>
                </button>
                <button onclick="clearRelationship()" class="w-full bg-red-900/20 hover:bg-red-900/40 text-red-400 border border-red-800/40 p-2.5 rounded-xl text-xs font-semibold transition mt-2">
                     Kapcsolat megszüntetése
                </button>
            </div>

            <button onclick="closeRelModal()" class="mt-4 text-xs text-slate-400 hover:text-slate-200">Mégse</button>
        </div>
    </div>

    <!-- Add / Edit Sim Modal -->
    <div id="sim-modal" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-slate-800 text-slate-100 rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-700 max-h-[90vh] overflow-y-auto">
            <h2 class="text-xl font-bold mb-4 flex items-center text-emerald-400" id="modal-title">
                <i class="fa-solid fa-user-plus mr-2"></i> Új Sim Felvétele a Fára
            </h2>
            <form id="sim-form" onsubmit="handleSaveSim(event)" class="space-y-4">
                <input type="hidden" id="sim-edit-id" value="">

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Keresztnév *</label>
                        <input type="text" id="sim-firstname" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Vezetéknév *</label>
                        <input type="text" id="sim-lastname" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Szülő kiválasztása</label>
                        <select id="sim-parent" onchange="autoCalculateGen()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:ring-2 focus:ring-emerald-500 outline-none">
                            <option value="">-- Nincs szülő (Alapító) --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Generáció</label>
                        <input type="number" id="sim-generation" min="1" value="1" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Életszakasz</label>
                        <select id="sim-lifestage" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:ring-2 focus:ring-emerald-500 outline-none">
                            <option value="Kisgyerek">Kisgyerek</option>
                            <option value="Gyerek">Gyerek</option>
                            <option value="Tini">Tini</option>
                            <option value="Fiatal Felnőtt" selected>Fiatal Felnőtt</option>
                            <option value="Felnőtt">Felnőtt</option>
                            <option value="Idős">Idős</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Lény típus (Occult)</label>
                        <select id="sim-occult" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:ring-2 focus:ring-emerald-500 outline-none">
                            <option value="Ember">Ember</option>
                            <option value="Vámpír">Vámpír</option>
                            <option value="Vérfarkas">Vérfarkas</option>
                            <option value="Varázshasználó">Varázshasználó</option>
                            <option value="Sellő">Sellő</option>
                            <option value="Földönkívüli">Földönkívüli</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Fotó URL vagy Kép feltöltés</label>
                    <input type="text" id="sim-photo-url" placeholder="https://..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white mb-2 focus:ring-2 focus:ring-emerald-500 outline-none">
                    <input type="file" id="sim-file" accept="image/*" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-300 focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Jellemvonások (vesszővel elválasztva)</label>
                    <input type="text" id="sim-traits" placeholder="pl. Könyvmoly, Zseni" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>

                <div class="flex justify-end space-x-2 pt-4">
                    <button type="button" onclick="closeSimModal()" class="px-4 py-2 rounded-lg text-sm text-slate-400 hover:bg-slate-700">Mégse</button>
                    <button type="submit" id="save-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">Mentés Családfára</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let supabaseClient = null;
        let localSims = [];
        let selectedSimId = null;
        let authMode = 'login';

        // Pan & Zoom állapot
        let scale = 1;
        let panX = 100;
        let panY = 100;
        let isPanning = false;
        let startPanX = 0;
        let startPanY = 0;

        // Node Dragging állapot
        let activeDragNode = null;
        let isDraggingNode = false;
        let dragOffsetX = 0;
        let dragOffsetY = 0;
        let contextSimId = null;

        // Pozíciók local storage mentése
        let simPositions = {};

        // Picker Modal állapot
        let pickerSourceSimId = null;
        let pickerTargetSimId = null;
        let pickerMode = null;

        window.addEventListener('DOMContentLoaded', async () => {
            const savedPositions = localStorage.getItem('sim_positions');
            if (savedPositions) {
                try { simPositions = JSON.parse(savedPositions); } catch(e){}
            }

            const savedUrl = localStorage.getItem('supabase_url') || 'https://xyz.supabase.co';
            const savedKey = localStorage.getItem('supabase_key') || 'public-key';
            
            initSupabase(savedUrl, savedKey);
            setupPanZoomListeners();

            window.addEventListener('click', () => {
                document.getElementById('context-menu').style.display = 'none';
            });
        });

        function savePositionsToStorage() {
            localStorage.setItem('sim_positions', JSON.stringify(simPositions));
        }

        /* --- AUTHENTICATION --- */
        function initSupabase(url, key) {
            try {
                supabaseClient = supabase.createClient(url, key);
                checkUser();
            } catch(e) { console.error("Supabase kapcsolódási hiba:", e); }
        }

        async function checkUser() {
            if(!supabaseClient) return;
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                document.getElementById('auth-screen').classList.add('hidden');
                fetchSims();
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
            }
        }

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const errDiv = document.getElementById('auth-error');
            errDiv.classList.add('hidden');

            let result;
            if (authMode === 'login') {
                result = await supabaseClient.auth.signInWithPassword({ email, password });
            } else {
                result = await supabaseClient.auth.signUp({ email, password });
            }

            if (result.error) {
                errDiv.textContent = result.error.message;
                errDiv.classList.remove('hidden');
            } else {
                document.getElementById('auth-screen').classList.add('hidden');
                fetchSims();
            }
        }

        async function handleLogout() {
            if(supabaseClient) {
                await supabaseClient.auth.signOut();
                document.getElementById('auth-screen').classList.remove('hidden');
            }
        }

        /* --- MOZGATÁS ÉS ZOOMA LOGIKA --- */
        function setupPanZoomListeners() {
            const viewport = document.getElementById('viewport');

            viewport.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
                applyZoom(zoomFactor, e.clientX, e.clientY);
            }, { passive: false });

            viewport.addEventListener('mousedown', (e) => {
                if (e.button === 0 && !activeDragNode) {
                    isPanning = true;
                    startPanX = e.clientX - panX;
                    startPanY = e.clientY - panY;
                }
            });

            window.addEventListener('mousemove', (e) => {
                if (activeDragNode) {
                    isDraggingNode = true;
                    const world = document.getElementById('pan-zoom-world').getBoundingClientRect();
                    const newX = (e.clientX - world.left) / scale - dragOffsetX;
                    const newY = (e.clientY - world.top) / scale - dragOffsetY;

                    activeDragNode.style.left = `${newX}px`;
                    activeDragNode.style.top = `${newY}px`;

                    const simId = activeDragNode.dataset.simId;
                    if (!simPositions[simId]) simPositions[simId] = {};
                    simPositions[simId].x = newX;
                    simPositions[simId].y = newY;

                    drawConnectors();
                } else if (isPanning) {
                    panX = e.clientX - startPanX;
                    panY = e.clientY - startPanY;
                    updateWorldTransform();
                }
            });

            window.addEventListener('mouseup', (e) => {
                if (e.button === 0) {
                    isPanning = false;
                    if (activeDragNode) {
                        activeDragNode = null;
                        savePositionsToStorage();
                    }
                }
            });

            viewport.addEventListener('contextmenu', e => e.preventDefault());
        }

        function applyZoom(factor, cursorX = window.innerWidth / 2, cursorY = window.innerHeight / 2) {
            const newScale = Math.min(Math.max(0.3, scale * factor), 2.5);
            panX = cursorX - (cursorX - panX) * (newScale / scale);
            panY = cursorY - (cursorY - panY) * (newScale / scale);
            scale = newScale;
            updateWorldTransform();
        }

        function changeZoom(delta) { applyZoom(1 + delta); }

        function resetZoomPan() {
            scale = 1;
            panX = 100;
            panY = 100;
            updateWorldTransform();
        }

        function updateWorldTransform() {
            const world = document.getElementById('pan-zoom-world');
            world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
            document.getElementById('zoom-percentage').textContent = `${Math.round(scale * 100)}%`;
        }

        /* --- CONFIG MODAL --- */
        function openConfigModal() {
            document.getElementById('cfg-url').value = localStorage.getItem('supabase_url') || '';
            document.getElementById('cfg-key').value = localStorage.getItem('supabase_key') || '';
            document.getElementById('config-modal').classList.remove('hidden');
        }

        function saveConfig() {
            const url = document.getElementById('cfg-url').value.trim();
            const key = document.getElementById('cfg-key').value.trim();
            if(url && key) {
                localStorage.setItem('supabase_url', url);
                localStorage.setItem('supabase_key', key);
                document.getElementById('config-modal').classList.add('hidden');
                initSupabase(url, key);
            }
        }

        /* --- ADATBÁZIS ÉS KIRAJZOLÁS --- */
        async function fetchSims() {
            if(!supabaseClient) return;
            const { data, error } = await supabaseClient.from('sims').select('*');
            if(!error && data) {
                localSims = data;
                renderTree();
            }
        }

        function selectSim(simId) {
            selectedSimId = (selectedSimId === simId) ? null : simId;
            renderTree();
        }

        function renderTree() {
            const canvas = document.getElementById('tree-canvas');
            canvas.innerHTML = '';

            if(localSims.length === 0) {
                canvas.innerHTML = `
                    <div class="text-center py-40 text-slate-400">
                        <i class="fa-solid fa-sitemap text-5xl text-emerald-500/50 mb-4"></i>
                        <h3 class="text-xl font-bold text-slate-200">A Családfád még üres!</h3>
                        <p class="text-sm mt-1">Kattints az "Új Sim" gombra az 1. generáció felvételéhez.</p>
                    </div>
                `;
                document.getElementById('svg-connectors').innerHTML = '';
                return;
            }

            localSims.forEach((sim) => {
                const gen = parseInt(sim.generation) || 1;
                
                if (!simPositions[sim.id]) {
                    const rowSims = localSims.filter(s => (parseInt(s.generation) || 1) === gen);
                    const simIndexInRow = rowSims.findIndex(s => s.id === sim.id);
                    simPositions[sim.id] = {
                        x: 200 + simIndexInRow * 220,
                        y: 100 + (gen - 1) * 200,
                        isLocked: false
                    };
                }

                const pos = simPositions[sim.id];
                const isSelected = selectedSimId === sim.id;

                const node = document.createElement('div');
                node.className = `sim-node ${pos.isLocked ? 'locked' : ''} ${isSelected ? 'selected' : ''}`;
                node.id = `sim-node-${sim.id}`;
                node.dataset.simId = sim.id;
                node.style.left = `${pos.x}px`;
                node.style.top = `${pos.y}px`;

                const avatarUrl = sim.photo_url || 'https://via.placeholder.com/150/334155/10b981?text=Sim';

                node.innerHTML = `
                    <div class="sim-avatar-wrapper">
                        <img src="${avatarUrl}" class="sim-avatar" alt="${sim.first_name}">
                        <div class="selected-badge hidden absolute -top-2 -right-2 bg-emerald-500 text-slate-950 w-6 h-6 rounded-full items-center justify-center font-bold text-xs shadow-lg">
                            <i class="fa-solid fa-check"></i>
                        </div>
                    </div>
                    <div class="mt-2 text-center bg-slate-900/90 border border-slate-700/80 px-3 py-1.5 rounded-xl backdrop-blur shadow-lg min-w-[120px]">
                        <div class="font-bold text-xs text-slate-100">${sim.first_name} ${sim.last_name}</div>
                        <div class="text-[10px] text-emerald-400 font-medium">${sim.lifestage || ''} • ${sim.occult || 'Ember'}</div>
                    </div>
                    <div class="flex space-x-1 mt-1">
                        <button onclick="event.stopPropagation(); openPickerModal('${sim.id}', 'partner')" class="w-6 h-6 rounded-full bg-pink-600/80 hover:bg-pink-500 text-white text-[10px] flex items-center justify-center shadow transition" title="Partner hozzáadása">
                            <i class="fa-solid fa-heart"></i>
                        </button>
                        <button onclick="event.stopPropagation(); openPickerModal('${sim.id}', 'child')" class="w-6 h-6 rounded-full bg-emerald-600/80 hover:bg-emerald-500 text-white text-[10px] flex items-center justify-center shadow transition" title="Gyerek hozzáadása">
                            <i class="fa-solid fa-child"></i>
                        </button>
                    </div>
                `;

                node.addEventListener('mousedown', (e) => {
                    if (e.button === 0 && !pos.isLocked) {
                        activeDragNode = node;
                        isDraggingNode = false;
                        const world = document.getElementById('pan-zoom-world').getBoundingClientRect();
                        dragOffsetX = (e.clientX - world.left) / scale - node.offsetLeft;
                        dragOffsetY = (e.clientY - world.top) / scale - node.offsetTop;
                    }
                });

                node.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (!isDraggingNode) {
                        selectSim(sim.id);
                    }
                });

                node.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    openContextMenu(e, sim);
                });

                canvas.appendChild(node);
            });

            drawConnectors();
        }

        /* --- CSATLAKOZÓ VONALAK RAJZOLÁSA (SVG) --- */
        function drawConnectors() {
            const svg = document.getElementById('svg-connectors');
            svg.innerHTML = '';

            localSims.forEach(sim => {
                // Szülő - Gyerek kapcsolat rajzolása
                if (sim.parent_id) {
                    const parentNode = document.getElementById(`sim-node-${sim.parent_id}`);
                    const childNode = document.getElementById(`sim-node-${sim.id}`);

                    if (parentNode && childNode) {
                        const pPos = simPositions[sim.parent_id];
                        const cPos = simPositions[sim.id];

                        const x1 = pPos.x + 44;
                        const y1 = pPos.y + 88;
                        const x2 = cPos.x + 44;
                        const y2 = cPos.y;

                        const pathBg = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        const pathFg = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        const d = `M ${x1} ${y1} C ${x1} ${(y1 + y2) / 2}, ${x2} ${(y1 + y2) / 2}, ${x2} ${y2}`;

                        pathBg.setAttribute('d', d);
                        pathBg.setAttribute('class', 'line-parent-child-bg');
                        pathFg.setAttribute('d', d);
                        pathFg.setAttribute('class', 'line-parent-child-fg');

                        svg.appendChild(pathBg);
                        svg.appendChild(pathFg);
                    }
                }

                // Házastárs / Párkapcsolat rajzolása
                if (sim.partner_id && sim.id < sim.partner_id) {
                    const p1Pos = simPositions[sim.id];
                    const p2Pos = simPositions[sim.partner_id];

                    if (p1Pos && p2Pos) {
                        const x1 = p1Pos.x + 44;
                        const y1 = p1Pos.y + 44;
                        const x2 = p2Pos.x + 44;
                        const y2 = p2Pos.y + 44;

                        const pathBg = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        const pathFg = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        const d = `M ${x1} ${y1} L ${x2} ${y2}`;

                        const isEx = sim.relationship_type === 'ex';
                        pathBg.setAttribute('d', d);
                        pathBg.setAttribute('class', isEx ? 'line-ex' : 'line-romantic-bg');
                        svg.appendChild(pathBg);

                        if (!isEx) {
                            pathFg.setAttribute('d', d);
                            pathFg.setAttribute('class', 'line-romantic-fg');
                            svg.appendChild(pathFg);
                        }
                    }
                }
            });
        }

        /* --- KONTEXTUS MENÜ (JOBB KLIKK) --- */
        function openContextMenu(e, sim) {
            contextSimId = sim.id;
            const menu = document.getElementById('context-menu');
            document.getElementById('ctx-sim-name').textContent = `${sim.first_name} ${sim.last_name}`;

            const pos = simPositions[sim.id] || {};
            document.getElementById('ctx-lock-text').textContent = pos.isLocked ? 'Pozíció Feloldása' : 'Pozíció Fixálása';
            document.getElementById('ctx-lock-icon').className = pos.isLocked ? 'fa-solid fa-unlock text-emerald-400' : 'fa-solid fa-lock text-amber-400';

            const directBtn = document.getElementById('ctx-rel-direct-btn');
            if (selectedSimId && selectedSimId !== sim.id) {
                const selectedSim = localSims.find(s => s.id === selectedSimId);
                document.getElementById('ctx-rel-direct-text').textContent = `Összekötés: ${selectedSim.first_name}-val`;
                directBtn.classList.remove('hidden');
            } else {
                directBtn.classList.add('hidden');
            }

            menu.style.left = `${e.clientX}px`;
            menu.style.top = `${e.clientY}px`;
            menu.style.display = 'block';
        }

        function toggleLockSim() {
            if (!contextSimId) return;
            if (!simPositions[contextSimId]) simPositions[contextSimId] = {};
            simPositions[contextSimId].isLocked = !simPositions[contextSimId].isLocked;
            savePositionsToStorage();
            renderTree();
        }

        function openEditFromCtx() {
            if (!contextSimId) return;
            const sim = localSims.find(s => s.id === contextSimId);
            if (sim) openEditSimModal(sim);
        }

        async function deleteSimFromCtx() {
            if (!contextSimId) return;
            if (confirm("Biztosan törölni szeretnéd ezt a Simet a családfáról?")) {
                await supabaseClient.from('sims').delete().eq('id', contextSimId);
                delete simPositions[contextSimId];
                savePositionsToStorage();
                fetchSims();
            }
        }

        /* --- KAPCSOLAT KIVÁLASZTÓ (PICKER MODAL) --- */
        function openPickerModal(sourceSimId, mode) {
            pickerSourceSimId = sourceSimId;
            pickerMode = mode;
            pickerTargetSimId = null;

            const modal = document.getElementById('picker-modal');
            document.getElementById('picker-step-1').classList.remove('hidden');
            document.getElementById('picker-step-2').classList.add('hidden');
            document.getElementById('picker-search-input').value = '';

            const title = mode === 'partner' ? 'Partner / Házastárs Kapcsolása' : 'Gyerek Kapcsolása';
            document.getElementById('picker-title').textContent = title;

            populatePickerDropdown();
            modal.classList.remove('hidden');
        }

        function closePickerModal() {
            document.getElementById('picker-modal').classList.add('hidden');
        }

        function populatePickerDropdown() {
            const select = document.getElementById('picker-sim-select');
            select.innerHTML = '';

            const available = localSims.filter(s => s.id !== pickerSourceSimId);
            if (available.length === 0) {
                select.innerHTML = '<option value="">Nincs más Sim a fán...</option>';
                return;
            }

            available.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.id;
                opt.textContent = `${s.first_name} ${s.last_name} (${s.lifestage || 'Fiatal Felnőtt'})`;
                select.appendChild(opt);
            });
        }

        function filterPickerDropdown() {
            const q = document.getElementById('picker-search-input').value.toLowerCase();
            const select = document.getElementById('picker-sim-select');
            select.innerHTML = '';

            const filtered = localSims.filter(s => s.id !== pickerSourceSimId && `${s.first_name} ${s.last_name}`.toLowerCase().includes(q));
            filtered.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.id;
                opt.textContent = `${s.first_name} ${s.last_name} (${s.lifestage || 'Fiatal Felnőtt'})`;
                select.appendChild(opt);
            });
        }

        function proceedToStep2() {
            const select = document.getElementById('picker-sim-select');
            if (!select.value) return;

            pickerTargetSimId = select.value;
            const targetSim = localSims.find(s => s.id === pickerTargetSimId);

            document.getElementById('selected-target-name').textContent = `${targetSim.first_name} ${targetSim.last_name}`;
            
            const relTypeSelect = document.getElementById('picker-rel-type-select');
            relTypeSelect.value = pickerMode === 'partner' ? 'married' : 'parent_child';

            document.getElementById('picker-step-1').classList.add('hidden');
            document.getElementById('picker-step-2').classList.remove('hidden');
        }

        function backToStep1() {
            document.getElementById('picker-step-2').classList.add('hidden');
            document.getElementById('picker-step-1').classList.remove('hidden');
        }

        async function confirmPickerRelationship() {
            const type = document.getElementById('picker-rel-type-select').value;

            if (type === 'parent_child') {
                await supabaseClient.from('sims').update({ parent_id: pickerSourceSimId }).eq('id', pickerTargetSimId);
            } else {
                await supabaseClient.from('sims').update({ partner_id: pickerTargetSimId, relationship_type: type }).eq('id', pickerSourceSimId);
                await supabaseClient.from('sims').update({ partner_id: pickerSourceSimId, relationship_type: type }).eq('id', pickerTargetSimId);
            }

            closePickerModal();
            fetchSims();
        }

        function pickerCreateNewSim() {
            closePickerModal();
            openAddSimModal();
        }

        /* --- JOBB KLIKKES ÖSSZEVONÁS (DIRECT REL) --- */
        function openRelFromCtxDirect() {
            if (!selectedSimId || !contextSimId) return;
            const sim1 = localSims.find(s => s.id === selectedSimId);
            const sim2 = localSims.find(s => s.id === contextSimId);

            document.getElementById('rel-sim1-img').src = sim1.photo_url || 'https://via.placeholder.com/150';
            document.getElementById('rel-sim2-img').src = sim2.photo_url || 'https://via.placeholder.com/150';
            document.getElementById('rel-subtitle').textContent = `${sim1.first_name} és ${sim2.first_name}`;

            document.getElementById('relationship-modal').classList.remove('hidden');
        }

        function closeRelModal() {
            document.getElementById('relationship-modal').classList.add('hidden');
        }

        async function setRelationship(type) {
            if (!selectedSimId || !contextSimId) return;

            if (type === 'parent_child') {
                await supabaseClient.from('sims').update({ parent_id: selectedSimId }).eq('id', contextSimId);
            } else {
                await supabaseClient.from('sims').update({ partner_id: contextSimId, relationship_type: type }).eq('id', selectedSimId);
                await supabaseClient.from('sims').update({ partner_id: selectedSimId, relationship_type: type }).eq('id', contextSimId);
            }

            closeRelModal();
            fetchSims();
        }

        async function clearRelationship() {
            if (!selectedSimId || !contextSimId) return;
            await supabaseClient.from('sims').update({ partner_id: null, relationship_type: null }).eq('id', selectedSimId);
            await supabaseClient.from('sims').update({ partner_id: null, relationship_type: null }).eq('id', contextSimId);
            await supabaseClient.from('sims').update({ parent_id: null }).eq('id', contextSimId);
            closeRelModal();
            fetchSims();
        }

        /* --- SIM LÉTREHOZÁSA ÉS SZERKESZTÉSE --- */
        function openAddSimModal() {
            document.getElementById('modal-title').innerHTML = `<i class="fa-solid fa-user-plus mr-2"></i> Új Sim Felvétele a Fára`;
            document.getElementById('sim-edit-id').value = '';
            document.getElementById('sim-form').reset();
            
            populateParentDropdown();
            document.getElementById('sim-modal').classList.remove('hidden');
        }

        function openEditSimModal(sim) {
            document.getElementById('modal-title').innerHTML = `<i class="fa-solid fa-user-pen mr-2"></i> Sim Szerkesztése`;
            document.getElementById('sim-edit-id').value = sim.id;
            document.getElementById('sim-firstname').value = sim.first_name;
            document.getElementById('sim-lastname').value = sim.last_name;
            document.getElementById('sim-generation').value = sim.generation || 1;
            document.getElementById('sim-lifestage').value = sim.lifestage || 'Fiatal Felnőtt';
            document.getElementById('sim-occult').value = sim.occult || 'Ember';
            document.getElementById('sim-photo-url').value = sim.photo_url || '';
            document.getElementById('sim-traits').value = sim.traits ? sim.traits.join(', ') : '';

            populateParentDropdown(sim.id);
            document.getElementById('sim-parent').value = sim.parent_id || '';
            document.getElementById('sim-modal').classList.remove('hidden');
        }

        function closeSimModal() {
            document.getElementById('sim-modal').classList.add('hidden');
        }

        function populateParentDropdown(excludeId = null) {
            const select = document.getElementById('sim-parent');
            select.innerHTML = '<option value="">-- Nincs szülő (Alapító) --</option>';

            localSims.filter(s => s.id !== excludeId).forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.id;
                opt.textContent = `${s.first_name} ${s.last_name} (Gen ${s.generation || 1})`;
                select.appendChild(opt);
            });
        }

        function autoCalculateGen() {
            const parentId = document.getElementById('sim-parent').value;
            if (parentId) {
                const parent = localSims.find(s => s.id === parentId);
                if (parent) {
                    document.getElementById('sim-generation').value = (parseInt(parent.generation) || 1) + 1;
                }
            }
        }

        async function handleSaveSim(e) {
            e.preventDefault();
            const editId = document.getElementById('sim-edit-id').value;

            const firstName = document.getElementById('sim-firstname').value;
            const lastName = document.getElementById('sim-lastname').value;
            const parentId = document.getElementById('sim-parent').value || null;
            const generation = parseInt(document.getElementById('sim-generation').value) || 1;
            const lifestage = document.getElementById('sim-lifestage').value;
            const occult = document.getElementById('sim-occult').value;
            let photoUrl = document.getElementById('sim-photo-url').value;
            const traitsInput = document.getElementById('sim-traits').value;
            const traits = traitsInput ? traitsInput.split(',').map(t => t.trim()) : [];

            const fileInput = document.getElementById('sim-file');
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const fileExt = file.name.split('.').pop();
                const fileName = `${Math.random()}.${fileExt}`;
                const { data, error } = await supabaseClient.storage.from('sim-photos').upload(fileName, file);

                if (!error && data) {
                    const { data: publicUrlData } = supabaseClient.storage.from('sim-photos').getPublicUrl(fileName);
                    photoUrl = publicUrlData.publicUrl;
                }
            }

            const simData = {
                first_name: firstName,
                last_name: lastName,
                parent_id: parentId,
                generation: generation,
                lifestage: lifestage,
                occult: occult,
                photo_url: photoUrl,
                traits: traits
            };

            if (editId) {
                await supabaseClient.from('sims').update(simData).eq('id', editId);
            } else {
                await supabaseClient.from('sims').insert([simData]);
            }

            closeSimModal();
            fetchSims();
        }
    </script>
</body>
</html>
