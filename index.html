<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S4Memo - Sims 4 Memorable</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4ede6;
            --bg-pattern: radial-gradient(#d5c4b3 1.5px, transparent 1.5px);
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-solid: #ffffff;
            --text-color: #2c221e;
            --subtext-color: #7a6a60;
            --border-color: rgba(213, 196, 179, 0.5);
            --accent-color: #2ed573;
            --accent-hover: #26af5f;
            --active-glow: rgba(46, 213, 115, 0.35);
            --shadow-color: rgba(44, 34, 30, 0.08);
            --nav-bg: rgba(255, 255, 255, 0.75);
            --input-bg: #fcf9f6;

            --btn-pink: #ff5e7e;
            --btn-pink-hover: #e04867;
            --btn-green: #2ed573;
            --btn-green-hover: #24b05d;
            --line-pink: #ff5e7e;
            --line-green: #2ed573;
            --line-blue: #70a1ff;

            --sim-node-clip-path: none;
            --sim-node-radius: 50%;
            --line-stroke-width: 3.5px;
            
            --custom-bg-size: cover;
            --custom-bg-position: center;
            --bg-blur: 0px;
        }

        [data-theme="dark"] {
            --bg-color: #121110;
            --bg-pattern: radial-gradient(#2a2623 1.5px, transparent 1.5px);
            --card-bg: rgba(30, 26, 24, 0.85);
            --card-solid: #1e1a18;
            --text-color: #f5ebe6;
            --subtext-color: #a39288;
            --border-color: rgba(60, 50, 45, 0.6);
            --accent-color: #2ed573;
            --accent-hover: #3be380;
            --active-glow: rgba(46, 213, 115, 0.4);
            --shadow-color: rgba(0, 0, 0, 0.4);
            --nav-bg: rgba(24, 20, 18, 0.75);
            --input-bg: #26211e;

            --btn-pink: #ff5e7e;
            --btn-pink-hover: #ff3b61;
            --btn-green: #2ed573;
            --btn-green-hover: #219d52;
            --line-pink: #ff5e7e;
            --line-green: #2ed573;
            --line-blue: #70a1ff;
        }

        #bgBlurOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            backdrop-filter: blur(var(--bg-blur));
            -webkit-backdrop-filter: blur(var(--bg-blur));
            transition: backdrop-filter 0.1s ease;
        }

        body.bg-dots { background-image: var(--bg-pattern); background-size: 24px 24px; }
        body.bg-clean { background-image: none !important; }
        body.bg-grid { 
            background-image: linear-gradient(var(--border-color) 1px, transparent 1px), linear-gradient(90deg, var(--border-color) 1px, transparent 1px);
            background-size: 30px 30px; 
        }
        body.bg-custom {
            background-size: var(--custom-bg-size);
            background-position: var(--custom-bg-position);
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        * {
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* ANIMÁCIÓK */
        @keyframes pulseGlowPath {
            0% { stroke-dashoffset: 200; opacity: 0.8; }
            50% { opacity: 1; }
            100% { stroke-dashoffset: 0; opacity: 0.8; }
        }

        @keyframes flickerPath {
            0%, 100% { opacity: 1; filter: drop-shadow(0 0 8px rgba(255, 94, 126, 0.8)); }
            50% { opacity: 0.5; filter: drop-shadow(0 0 2px rgba(255, 94, 126, 0.2)); }
        }

        @keyframes flowDots {
            from { stroke-dashoffset: 40; }
            to { stroke-dashoffset: 0; }
        }

        svg path {
            fill: none !important;
            stroke-linecap: round;
        }

        .style-glow .line-love {
            stroke: var(--line-pink); stroke-width: var(--line-stroke-width);
            stroke-dasharray: 140 30; animation: pulseGlowPath 2.5s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 8px rgba(255, 94, 126, 0.6));
        }
        .style-glow .line-child {
            stroke: var(--line-green); stroke-width: var(--line-stroke-width);
            stroke-dasharray: 140 30; animation: pulseGlowPath 2.5s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 8px rgba(46, 213, 115, 0.6));
        }
        .style-glow .line-sibling {
            stroke: var(--line-blue); stroke-width: var(--line-stroke-width);
            stroke-dasharray: 140 30; animation: pulseGlowPath 2.5s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 8px rgba(112, 161, 255, 0.6));
        }

        .style-solid .line-love { stroke: var(--line-pink); stroke-width: var(--line-stroke-width); filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15)); }
        .style-solid .line-child { stroke: var(--line-green); stroke-width: var(--line-stroke-width); filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15)); }
        .style-solid .line-sibling { stroke: var(--line-blue); stroke-width: var(--line-stroke-width); filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15)); }

        .style-dashed .line-love { stroke: var(--line-pink); stroke-width: var(--line-stroke-width); stroke-dasharray: 8 6; }
        .style-dashed .line-child { stroke: var(--line-green); stroke-width: var(--line-stroke-width); stroke-dasharray: 8 6; }
        .style-dashed .line-sibling { stroke: var(--line-blue); stroke-width: var(--line-stroke-width); stroke-dasharray: 8 6; }

        .style-flicker .line-love { stroke: var(--line-pink); stroke-width: var(--line-stroke-width); animation: flickerPath 1.8s infinite ease-in-out; }
        .style-flicker .line-child { stroke: var(--line-green); stroke-width: var(--line-stroke-width); animation: flickerPath 2.2s infinite ease-in-out; }
        .style-flicker .line-sibling { stroke: var(--line-blue); stroke-width: var(--line-stroke-width); animation: flickerPath 2.0s infinite ease-in-out; }

        .style-dots-flow .line-love { stroke: var(--line-pink); stroke-width: var(--line-stroke-width); stroke-dasharray: 6 10; animation: flowDots 1s linear infinite; }
        .style-dots-flow .line-child { stroke: var(--line-green); stroke-width: var(--line-stroke-width); stroke-dasharray: 6 10; animation: flowDots 1s linear infinite; }
        .style-dots-flow .line-sibling { stroke: var(--line-blue); stroke-width: var(--line-stroke-width); stroke-dasharray: 6 10; animation: flowDots 1s linear infinite; }

        /* TESTRESZABÁSI PANEL */
        .style-panel-drawer {
            position: fixed; bottom: 24px; left: 24px; z-index: 1060;
            background-color: var(--nav-bg); border: 1px solid var(--border-color);
            border-radius: 20px; box-shadow: 0 12px 32px var(--shadow-color);
            width: 260px; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        }

        .style-panel-header {
            padding: 10px 16px; font-weight: 800; font-size: 12px;
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; background: rgba(255, 255, 255, 0.05); border-bottom: 1px solid var(--border-color);
            user-select: none; letter-spacing: 0.5px;
        }

        .style-panel-content {
            padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;
            max-height: 0; opacity: 0; transition: all 0.25s ease; pointer-events: none;
        }

        .style-panel-drawer.open .style-panel-content {
            max-height: 560px; opacity: 1; pointer-events: all;
        }

        .style-group { display: flex; flex-direction: column; gap: 4px; text-align: left; }
        .style-group label { font-size: 10px; font-weight: 800; color: var(--subtext-color); text-transform: uppercase; letter-spacing: 0.5px; display: flex; justify-content: space-between; align-items: center; }
        .style-group select, .style-group input[type="file"] {
            padding: 6px 10px; border-radius: 10px; border: 1px solid var(--border-color);
            background-color: var(--input-bg); color: var(--text-color); font-weight: 700; font-size: 11px; outline: none;
        }
        
        .style-group input[type="range"] { width: 100%; accent-color: var(--accent-color); cursor: pointer; }

        .custom-file-upload { display: none; }
        .custom-file-btn {
            background-color: var(--card-solid); border: 1px dashed var(--accent-color);
            color: var(--accent-color); padding: 6px 10px; border-radius: 10px;
            font-size: 10px; font-weight: 800; text-align: center; cursor: pointer;
        }

        /* UI ELEMEK & STÍLUSOS FEJLÉC */
        .top-nav-container { padding: 16px 24px 0 24px; position: relative; z-index: 1100; }
        .top-nav {
            background-color: var(--nav-bg); padding: 10px 24px;
            display: flex; align-items: center; justify-content: space-between;
            border-radius: 24px; box-shadow: 0 8px 25px var(--shadow-color); border: 1px solid var(--border-color);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        }
        .nav-left { display: flex; align-items: center; gap: 24px; }
        .nav-right { display: flex; align-items: center; gap: 10px; }
        .nav-links { display: flex; gap: 8px; align-items: center; }
        .top-nav a.nav-item {
            text-decoration: none; font-size: 14px; color: var(--subtext-color);
            padding: 8px 16px; border-radius: 14px; font-weight: 700; cursor: pointer;
        }
        .top-nav a.nav-item:hover { color: var(--text-color); background-color: rgba(255,255,255,0.1); }
        .top-nav a.nav-item.active { color: #ffffff; background-color: var(--accent-color); box-shadow: 0 4px 14px var(--active-glow); }
        
        body.tree-view-active #topNavContainer { display: none !important; }

        .user-profile-btn, .theme-toggle-btn {
            background-color: var(--card-solid); color: var(--text-color);
            border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 16px;
            font-weight: 700; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px;
            box-shadow: 0 2px 8px var(--shadow-color);
        }
        .user-profile-btn:hover, .theme-toggle-btn:hover { border-color: var(--accent-color); color: var(--accent-color); transform: translateY(-1px); }

        .logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 800; color: var(--text-color); letter-spacing: -0.5px; font-family: 'Playfair Display', serif; }
        
        @keyframes plumbobFloat {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-3px) rotate(180deg); }
            100% { transform: translateY(0) rotate(360deg); }
        }
        .plumbob {
            width: 14px; height: 22px; background: linear-gradient(135deg, #00ff87 0%, #60efff 100%);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); display: inline-block;
            filter: drop-shadow(0 0 8px rgba(0, 255, 135, 0.8));
            animation: plumbobFloat 5s ease-in-out infinite;
        }

        /* NÉZETEK */
        .page-view { display: none; padding: 30px 20px; max-width: 1100px; margin: 0 auto; position: relative; z-index: 10; }
        .page-view.active { display: block; }
        .main-card {
            background-color: var(--card-bg); padding: 40px; border-radius: 32px;
            box-shadow: 0 16px 40px var(--shadow-color); border: 1px solid var(--border-color);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        }
        .main-card h1 { font-family: 'Playfair Display', serif; font-size: 32px; margin-top: 0; }

        .page-view#treeView {
            display: none; padding: 0; max-width: 100%; width: 100vw; height: 100vh;
            position: fixed; top: 0; left: 0; z-index: 100;
        }
        .page-view#treeView.active { display: block; }

        /* FLOATING SIDEBAR */
        .tree-left-sidebar {
            position: absolute; top: 20px; left: 24px; width: 310px;
            background-color: var(--nav-bg); border: 1px solid var(--border-color);
            border-radius: 24px; padding: 16px; box-shadow: 0 12px 32px var(--shadow-color);
            z-index: 1050; display: flex; flex-direction: column; gap: 10px;
            max-height: calc(100vh - 120px); overflow-y: auto;
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        }

        .accordion-group { border-radius: 14px; transition: all 0.2s ease; }
        .accordion-header {
            width: 100%; background: none; border: none; color: var(--text-color);
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 4px; cursor: pointer; font-weight: 800; font-size: 11px;
            text-transform: uppercase; letter-spacing: 1px; opacity: 0.8;
        }
        .accordion-header:hover { opacity: 1; }
        .accordion-header .header-title { display: flex; align-items: center; gap: 8px; }
        .accordion-header .chevron { font-size: 9px; transition: transform 0.25s ease; color: var(--subtext-color); }
        .accordion-content { display: none; padding-top: 6px; flex-direction: column; gap: 6px; }
        .accordion-group.open .accordion-content { display: flex; }
        .accordion-group:not(.open) .chevron { transform: rotate(180deg); }

        .tree-tab-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 6px 10px; border-radius: 12px; transition: background-color 0.2s ease;
        }
        .tree-tab-item:hover { background-color: rgba(255,255,255,0.1); }
        .tree-tab-item.active { background-color: var(--card-solid); box-shadow: 0 4px 12px var(--shadow-color); border: 1px solid var(--border-color); }
        .tree-tab-btn {
            background: none; border: none; font-weight: 700; color: var(--text-color);
            cursor: pointer; font-size: 13px; text-align: left; flex: 1; outline: none;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .tree-delete-btn {
            background: none; border: none; cursor: pointer; font-size: 12px;
            opacity: 0.4; padding: 2px 4px; border-radius: 6px; transition: all 0.2s ease;
        }
        .tree-delete-btn:hover { opacity: 1; background-color: rgba(217, 83, 79, 0.15); }

        .add-tree-btn {
            background-color: rgba(46, 213, 115, 0.1); color: var(--accent-color); border: 1px dashed var(--accent-color);
            padding: 8px 12px; border-radius: 12px; font-weight: 700; font-size: 12px; cursor: pointer; text-align: center;
            width: 100%; margin-top: 4px;
        }
        .add-tree-btn:hover { background-color: var(--accent-color); color: #ffffff; }

        .add-sim-floating-btn {
            position: absolute; bottom: 24px; right: 24px; z-index: 1050;
            background: linear-gradient(135deg, #00ff87 0%, #60efff 100%);
            color: #1a2a20; border: none; padding: 14px 24px;
            border-radius: 20px; font-weight: 800; font-size: 14px; cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 255, 135, 0.4); text-shadow: 0 1px 0 rgba(255,255,255,0.4);
        }
        .add-sim-floating-btn:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 12px 30px rgba(0, 255, 135, 0.6); }

        .zoom-controls {
            position: absolute; bottom: 24px; left: 300px; z-index: 1050;
            display: flex; gap: 4px; background-color: var(--nav-bg);
            padding: 4px; border-radius: 14px; border: 1px solid var(--border-color);
            box-shadow: 0 8px 24px var(--shadow-color); align-items: center;
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        }
        .zoom-btn {
            background-color: var(--card-solid); color: var(--text-color);
            border: 1px solid var(--border-color); width: 28px; height: 28px;
            border-radius: 10px; font-weight: 800; font-size: 13px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; padding: 0;
        }
        .zoom-btn:hover { background-color: var(--accent-color); color: white; border-color: var(--accent-color); }

        .zoom-percentage-text { font-size: 11px; font-weight: 800; color: var(--subtext-color); padding: 0 8px; cursor: pointer; user-select: none; }

        .tree-canvas-viewport { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; overflow: hidden; cursor: grab; z-index: 5; }
        .tree-canvas-viewport:active { cursor: grabbing; }
        
        .tree-canvas-world { width: 0; height: 0; position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
        .tree-svg-layer { position: absolute; top: -10000px; left: -10000px; width: 20000px; height: 20000px; pointer-events: none; z-index: 1; }

        @keyframes simFloat {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
            100% { transform: translateY(0px); }
        }

        .sim-node {
            position: absolute; width: 88px; height: 88px; cursor: pointer; 
            z-index: 2; user-select: none; display: flex; align-items: center; 
            justify-content: center; background: transparent;
        }
        .sim-node:hover { transform: scale(1.06); z-index: 5; }
        .sim-node.selected { animation: simFloat 3s ease-in-out infinite; z-index: 10 !important; }
        .sim-node.selected .sim-node-avatar { box-shadow: 0 0 0 3px var(--accent-color), 0 8px 25px var(--active-glow) !important; }

        .sim-node-avatar {
            width: 100%; height: 100%; border-radius: var(--sim-node-radius);
            clip-path: var(--sim-node-clip-path); overflow: hidden; display: flex; 
            align-items: center; justify-content: center; font-size: 32px;
            background-color: var(--card-solid); background-size: cover; background-position: center; 
            pointer-events: none; border: 3px solid #ffffff; box-shadow: 0 8px 20px var(--shadow-color);
            transition: all 0.2s ease;
        }

        .sim-node-label {
            position: absolute; bottom: -24px; white-space: nowrap;
            font-weight: 700; font-size: 11px; color: var(--text-color);
            background-color: var(--card-solid); padding: 3px 10px; border-radius: 12px;
            border: 1px solid var(--border-color); box-shadow: 0 4px 12px var(--shadow-color);
            pointer-events: none; z-index: 15; letter-spacing: -0.2px;
        }

        .sim-edit-pencil {
            position: absolute; top: -2px; right: -2px; width: 24px; height: 24px;
            background-color: var(--card-solid); border: 1px solid var(--border-color);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 10px; cursor: pointer; z-index: 20; box-shadow: 0 2px 6px var(--shadow-color);
        }
        .sim-edit-pencil:hover { background-color: var(--accent-color); color: white; transform: rotate(15deg) scale(1.15); }

        /* MODALOK ÉS FORMOK */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(0, 0, 0, 0.4); z-index: 3000;
            display: none; align-items: center; justify-content: center;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }
        .modal-overlay.active { display: flex; }
        
        .modal-card {
            background-color: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 28px; width: 480px; max-width: 92%; padding: 24px;
            box-shadow: 0 20px 50px var(--shadow-color); max-height: 90vh; overflow-y: auto;
            position: relative; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        }

        .close-btn {
            position: absolute; top: 16px; right: 20px; background: none; border: none;
            color: var(--subtext-color); font-size: 20px; cursor: pointer; font-weight: 800; z-index: 10;
        }
        .close-btn:hover { color: var(--text-color); }

        .modal-header { border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 16px; }
        .modal-title { margin: 0 0 10px 0; font-size: 18px; font-weight: 800; color: var(--text-color); }

        .form-group { margin-bottom: 12px; position: relative; }
        .form-group label { display: block; font-size: 10px; font-weight: 800; color: var(--subtext-color); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 8px 12px; border-radius: 12px;
            border: 1px solid var(--border-color); background-color: var(--input-bg);
            color: var(--text-color); font-size: 12px; font-weight: 600; outline: none;
        }
        .form-row { display: flex; gap: 8px; }

        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
        .btn-secondary { background-color: transparent; border: 1px solid var(--border-color); color: var(--text-color); padding: 8px 14px; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 12px; }
        .btn-primary { background-color: var(--accent-color); border: none; color: white; padding: 8px 16px; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 12px; box-shadow: 0 4px 12px var(--active-glow); }
        .btn-danger { background-color: #ff5e7e; border: none; color: white; padding: 8px 14px; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 12px; margin-right: auto; }

        /* SZÜLŐ KIVÁLASZTÓ KÁRTYÁK STÍLUSAI */
        .parents-select-container { display: flex; flex-direction: column; gap: 16px; margin-top: 14px; }
        .parents-section-box {
            background-color: var(--input-bg); border: 1px solid var(--border-color);
            border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px;
        }
        .parents-section-title { font-size: 11px; font-weight: 800; color: var(--subtext-color); text-transform: uppercase; letter-spacing: 0.5px; }
        .parent-search-input { width: 100%; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border-color); background-color: var(--card-solid); color: var(--text-color); font-size: 11px; outline: none; }
        .parents-cards-grid { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px 2px; max-height: 140px; }
        .sim-select-card {
            flex: 0 0 100px; background-color: var(--card-solid); border: 2px solid var(--border-color);
            border-radius: 14px; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; position: relative;
        }
        .sim-select-card:hover { border-color: var(--accent-color); }
        .sim-select-card.selected { border-color: var(--accent-color); background-color: rgba(46, 213, 115, 0.08); }
        .sim-select-avatar { width: 42px; height: 42px; border-radius: 50%; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; font-size: 20px; border: 1px solid var(--border-color); }
        .sim-select-name { font-size: 10px; font-weight: 800; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .sim-select-check { position: absolute; top: 4px; right: 4px; background-color: var(--accent-color); color: white; width: 16px; height: 16px; border-radius: 50%; font-size: 9px; display: flex; align-items: center; justify-content: center; font-weight: 800; }

        .right-sidebar {
            position: fixed; top: 20px; right: -290px; width: 270px; height: calc(100vh - 40px);
            background-color: var(--nav-bg); box-shadow: -12px 0 32px var(--shadow-color);
            transition: right 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); padding: 30px 16px; z-index: 2000; border-radius: 28px 0 0 28px;
            border: 1px solid var(--border-color); border-right: none; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        }
        .right-sidebar.open { right: 0; }
        .right-sidebar ul { list-style: none; padding: 0; margin: 0; }
        .right-sidebar ul li { margin-bottom: 8px; }
        .right-sidebar ul li a { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: var(--text-color); text-decoration: none; font-size: 14px; font-weight: 700; border-radius: 16px; cursor: pointer; }
        .right-sidebar ul li a:hover, .right-sidebar ul li a.active { background-color: var(--card-solid); color: var(--accent-color); }
        .toggle-btn { position: fixed; top: 50%; right: 0; transform: translateY(-50%); background-color: var(--nav-bg); color: var(--text-color); border: 1px solid var(--border-color); border-right: none; padding: 14px 10px; cursor: pointer; font-size: 14px; border-radius: 14px 0 0 14px; z-index: 2001; }
        .toggle-btn.open { right: 270px; }
    </style>
</head>
<body class="bg-dots">

    <div id="bgBlurOverlay"></div>

    <!-- NAVIGÁCIÓ -->
    <div class="top-nav-container" id="topNavContainer">
        <nav class="top-nav">
            <div class="nav-left">
                <div class="logo"><span class="plumbob"></span> S4Memo</div>
                <div class="nav-links">
                    <a class="nav-item active" id="navHome" onclick="switchView('home')">Főoldal</a>
                    <a class="nav-item" id="navTree" onclick="switchView('tree')">Családfák</a>
                </div>
            </div>
            <div class="nav-right">
                <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark</button>
            </div>
        </nav>
    </div>

    <!-- 1. FŐOLDAL -->
    <div class="page-view active" id="homeView">
        <main class="main-card">
            <h1>Üdvözöllek a Sims 4 Memorable oldalán!</h1>
            <p>Készíts interaktív Sims családfákat egyszerűen!</p>
        </main>
    </div>

    <!-- 2. CSALÁDFÁK NÉZET -->
    <div class="page-view" id="treeView">
        <div class="tree-left-sidebar">
            <div class="accordion-group open" id="dynastyAccordion">
                <button class="accordion-header" onclick="toggleAccordion('dynastyAccordion')">
                    <div class="header-title">
                        <span>⋮⋮</span>
                        <span>Családfák</span>
                    </div>
                    <span class="chevron">▲</span>
                </button>
                <div class="accordion-content">
                    <div id="treeTabsList"></div>
                    <button class="add-tree-btn" onclick="createNewTree()">+ Családfa hozzáadása</button>
                </div>
            </div>
        </div>

        <div class="zoom-controls">
            <button class="zoom-btn" onclick="adjustZoom(0.1)" title="Nagyítás">+</button>
            <button class="zoom-btn" onclick="adjustZoom(-0.1)" title="Kicsinyítés">-</button>
            <span class="zoom-percentage-text" id="zoomPercentLabel" onclick="resetZoom()" title="Visszaállítás">100%</span>
        </div>

        <button class="add-sim-floating-btn" onclick="addNewSimDialog()">+ Új Sim Hozzáadása</button>

        <div class="tree-canvas-viewport" id="treeViewport">
            <div class="tree-canvas-world style-glow" id="treeWorld">
                <svg class="tree-svg-layer" id="svgLayer" viewBox="-10000 -10000 20000 20000"></svg>
            </div>
        </div>
    </div>

    <!-- SIM SZERKESZTŐ MODAL -->
    <div class="modal-overlay" id="simModal">
        <div class="modal-card">
            <button type="button" class="close-btn" onclick="closeSimModal()">&times;</button>
            <div class="modal-header">
                <h3 class="modal-title">Sim Szerkesztése</h3>
            </div>
            <form id="simForm" onsubmit="saveSimDetails(event)">
                <div class="form-row">
                    <div class="form-group" style="flex:1;">
                        <label>Vezetéknév</label>
                        <input type="text" id="editLastName" required>
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label>Keresztnév</label>
                        <input type="text" id="editFirstName" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group" style="flex:1;">
                        <label>Életkor</label>
                        <select id="editAge">
                            <option value="Tipegő">Tipegő</option>
                            <option value="Gyermek">Gyermek</option>
                            <option value="Tini">Tini</option>
                            <option value="Fiatal felnőtt" selected>Fiatal felnőtt</option>
                            <option value="Felnőtt">Felnőtt</option>
                            <option value="Idős">Idős</option>
                        </select>
                    </div>
                </div>

                <div class="field-group" style="margin-bottom: 12px;">
                    <button type="button" class="btn-secondary" onclick="openParentsModal()" style="width: 100%; padding: 10px; font-weight: bold;">
                        👨‍👩‍👧 Szülők beállítása
                    </button>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-danger" onclick="deleteCurrentSimModal()">Törlés</button>
                    <button type="button" class="btn-secondary" onclick="closeSimModal()">Mégse</button>
                    <button type="submit" class="btn-primary">Mentés</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SZÜLŐK KIVÁLASZTÁSA MODAL (AZ ISMERŐSÖK RÉSZ TÖRÖLVE) -->
    <div class="modal-overlay" id="parentsModal">
        <div class="modal-card">
            <button type="button" class="close-btn" onclick="closeParentsModal()">&times;</button>
            <div class="modal-header">
                <h3 class="modal-title">Szülők Kiválasztása</h3>
            </div>
            <p style="font-size: 12px; color: var(--subtext-color); margin-top: 0;">Válaszd ki a Sim szüleit!</p>
            
            <div class="parents-select-container">
                <div class="parents-section-box">
                    <div class="parents-section-title"><span>👩‍👦 1. Szülő</span></div>
                    <input type="text" class="parent-search-input" id="parent1Search" placeholder="Keresés..." oninput="filterParentCards('p1')">
                    <div class="parents-cards-grid" id="parent1CardsGrid"></div>
                </div>

                <div class="parents-section-box">
                    <div class="parents-section-title"><span>👨‍👦 2. Szülő</span></div>
                    <input type="text" class="parent-search-input" id="parent2Search" placeholder="Keresés..." oninput="filterParentCards('p2')">
                    <div class="parents-cards-grid" id="parent2CardsGrid"></div>
                </div>
            </div>

            <div class="modal-actions" style="margin-top: 20px;">
                <button type="button" class="btn-secondary" onclick="closeParentsModal()">Mégse</button>
                <button type="button" class="btn-primary" onclick="saveParentsSelection()">Kész</button>
            </div>
        </div>
    </div>

    <!-- JOBB OLDALI MENÜ BAR -->
    <div class="right-sidebar" id="sidebar">
        <ul>
            <li><a onclick="switchView('home')" id="menuHome" class="active">🏠 Főoldal</a></li>
            <li><a onclick="switchView('tree')" id="menuTree">🌳 Családfák</a></li>
        </ul>
    </div>
    <button class="toggle-btn" id="toggleBtn"><span class="arrow-icon">◀</span></button>

    <script>
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('toggleBtn');
        const themeBtn = document.getElementById('themeBtn');
        const treeWorld = document.getElementById('treeWorld');
        const treeViewport = document.getElementById('treeViewport');
        const svgLayer = document.getElementById('svgLayer');
        const treeTabsList = document.getElementById('treeTabsList');
        const simModal = document.getElementById('simModal');
        const parentsModal = document.getElementById('parentsModal');
        const zoomPercentLabel = document.getElementById('zoomPercentLabel');

        let currentView = 'home';
        
        const defaultTrees = [
            {
                id: 'tree_1',
                name: 'Goth család',
                sims: [
                    { id: 'sim_1', firstName: 'Bella', lastName: 'Goth', age: 'Fiatal felnőtt', x: 450, y: 200, parentIds: [], partnerId: 'sim_2' },
                    { id: 'sim_2', firstName: 'Mortimer', lastName: 'Goth', age: 'Felnőtt', x: 650, y: 200, parentIds: [], partnerId: 'sim_1' },
                    { id: 'sim_3', firstName: 'Cassandra', lastName: 'Goth', age: 'Tini', x: 550, y: 380, parentIds: ['sim_1', 'sim_2'], partnerId: null }
                ]
            }
        ];

        let familyTrees = loadTreesFromStorage();
        let currentTreeId = familyTrees.length > 0 ? familyTrees[0].id : null;
        let editingSimId = null;

        let selectedParent1Id = null;
        let selectedParent2Id = null;

        let zoomLevel = 1;
        let panX = 0; let panY = 0;
        let isPanning = false;
        let startPanX = 0; let startPanY = 0;
        let activeDrag = null;
        let dragStartMouse = { x: 0, y: 0 };
        let dragStartSimPos = { x: 0, y: 0 };

        function getCurrentTree() {
            return familyTrees.find(t => t.id === currentTreeId);
        }

        function saveTreesToStorage() {
            try { localStorage.setItem('s4memo_family_trees', JSON.stringify(familyTrees)); } 
            catch (e) { console.error(e); }
        }

        function loadTreesFromStorage() {
            try {
                const saved = localStorage.getItem('s4memo_family_trees');
                if (saved) return JSON.parse(saved);
            } catch (e) { console.error(e); }
            return defaultTrees;
        }

        function switchView(viewName) {
            currentView = viewName;
            document.querySelectorAll('.page-view').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            if (viewName === 'tree') {
                document.body.classList.add('tree-view-active');
                document.getElementById('treeView').classList.add('active');
                renderTreeTabs();
                loadCurrentTreeCanvas();
            } else {
                document.body.classList.remove('tree-view-active');
                document.getElementById('homeView').classList.add('active');
            }
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            themeBtn.innerText = newTheme === 'dark' ? '☀️ Light' : '🌙 Dark';
            updateConnections();
        }

        function toggleAccordion(id) {
            document.getElementById(id).classList.toggle('open');
        }

        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('open');
            toggleBtn.classList.toggle('open');
        });

        function adjustZoom(delta) {
            zoomLevel = Math.min(Math.max(0.4, zoomLevel + delta), 2.0);
            updateWorldTransform();
        }

        function resetZoom() {
            zoomLevel = 1; panX = 0; panY = 0;
            updateWorldTransform();
        }

        function updateWorldTransform() {
            treeWorld.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;
            if (zoomPercentLabel) zoomPercentLabel.innerText = `${Math.round(zoomLevel * 100)}%`;
        }

        treeViewport.addEventListener('mousedown', (e) => {
            if (e.button !== 0 || e.target.closest('.sim-node') || e.target.closest('.zoom-controls') || e.target.closest('.tree-left-sidebar')) return;
            isPanning = true;
            startPanX = e.clientX - panX;
            startPanY = e.clientY - panY;
        });

        window.addEventListener('mousemove', (e) => {
            if (isPanning) {
                panX = e.clientX - startPanX;
                panY = e.clientY - startPanY;
                updateWorldTransform();
            }
            if (activeDrag) {
                const dx = (e.clientX - dragStartMouse.x) / zoomLevel;
                const dy = (e.clientY - dragStartMouse.y) / zoomLevel;
                activeDrag.sim.x = dragStartSimPos.x + dx;
                activeDrag.sim.y = dragStartSimPos.y + dy;
                
                const nodeEl = document.getElementById(`sim_node_${activeDrag.sim.id}`);
                if (nodeEl) {
                    nodeEl.style.left = `${activeDrag.sim.x}px`;
                    nodeEl.style.top = `${activeDrag.sim.y}px`;
                }
                updateConnections();
            }
        });

        window.addEventListener('mouseup', () => {
            isPanning = false;
            if (activeDrag) {
                activeDrag = null;
                saveTreesToStorage();
            }
        });

        function renderTreeTabs() {
            treeTabsList.innerHTML = '';
            familyTrees.forEach(tree => {
                const item = document.createElement('div');
                item.className = `tree-tab-item ${tree.id === currentTreeId ? 'active' : ''}`;
                item.innerHTML = `
                    <button class="tree-tab-btn" onclick="selectTree('${tree.id}')">${tree.name}</button>
                    <button class="tree-delete-btn" onclick="deleteTree('${tree.id}', event)">🗑️</button>
                `;
                treeTabsList.appendChild(item);
            });
        }

        function selectTree(id) {
            currentTreeId = id;
            renderTreeTabs();
            loadCurrentTreeCanvas();
        }

        function createNewTree() {
            const name = prompt("Új családfa neve:", "Új Család");
            if (!name) return;
            const newTree = { id: 'tree_' + Date.now(), name: name, sims: [] };
            familyTrees.push(newTree);
            selectTree(newTree.id);
        }

        function deleteTree(id, e) {
            e.stopPropagation();
            if (familyTrees.length <= 1) return alert("Legalább egy családfának maradnia kell!");
            familyTrees = familyTrees.filter(t => t.id !== id);
            if (currentTreeId === id) currentTreeId = familyTrees[0].id;
            saveTreesToStorage();
            renderTreeTabs();
            loadCurrentTreeCanvas();
        }

        function loadCurrentTreeCanvas() {
            const currentNodes = treeWorld.querySelectorAll('.sim-node');
            currentNodes.forEach(n => n.remove());
            const tree = getCurrentTree();
            if (!tree) return;
            tree.sims.forEach(sim => createSimDOMNode(sim));
            updateConnections();
        }

        function createSimDOMNode(sim) {
            const node = document.createElement('div');
            node.className = 'sim-node';
            node.id = `sim_node_${sim.id}`;
            node.style.left = `${sim.x}px`;
            node.style.top = `${sim.y}px`;

            node.innerHTML = `
                <div class="sim-node-avatar">👤</div>
                <div class="sim-node-label">${sim.firstName} ${sim.lastName}</div>
                <div class="sim-edit-pencil" onclick="openSimEdit('${sim.id}', event)">✏️</div>
            `;

            node.addEventListener('mousedown', (e) => {
                if (e.target.closest('.sim-edit-pencil')) return;
                activeDrag = { sim: sim, node: node };
                dragStartMouse = { x: e.clientX, y: e.clientY };
                dragStartSimPos = { x: sim.x, y: sim.y };
            });

            treeWorld.appendChild(node);
        }

        function addNewSimDialog() {
            const tree = getCurrentTree();
            const newSim = {
                id: 'sim_' + Date.now(),
                firstName: 'Új',
                lastName: 'Sim',
                age: 'Fiatal felnőtt',
                x: 300 + Math.random() * 50,
                y: 300 + Math.random() * 50,
                parentIds: [],
                partnerId: null
            };
            tree.sims.push(newSim);
            saveTreesToStorage();
            createSimDOMNode(newSim);
            updateConnections();
            openSimEdit(newSim.id);
        }

        function openSimEdit(simId, e) {
            if (e) e.stopPropagation();
            const tree = getCurrentTree();
            const sim = tree.sims.find(s => s.id === simId);
            if (!sim) return;

            editingSimId = simId;
            document.getElementById('editFirstName').value = sim.firstName;
            document.getElementById('editLastName').value = sim.lastName;
            document.getElementById('editAge').value = sim.age || 'Fiatal felnőtt';

            selectedParent1Id = sim.parentIds ? sim.parentIds[0] || null : null;
            selectedParent2Id = sim.parentIds ? sim.parentIds[1] || null : null;

            simModal.classList.add('active');
        }

        function closeSimModal() { simModal.classList.remove('active'); }

        function saveSimDetails(e) {
            e.preventDefault();
            const tree = getCurrentTree();
            const sim = tree.sims.find(s => s.id === editingSimId);
            if (!sim) return;

            sim.firstName = document.getElementById('editFirstName').value;
            sim.lastName = document.getElementById('editLastName').value;
            sim.age = document.getElementById('editAge').value;

            // Szülők beállítása
            sim.parentIds = [];
            if (selectedParent1Id) sim.parentIds.push(selectedParent1Id);
            if (selectedParent2Id && selectedParent2Id !== selectedParent1Id) sim.parentIds.push(selectedParent2Id);

            // JAVÍTÁS 3: Ha 2 szülőt adunk meg, kösse össze a 2 szülőt is automatikusan kapcsolattal
            if (sim.parentIds.length === 2) {
                const p1 = tree.sims.find(s => s.id === sim.parentIds[0]);
                const p2 = tree.sims.find(s => s.id === sim.parentIds[1]);
                if (p1 && p2) {
                    p1.partnerId = p2.id;
                    p2.partnerId = p1.id;
                }
            }

            saveTreesToStorage();
            const label = document.querySelector(`#sim_node_${sim.id} .sim-node-label`);
            if (label) label.innerText = `${sim.firstName} ${sim.lastName}`;

            updateConnections();
            closeSimModal();
        }

        function deleteCurrentSimModal() {
            const tree = getCurrentTree();
            tree.sims = tree.sims.filter(s => s.id !== editingSimId);
            const node = document.getElementById(`sim_node_${editingSimId}`);
            if (node) node.remove();

            saveTreesToStorage();
            updateConnections();
            closeSimModal();
        }

        /* MODAL ÉS SZÜLŐ KIVÁLASZTÓ LOGIKA */
        function openParentsModal() {
            renderParentCards('p1');
            renderParentCards('p2');
            parentsModal.classList.add('active');
        }

        function closeParentsModal() { parentsModal.classList.remove('active'); }

        function renderParentCards(type) {
            const tree = getCurrentTree();
            const grid = document.getElementById(type === 'p1' ? 'parent1CardsGrid' : 'parent2CardsGrid');
            const searchVal = document.getElementById(type === 'p1' ? 'parent1Search' : 'parent2Search').value.toLowerCase();
            const currentSelected = type === 'p1' ? selectedParent1Id : selectedParent2Id;

            grid.innerHTML = '';

            // 'Nincs' opció
            const noneCard = document.createElement('div');
            noneCard.className = `sim-select-card ${!currentSelected ? 'selected' : ''}`;
            noneCard.innerHTML = `<div class="sim-select-name">Nincs</div>`;
            noneCard.onclick = () => selectParent(type, null);
            grid.appendChild(noneCard);

            tree.sims.filter(s => s.id !== editingSimId).forEach(sim => {
                const name = `${sim.firstName} ${sim.lastName}`;
                if (searchVal && !name.toLowerCase().includes(searchVal)) return;

                const card = document.createElement('div');
                card.className = `sim-select-card ${currentSelected === sim.id ? 'selected' : ''}`;
                card.innerHTML = `
                    <div class="sim-select-avatar">👤</div>
                    <div class="sim-select-name">${name}</div>
                    ${currentSelected === sim.id ? '<div class="sim-select-check">✓</div>' : ''}
                `;
                card.onclick = () => selectParent(type, sim.id);
                grid.appendChild(card);
            });
        }

        function filterParentCards(type) { renderParentCards(type); }

        function selectParent(type, id) {
            if (type === 'p1') selectedParent1Id = id;
            if (type === 'p2') selectedParent2Id = id;
            renderParentCards('p1');
            renderParentCards('p2');
        }

        function saveParentsSelection() { closeParentsModal(); }

        /* JAVÍTÁS 1, 2, 3: VONALAK ÉS KAPCSOLATOK FRISSÍTÉSE */
        function updateConnections() {
            const tree = getCurrentTree();
            if (!tree) return;

            svgLayer.innerHTML = '';
            const drawnPairs = new Set(); // Duplikált oda-vissza vonalak kiszűrésére

            // 1. PÁROK ÉS EGYEDI SZÜLŐ-GYEREK KAPCSOLATOK
            tree.sims.forEach(sim => {
                const simCenterX = sim.x + 44;
                const simCenterY = sim.y + 44;

                // Házastársi / Párkapcsolatok (1 vonal oda-vissza vonal helyett)
                if (sim.partnerId) {
                    const partner = tree.sims.find(s => s.id === sim.partnerId);
                    if (partner) {
                        const pairKey = [sim.id, partner.id].sort().join('-');
                        if (!drawnPairs.has(pairKey)) {
                            drawnPairs.add(pairKey);
                            drawSvgLine(simCenterX, simCenterY, partner.x + 44, partner.y + 44, 'line-love');
                        }
                    }
                }

                // 1 Szülő esetén közvetlen összekötés
                if (sim.parentIds && sim.parentIds.length === 1) {
                    const parent = tree.sims.find(s => s.id === sim.parentIds[0]);
                    if (parent) {
                        drawSvgLine(parent.x + 44, parent.y + 44, simCenterX, simCenterY, 'line-child');
                    }
                }
            });

            // 2. JAVÍTÁS 3: HA KÉT SZÜLŐ VAN, A KÉT SZÜLŐ KÖZÖTTI VONAL KÖZEPÉRŐL INDUL A GYEREK VONALA
            tree.sims.forEach(sim => {
                if (sim.parentIds && sim.parentIds.length === 2) {
                    const p1 = tree.sims.find(s => s.id === sim.parentIds[0]);
                    const p2 = tree.sims.find(s => s.id === sim.parentIds[1]);

                    if (p1 && p2) {
                        const p1X = p1.x + 44; const p1Y = p1.y + 44;
                        const p2X = p2.x + 44; const p2Y = p2.y + 44;

                        // Szülők vonalának felezőpontja
                        const midX = (p1X + p2X) / 2;
                        const midY = (p1Y + p2Y) / 2;

                        // 1 vonallal csatlakozik a gyerekhez a szülők közös felezőpontjától
                        drawSvgLine(midX, midY, sim.x + 44, sim.y + 44, 'line-child');
                    }
                }
            });
        }

        function drawSvgLine(x1, y1, x2, y2, className) {
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            // Cukor/Lágy ívelt vonal rajzolása (Bezier curve)
            const deltaY = (y2 - y1) / 2;
            const d = `M ${x1} ${y1} C ${x1} ${y1 + deltaY}, ${x2} ${y2 - deltaY}, ${x2} ${y2}`;
            path.setAttribute('d', d);
            path.setAttribute('class', className);
            svgLayer.appendChild(path);
        }

        // Kezdő nézet beállítása
        switchView('tree');
    </script>
</body>
</html>
