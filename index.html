<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S4Memo - Sims 4 Memorable</title>
    <style>
        :root {
            --bg-color: #e8d3c5;
            --card-bg: #f5ebe1;
            --text-color: #3b2d25;
            --subtext-color: #614f45;
            --border-color: #d9c0b1;
            --accent-color: #cd7f5d;
            --accent-hover: #b86b49;
            --shadow-color: rgba(90, 60, 45, 0.12);
            --nav-bg: #efe2d7;
            --input-bg: #ffffff;
        }

        [data-theme="dark"] {
            --bg-color: #1a1614;
            --card-bg: #28221f;
            --text-color: #eedcd0;
            --subtext-color: #b39f93;
            --border-color: #3d332e;
            --accent-color: #d9825b;
            --accent-hover: #e59875;
            --shadow-color: rgba(0, 0, 0, 0.4);
            --nav-bg: #221c19;
            --input-bg: #1e1917;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Quicksand', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
        }

        /* Plumbob Sim Kristály ikon */
        .plumbob {
            width: 14px; 
            height: 22px;
            background: linear-gradient(135deg, #00ff66 0%, #00b33c 100%);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            display: inline-block;
        }

        /* Fejléc / Főmenü Navigáció */
        .top-nav {
            background-color: var(--nav-bg);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 20px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px var(--shadow-color);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 22px;
            color: var(--text-color);
        }

        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-color);
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 12px;
            transition: all 0.2s ease;
        }

        .nav-links a:hover, .nav-links a.active {
            background-color: var(--card-bg);
            color: var(--accent-color);
        }

        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
        }

        .theme-toggle:hover {
            background-color: var(--accent-color);
            color: #ffffff;
        }

        /* Fő tartalom kártya */
        .main-card {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 35px;
            max-width: 900px;
            margin: 30px auto;
            border: 2px solid var(--border-color);
            box-shadow: 0 10px 30px var(--shadow-color);
        }

        .main-card h1 {
            margin-top: 0;
            color: var(--text-color);
        }

        .main-card p {
            color: var(--subtext-color);
            font-size: 16px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <!-- Főmenü / Fejléc -->
    <nav class="top-nav">
        <div class="logo">
            <span class="plumbob"></span> S4Memo
        </div>
        <ul class="nav-links">
            <li><a href="#" class="active">Főoldal</a></li>
            <li><a href="#">Családfák</a></li>
            <li><a href="#">Generációk</a></li>
            <li><a href="#">Beállítások</a></li>
        </ul>
        <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙 Sötét mód</button>
    </nav>

    <!-- Fő tartalom -->
    <div class="main-card">
        <h1>Üdvözöllek a Sims 4 Memorable oldalán!</h1>
        <p>A weboldal közvetlenül elérhető. Innen tudod tovább építeni a funkciókat, mint a családfák kezelése, képek feltöltése és a Sim-ek adatainak rögzítése.</p>
    </div>

    <script>
        // Téma váltása (Világos / Sötét)
        function toggleTheme() {
            const body = document.body;
            const themeBtn = document.getElementById('themeBtn');
            
            if (body.getAttribute('data-theme') === 'dark') {
                body.removeAttribute('data-theme');
                themeBtn.innerText = '🌙 Sötét mód';
            } else {
                body.setAttribute('data-theme', 'dark');
                themeBtn.innerText = '☀️ Világos mód';
            }
        }
    </script>
</body>
</html>
