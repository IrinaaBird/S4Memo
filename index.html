<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S4Memo - Sims 4 Memorable</title>
    <!-- Supabase JS SDK Betöltése -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #e8d3c5;
            --card-bg: #f5ebe1;
            --text-color: #3b2d25;
            --subtext-color: #614f45;
            --border-color: #d9c0b1;
            --accent-color: #cd7f5d;
            --accent-hover: #b86b49;
            --shadow-color: rgba(90, 60, 45, 0.12);
            --nav-bg: #efe2d7;
            --input-bg: #ffffff;
            --error-color: #d93838;
            --success-color: #2e7d32;
        }

        [data-theme="dark"] {
            --bg-color: #1a1614;
            --card-bg: #28221f;
            --text-color: #eedcd0;
            --subtext-color: #b39f93;
            --border-color: #3d332e;
            --accent-color: #d9825b;
            --accent-hover: #e59875;
            --shadow-color: rgba(0, 0, 0, 0.4);
            --nav-bg: #221c19;
            --input-bg: #1e1917;
            --error-color: #ff6b6b;
            --success-color: #66bb6a;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Quicksand', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
        }

        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .auth-overlay.hidden { display: none; }

        .auth-card {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 28px;
            box-shadow: 0 15px 35px var(--shadow-color);
            width: 90%;
            max-width: 420px;
            text-align: center;
            border: 2px solid var(--border-color);
        }

        .auth-card h2 { margin-top: 0; font-size: 26px; margin-bottom: 20px; }

        .auth-msg {
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 18px;
            display: none;
            text-align: left;
            word-break: break-word;
        }

        .auth-msg.error {
            display: block;
            background-color: rgba(217, 56, 56, 0.15);
            color: var(--error-color);
            border: 1px solid var(--error-color);
        }

        .auth-msg.success {
            display: block;
            background-color: rgba(46, 125, 50, 0.15);
            color: var(--success-color);
            border: 1px solid var(--success-color);
        }

        .form-group { margin-bottom: 16px; text-align: left; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 600; }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 14px;
            border: 2px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
        }

        .auth-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 18px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .auth-actions { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
        .auth-link { color: var(--accent-color); font-weight: bold; cursor: pointer; }

        .top-nav {
            background-color: var(--nav-bg);
            padding: 12px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 20px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
        }

        .main-card {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 35px;
            max-width: 800px;
            margin: 30px auto;
            border: 2px solid var(--border-color);
        }

        .plumbob {
            width: 14px; height: 22px;
            background: linear-gradient(135deg, #00ff66 0%, #00b33c 100%);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="auth-overlay" id="authOverlay">
        <div class="auth-card">
            <div style="display:flex; justify-content:center; align-items:center; gap:8px; font-weight:800; font-size:22px; margin-bottom:15px;">
                <span class="plumbob"></span> S4Memo
            </div>
            
            <h2 id="authTitle">Bejelentkezés</h2>
            <div id="authMsg" class="auth-msg"></div>

            <form id="authForm" novalidate onsubmit="handleAuthSubmit(event)">
                <div class="form-group" id="emailGroup">
                    <label for="email">E-mail cím</label>
                    <input type="email" id="email" placeholder="pelda@email.com">
                </div>

                <div class="form-group" id="usernameGroup" style="display:none;">
                    <label for="username">Felhasználónév</label>
                    <input type="text" id="username" placeholder="Felhasználónév">
                </div>

                <div class="form-group" id="passwordGroup">
                    <label for="password" id="passwordLabel">Jelszó</label>
                    <input type="password" id="password" placeholder="••••••••">
                </div>

                <button type="submit" class="auth-btn" id="authSubmitBtn">Bejelentkezés</button>
            </form>
            
            <div class="auth-actions">
                <div id="forgotPasswordContainer">
                    <a class="auth-link" onclick="switchMode('forgot')">Elfelejtetted a jelszavad?</a>
                </div>
                <div>
                    <span id="toggleText">Még nincs fiókod?</span> 
                    <a class="auth-link" onclick="toggleAuthMode()" id="toggleLink">Regisztráció</a>
                </div>
            </div>
        </div>
    </div>

    <nav class="top-nav">
        <div style="font-weight:800; font-size:20px;"><span class="plumbob"></span> S4Memo</div>
        <div>
            <button onclick="logout()" style="padding: 8px 16px; border-radius: 12px; cursor: pointer;">🚪 Kijelentkezés</button>
        </div>
    </nav>

    <div class="main-card">
        <h1>Üdvözöllek a Sims 4 Memorable oldalán!</h1>
        <p>Sikeresen bejelentkeztél az adatbázissal összekötött felületre!</p>
    </div>

    <script>
        const SUPABASE_URL = 'https://frduhftoyxpktabgedca.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZyZHVoZnRveXhwa3RhYmdlZGNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2NzkwMjIsImV4cCI6MjEwMzI1NTAyMn0._u0eKyFu5o9pf_6DIPdyESvM-AYSOv2k6JwZdbilnd4';
        
        let supabaseClient = null;

        try {
            if (window.supabase) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.error("Supabase Hiba:", e);
        }

        let currentMode = 'login';

        const authOverlay = document.getElementById('authOverlay');
        const authTitle = document.getElementById('authTitle');
        const authSubmitBtn = document.getElementById('authSubmitBtn');
        const authMsg = document.getElementById('authMsg');
        
        const emailGroup = document.getElementById('emailGroup');
        const usernameGroup = document.getElementById('usernameGroup');
        const passwordGroup = document.getElementById('passwordGroup');
        const passwordLabel = document.getElementById('passwordLabel');
        const forgotPasswordContainer = document.getElementById('forgotPasswordContainer');
        const toggleText = document.getElementById('toggleText');
        const toggleLink = document.getElementById('toggleLink');
        
        const emailInput = document.getElementById('email');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');

        function showMessage(text, isError = true) {
            authMsg.innerText = text;
            authMsg.className = 'auth-msg ' + (isError ? 'error' : 'success');
        }

        function hideMessage() {
            authMsg.style.display = 'none';
        }

        function switchMode(mode) {
            currentMode = mode;
            hideMessage();

            if (mode === 'login') {
                authTitle.innerText = 'Bejelentkezés';
                emailGroup.style.display = 'block';
                usernameGroup.style.display = 'none';
                passwordGroup.style.display = 'block';
                passwordLabel.innerText = 'Jelszó';
                forgotPasswordContainer.style.display = 'block';
                authSubmitBtn.innerText = 'Bejelentkezés';
                toggleText.innerText = 'Még nincs fiókod?';
                toggleLink.innerText = 'Regisztráció';
            } else if (mode === 'register') {
                authTitle.innerText = 'Regisztráció';
                emailGroup.style.display = 'block';
                usernameGroup.style.display = 'block';
                passwordGroup.style.display = 'block';
                passwordLabel.innerText = 'Jelszó (min. 6 karakter)';
                forgotPasswordContainer.style.display = 'none';
                authSubmitBtn.innerText = 'Regisztráció';
                toggleText.innerText = 'Már van fiókod?';
                toggleLink.innerText = 'Bejelentkezés';
            } else if (mode === 'forgot') {
                authTitle.innerText = 'Jelszó visszaállítása';
                emailGroup.style.display = 'block';
                usernameGroup.style.display = 'none';
                passwordGroup.style.display = 'none';
                forgotPasswordContainer.style.display = 'none';
                authSubmitBtn.innerText = 'E-mail küldése';
                toggleText.innerText = 'Emlékszel a jelszavadra?';
                toggleLink.innerText = 'Bejelentkezés';
            }
        }

        function toggleAuthMode() {
            switchMode(currentMode === 'login' ? 'register' : 'login');
        }

        async function handleAuthSubmit(event) {
            event.preventDefault();
            hideMessage();

            if (!supabaseClient) {
                showMessage('Nem sikerült csatlakozni a Supabase szerverhez.');
                return;
            }

            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const username = usernameInput.value.trim();

            if (currentMode === 'register') {
                if (!email || !password || !username) {
                    showMessage('Kérjük, tölts ki minden mezőt!');
                    return;
                }

                authSubmitBtn.innerText = 'Regisztráció...';

                try {
                    const { data, error } = await supabaseClient.auth.signUp({
                        email: email,
                        password: password,
                        options: { data: { display_name: username } }
                    });

                    authSubmitBtn.innerText = 'Regisztráció';

                    if (error) {
                        showMessage('Hiba regisztrációkor: ' + error.message);
                    } else if (data.user && data.session === null) {
                        showMessage('Sikeres regisztráció! Kérlek igazold vissza az e-mail címedet a kiküldött levélben a bejelentkezéshez.', false);
                    } else {
                        showMessage('Sikeres regisztráció!', false);
                        setTimeout(() => authOverlay.classList.add('hidden'), 1000);
                    }
                } catch (err) {
                    authSubmitBtn.innerText = 'Regisztráció';
                    showMessage('Váratlan hiba: ' + err.message);
                }
            }
            else if (currentMode === 'login') {
                if (!email || !password) {
                    showMessage('Kérjük, add meg az e-mail címed és a jelszavad!');
                    return;
                }

                authSubmitBtn.innerText = 'Bejelentkezés...';

                try {
                    const { data, error } = await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });

                    authSubmitBtn.innerText = 'Bejelentkezés';

                    if (error) {
                        if (error.message.includes('Email not confirmed')) {
                            showMessage('Az e-mail címed még nincs megerősítve! Kattints a kapott e-mailben lévő linkre, vagy kapcsold ki az E-mail confirmation-t a Supabase-ben.');
                        } else if (error.message.includes('Invalid login credentials')) {
                            showMessage('Hibás e-mail cím vagy jelszó!');
                        } else {
                            showMessage('Bejelentkezési hiba: ' + error.message);
                        }
                    } else {
                        authOverlay.classList.add('hidden');
                    }
                } catch (err) {
                    authSubmitBtn.innerText = 'Bejelentkezés';
                    showMessage('Váratlan hiba: ' + err.message);
                }
            }
            else if (currentMode === 'forgot') {
                if (!email) {
                    showMessage('Kérjük, add meg az e-mail címed!');
                    return;
                }

                authSubmitBtn.innerText = 'Küldés...';

                const { error } = await supabaseClient.auth.resetPasswordForEmail(email);
                authSubmitBtn.innerText = 'E-mail küldése';

                if (error) {
                    showMessage('Hiba: ' + error.message);
                } else {
                    showMessage('A jelszóvisszaállító linket elküldtük az e-mail címedre!', false);
                }
            }
        }

        async function checkUserSession() {
            if (!supabaseClient) return;
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session) {
                    authOverlay.classList.add('hidden');
                } else {
                    authOverlay.classList.remove('hidden');
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function logout() {
            if (supabaseClient) {
                await supabaseClient.auth.signOut();
            }
            authOverlay.classList.remove('hidden');
            switchMode('login');
        }

        checkUserSession();
    </script>
</body>
</html>
