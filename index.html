<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S4Memo - Sims Tree Style</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.85);
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-color: #f8fafc;
            --subtext-color: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --line-color: #64748b;
            --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --panel-bg: rgba(255, 255, 255, 0.85);
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --text-color: #0f172a;
            --subtext-color: #64748b;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --line-color: #94a3b8;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            font-family: var(--font-family);
            transition: background-color 0.2s, border-color 0.2s;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden; min-height: 100vh;
        }

        /* -------------------------------------------------- */
        /* UPPER NAVBAR & CONTROLS                            */
        /* -------------------------------------------------- */
        .top-nav {
            position: fixed; top: 16px; left: 16px; right: 16px;
            height: 60px; background: var(--panel-bg);
            backdrop-filter: blur(12px); border: 1px solid var(--card-border);
            border-radius: 16px; display: flex; align-items: center;
            justify-content: space-between; padding: 0 20px; z-index: 1000;
            box-shadow: var(--shadow);
        }
        .logo { font-weight: 800; font-size: 18px; display: flex; align-items: center; gap: 8px; letter-spacing: -0.5px; }
        .plumbob {
            width: 12px; height: 18px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            display: inline-block;
        }
        .nav-actions { display: flex; gap: 10px; }
        .btn {
            background: var(--card-bg); border: 1px solid var(--card-border);
            color: var(--text-color); padding: 8px 16px; border-radius: 10px;
            font-weight: 600; font-size: 13px; cursor: pointer; display: flex;
            align-items: center; gap: 6px;
        }
        .btn:hover { border-color: var(--accent-color); color: var(--accent-color); }
        .btn-primary { background: var(--accent-color); color: #fff; border: none; }
        .btn-primary:hover { background: var(--accent-hover); color: #fff; }

        /* -------------------------------------------------- */
        /* SIDE PANEL (Trees & Sims)                         */
        /* -------------------------------------------------- */
        .sidebar-panel {
            position: fixed; top: 90px; left: 16px; width: 280px;
            background: var(--panel-bg); backdrop-filter: blur(12px);
            border: 1px solid var(--card-border); border-radius: 16px;
            padding: 16px; z-index: 900; box-shadow: var(--shadow);
            max-height: calc(100vh - 120px); display: flex; flex-direction: column; gap: 12px;
        }
        .section-title { font-size: 11px; font-weight: 700; color: var(--subtext-color); text-transform: uppercase; letter-spacing: 0.8px; }
        .tree-list { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
        .tree-item {
            padding: 10px 12px; border-radius: 10px; border: 1px solid transparent;
            background: rgba(255, 255, 255, 0.03); font-size: 13px; font-weight: 600;
            cursor: pointer; display: flex; justify-content: space-between; align-items: center;
        }
        .tree-item.active { background: var(--card-bg); border-color: var(--accent-color); color: var(--accent-color); }

        /* -------------------------------------------------- */
        /* CANVAS & ZOOM                                      */
        /* -------------------------------------------------- */
        .viewport { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; overflow: hidden; cursor: grab; }
        .viewport:active { cursor: grabbing; }
        .world { width: 5000px; height: 5000px; position: absolute; transform-origin: 0 0; will-change: transform; }
        .svg-layer { position: absolute; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

        .zoom-bar {
            position: fixed; bottom: 20px; left: 20px; z-index: 900;
            background: var(--panel-bg); backdrop-filter: blur(12px);
            border: 1px solid var(--card-border); border-radius: 12px;
            padding: 4px; display: flex; gap: 4px; box-shadow: var(--shadow);
        }

        /* -------------------------------------------------- */
        /* SIM NODES (Sims Tree Design)                       */
        /* -------------------------------------------------- */
        .sim-node {
            position: absolute; width: 80px; height: 80px; border-radius: 50%;
            background-color: var(--card-bg); border: 3px solid var(--accent-color);
            box-shadow: var(--shadow); cursor: pointer; z-index: 2; user-select: none;
        }
        .sim-avatar {
            width: 100%; height: 100%; border-radius: 50%; overflow: hidden;
            display: flex; align-items: center; justify-content: center; font-size: 28px;
            background-size: cover; background-position: center;
        }
        .sim-name {
            position: absolute; bottom: -24px; left: 50%; transform: translateX(-50%);
            white-space: nowrap; font-size: 12px; font-weight: 700; background: var(--panel-bg);
            padding: 2px 8px; border-radius: 6px; border: 1px solid var(--card-border);
            color: var(--text-color); backdrop-filter: blur(8px);
        }
        .sim-connect-btn {
            position: absolute; bottom: -4px; right: -4px; width: 24px; height: 24px;
            background: var(--accent-color); color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 14px;
            font-weight: bold; border: 2px solid var(--card-bg); cursor: pointer; z-index: 5;
        }
        .sim-connect-btn:hover { transform: scale(1.15); }

        /* -------------------------------------------------- */
        /* MODALOK & SELECTION SYSTEM                         */
        /* -------------------------------------------------- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px);
            z-index: 2000; display: none; align-items: center; justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 20px; width: 400px; max-width: 90%; padding: 24px;
            box-shadow: var(--shadow);
        }
        .modal-title { font-size: 18px; font-weight: 800; margin-top: 0; margin-bottom: 16px; }

        .sim-select-list { display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow-y: auto; margin-bottom: 16px; }
        .sim-select-item {
            padding: 10px 14px; background: var(--bg-color); border: 1px solid var(--card-border);
            border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 14px;
        }
        .sim-select-item:hover { border-color: var(--accent-color); }

        .relation-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
        .relation-btn {
            padding: 10px; background: var(--bg-color); border: 1px solid var(--card-border);
            border-radius: 10px; color: var(--text-color); font-weight: 600; font-size: 13px;
            cursor: pointer; text-align: center;
        }
        .relation-btn:hover, .relation-btn.selected { border-color: var(--accent-color); background: var(--accent-color); color: white; }

        .context-menu {
            position: fixed; display: none; background: var(--panel-bg);
            backdrop-filter: blur(12px); border: 1px solid var(--card-border);
            border-radius: 12px; box-shadow: var(--shadow); z-index: 3000; padding: 6px 0; min-width: 160px;
        }
        .context-menu-item {
            padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px;
        }
        .context-menu-item:hover { background: var(--card-bg); color: var(--accent-color); }
        .context-menu-item.danger { color: #ef4444; }
    </style>
</head>
<body>

    <!-- FELSŐ SÁV -->
    <div class="top-nav">
        <div class="logo"><span class="plumbob"></span> S4Memo</div>
        <div class="nav-actions">
            <button class="btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark</button>
            <button class="btn btn-primary" onclick="addNewSimDialog()">+ Új Sim</button>
        </div>
    </div>

    <!-- BAL OLDALI PANEL -->
    <div class="sidebar-panel">
        <div class="section-title">Családfák</div>
        <div class="tree-list" id="treeList"></div>
        <button class="btn" onclick="createNewTree()" style="width: 100%; justify-content: center;">+ Új Családfa</button>
    </div>

    <!-- ZOOM PARANCSOK -->
    <div class="zoom-bar">
        <button class="btn" onclick="adjustZoom(0.1)">+</button>
        <button class="btn" onclick="adjustZoom(-0.1)">-</button>
        <button class="btn" onclick="resetZoom()">100%</button>
    </div>

    <!-- VÁSZON -->
    <div class="viewport" id="viewport">
        <div class="world" id="world">
            <svg class="svg-layer" id="svgLayer"></svg>
        </div>
    </div>

    <!-- 1. LÉPÉS MODAL: SIM KIVÁLASZTÁSA KAPCSOLÓDÁSHOZ -->
    <div class="modal-overlay" id="selectSimModal">
        <div class="modal-box">
            <h3 class="modal-title">Kivel szeretnéd összekapcsolni?</h3>
            <div class="sim-select-list" id="simSelectList"></div>
            <div style="display: flex; gap: 8px; justify-content: flex-end;">
                <button class="btn" onclick="closeModal('selectSimModal')">Mégse</button>
                <button class="btn btn-primary" onclick="startCreateNewAndConnect()">+ Új Sim létrehozása</button>
            </div>
        </div>
    </div>

    <!-- 2. LÉPÉS MODAL: KAPCSOLAT TÍPUSÁNAK KIVÁLASZTÁSA -->
    <div class="modal-overlay" id="selectRelationModal">
        <div class="modal-box">
            <h3 class="modal-title">Milyen kapcsolatuk van?</h3>
            <div class="relation-grid">
                <button class="relation-btn" onclick="confirmRelation('Házas')">💍 Házas</button>
                <button class="relation-btn" onclick="confirmRelation('Jegyes')">💎 Jegyes</button>
                <button class="relation-btn" onclick="confirmRelation('Gyerek')">👶 Gyerek</button>
                <button class="relation-btn" onclick="confirmRelation('Szülő')">👨‍👩‍👦 Szülő</button>
                <button class="relation-btn" onclick="confirmRelation('Testvér')">🤝 Testvér</button>
                <button class="relation-btn" onclick="confirmRelation('Barát')">⭐ Barát</button>
                <button class="relation-btn" onclick="confirmRelation('Ex')">💔 Ex</button>
                <button class="relation-btn" onclick="confirmRelation('Ellenség')">⚠️ Ellenség</button>
            </div>
            <div style="display: flex; justify-content: flex-end;">
                <button class="btn" onclick="closeModal('selectRelationModal')">Mégse</button>
            </div>
        </div>
    </div>

    <!-- JOBB KLIKK MENÜ -->
    <div class="context-menu" id="contextMenu">
        <div class="context-menu-item" onclick="contextAction('connect')">🔗 Kapcsolódás...</div>
        <div class="context-menu-item" onclick="contextAction('lock')" id="contextLockLabel">🔒 Zárolás</div>
        <div class="context-menu-item danger" onclick="contextAction('delete')">🗑️ Törlés</div>
    </div>

    <script>
        let familyTrees = [
            {
                id: 'tree_1', name: 'Goth család',
                sims: [
                    { id: 'sim_1', firstName: 'Bella', lastName: 'Goth', x: 400, y: 250, locked: false },
                    { id: 'sim_2', firstName: 'Mortimer', lastName: 'Goth', x: 600, y: 250, locked: false }
                ],
                connections: [
                    { id: 'c1', from: 'sim_1', to: 'sim_2', type: 'Házas' }
                ]
            }
        ];

        let currentTreeId = 'tree_1';
        let sourceSimId = null;
        let targetSimId = null;
        let contextSimId = null;

        // Pan & Zoom variables
        let zoom = 1, panX = 0, panY = 0;
        let isPanning = false, startX = 0, startY = 0;
        let activeDragSim = null, dragOffset = { x: 0, y: 0 };

        const viewport = document.getElementById('viewport');
        const world = document.getElementById('world');
        const svgLayer = document.getElementById('svgLayer');

        function getCurrentTree() { return familyTrees.find(t => t.id === currentTreeId); }

        function render() {
            renderTreeList();
            renderCanvas();
        }

        function renderTreeList() {
            const list = document.getElementById('treeList');
            list.innerHTML = '';
            familyTrees.forEach(t => {
                const item = document.createElement('div');
                item.className = `tree-item ${t.id === currentTreeId ? 'active' : ''}`;
                item.innerText = t.name;
                item.onclick = () => { currentTreeId = t.id; render(); };
                list.appendChild(item);
            });
        }

        function renderCanvas() {
            document.querySelectorAll('.sim-node').forEach(n => n.remove());
            svgLayer.innerHTML = '';
            const tree = getCurrentTree(); if (!tree) return;

            // Kapcsolatok (Vonalak) kirajzolása
            tree.connections.forEach(conn => {
                const s1 = tree.sims.find(s => s.id === conn.from);
                const s2 = tree.sims.find(s => s.id === conn.to);
                if (s1 && s2) {
                    const x1 = s1.x + 40, y1 = s1.y + 40;
                    const x2 = s2.x + 40, y2 = s2.y + 40;

                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
                    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
                    line.setAttribute('stroke', conn.type === 'Ex' ? '#ef4444' : '#3b82f6');
                    line.setAttribute('stroke-width', '2');
                    if (conn.type === 'Ex' || conn.type === 'Barát') line.setAttribute('stroke-dasharray', '5,5');
                    svgLayer.appendChild(line);

                    // Címke gombóc a vonal közepén
                    const textX = (x1 + x2) / 2;
                    const textY = (y1 + y2) / 2;
                    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                    
                    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    rect.setAttribute('x', textX - 25); rect.setAttribute('y', textY - 10);
                    rect.setAttribute('width', '50'); rect.setAttribute('height', '20');
                    rect.setAttribute('rx', '10'); rect.setAttribute('fill', 'var(--card-bg)');
                    rect.setAttribute('stroke', 'var(--card-border)');

                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    text.setAttribute('x', textX); text.setAttribute('y', textY + 4);
                    text.setAttribute('fill', 'var(--text-color)');
                    text.setAttribute('font-size', '10'); text.setAttribute('font-weight', 'bold');
                    text.setAttribute('text-anchor', 'middle');
                    text.textContent = conn.type;

                    g.appendChild(rect); g.appendChild(text);
                    svgLayer.appendChild(g);
                }
            });

            // Sim-ek kirajzolása
            tree.sims.forEach(sim => {
                const node = document.createElement('div');
                node.className = 'sim-node';
                node.style.left = sim.x + 'px';
                node.style.top = sim.y + 'px';

                const avatar = document.createElement('div');
                avatar.className = 'sim-avatar';
                avatar.innerText = '👤';

                const name = document.createElement('div');
                name.className = 'sim-name';
                name.innerText = `${sim.firstName} ${sim.lastName}`;

                const connectBtn = document.createElement('div');
                connectBtn.className = 'sim-connect-btn';
                connectBtn.innerText = '+';
                connectBtn.title = 'Kapcsolat hozzáadása';
                connectBtn.onclick = (e) => { e.stopPropagation(); openSelectSimModal(sim.id); };

                node.appendChild(avatar); node.appendChild(name); node.appendChild(connectBtn);

                node.addEventListener('mousedown', (e) => {
                    if (e.button !== 0 || sim.locked) return;
                    activeDragSim = sim;
                    dragOffset = { x: (e.clientX / zoom) - sim.x, y: (e.clientY / zoom) - sim.y };
                });

                node.addEventListener('contextmenu', (e) => {
                    e.preventDefault(); e.stopPropagation();
                    openContextMenu(e.clientX, e.clientY, sim);
                });

                world.appendChild(node);
            });
        }

        /* -------------------------------------------------- */
        /* KAPCSOLAT ÉPÍTŐ LOGIKA (KÉT LÉPCSŐS)               */
        /* -------------------------------------------------- */
        function openSelectSimModal(simId) {
            sourceSimId = simId;
            const tree = getCurrentTree();
            const listContainer = document.getElementById('simSelectList');
            listContainer.innerHTML = '';

            const availableSims = tree.sims.filter(s => s.id !== simId);
            availableSims.forEach(s => {
                const item = document.createElement('div');
                item.className = 'sim-select-item';
                item.innerText = `👤 ${s.firstName} ${s.lastName}`;
                item.onclick = () => {
                    targetSimId = s.id;
                    closeModal('selectSimModal');
                    openModal('selectRelationModal');
                };
                listContainer.appendChild(item);
            });

            openModal('selectSimModal');
        }

        function startCreateNewAndConnect() {
            const tree = getCurrentTree();
            const sourceSim = tree.sims.find(s => s.id === sourceSimId);
            const newSim = {
                id: 'sim_' + Date.now(),
                firstName: 'Új', lastName: 'Sim',
                x: sourceSim ? sourceSim.x + 140 : 300,
                y: sourceSim ? sourceSim.y : 300,
                locked: false
            };
            tree.sims.push(newSim);
            targetSimId = newSim.id;
            closeModal('selectSimModal');
            openModal('selectRelationModal');
        }

        function confirmRelation(type) {
            const tree = getCurrentTree();
            tree.connections.push({
                id: 'c_' + Date.now(),
                from: sourceSimId,
                to: targetSimId,
                type: type
            });
            closeModal('selectRelationModal');
            renderCanvas();
        }

        /* -------------------------------------------------- */
        /* UTILITY & EVENTS                                   */
        /* -------------------------------------------------- */
        function updateTransform() { world.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`; }
        function adjustZoom(d) { zoom = Math.min(Math.max(0.3, zoom + d), 2); updateTransform(); }
        function resetZoom() { zoom = 1; panX = 0; panY = 0; updateTransform(); }

        viewport.addEventListener('mousedown', (e) => {
            if (e.button === 0 && !e.target.closest('.sim-node')) {
                isPanning = true; startX = e.clientX - panX; startY = e.clientY - panY;
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isPanning) {
                panX = e.clientX - startX; panY = e.clientY - startY; updateTransform();
            } else if (activeDragSim) {
                activeDragSim.x = (e.clientX / zoom) - dragOffset.x;
                activeDragSim.y = (e.clientY / zoom) - dragOffset.y;
                renderCanvas();
            }
        });

        window.addEventListener('mouseup', () => { isPanning = false; activeDragSim = null; });

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', next);
            document.getElementById('themeBtn').innerText = next === 'light' ? '🌙 Dark' : '☀️ Light';
        }

        function createNewTree() {
            const name = prompt("Családfa neve:");
            if (name) {
                const t = { id: 'tree_' + Date.now(), name: name, sims: [], connections: [] };
                familyTrees.push(t); currentTreeId = t.id; render();
            }
        }

        function addNewSimDialog() {
            const tree = getCurrentTree();
            tree.sims.push({ id: 'sim_' + Date.now(), firstName: 'Új', lastName: 'Sim', x: 400 - panX, y: 300 - panY, locked: false });
            renderCanvas();
        }

        function openContextMenu(x, y, sim) {
            contextSimId = sim.id;
            const cm = document.getElementById('contextMenu');
            cm.style.left = x + 'px'; cm.style.top = y + 'px';
            cm.style.display = 'block';
        }

        document.addEventListener('click', () => document.getElementById('contextMenu').style.display = 'none');

        function contextAction(action) {
            const tree = getCurrentTree();
            const sim = tree.sims.find(s => s.id === contextSimId);
            if (!sim) return;

            if (action === 'connect') openSelectSimModal(sim.id);
            else if (action === 'lock') { sim.locked = !sim.locked; renderCanvas(); }
            else if (action === 'delete') {
                tree.sims = tree.sims.filter(s => s.id !== sim.id);
                tree.connections = tree.connections.filter(c => c.from !== sim.id && c.to !== sim.id);
                renderCanvas();
            }
        }

        render();
    </script>
</body>
</html>
