<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Családfa Kezelő</title>
  <style>
    :root {
      --main-bg: #1a1a2e; /* Alapértelmezett, fix főmenü háttérszín */
      --card-bg: rgba(255, 255, 255, 0.1);
      --text-color: #ffffff;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text-color);
      background: var(--main-bg);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      transition: background 0.3s ease-in-out;
      min-height: 100vh;
    }

    /* Nézetek elrejtése/megjelenítése */
    .page-view {
      display: none;
      padding: 20px;
      box-sizing: border-box;
    }

    .page-view.active {
      display: block;
    }

    /* Navigáció és Gombok */
    header {
      background: rgba(0, 0, 0, 0.5);
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(5px);
    }

    button {
      background: #4e54c8;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #8f94fb;
    }

    /* Kártyák és Menük */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .tree-canvas {
      margin-top: 20px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 8px;
      min-height: 300px;
    }

    .controls {
      margin-bottom: 15px;
      background: rgba(0, 0, 0, 0.3);
      padding: 10px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <!-- Fejléc / Navigáció -->
  <header>
    <h1 id="page-title">Főmenü</h1>
    <button id="back-btn" onclick="showView('mainMenu')" style="display: none;">← Vissza a főmenübe</button>
  </header>

  <!-- 1. FŐMENÜ NÉZET (Fix Háttér) -->
  <main id="mainMenu" class="page-view active">
    <h2>Válassz családfát</h2>
    <div class="grid" id="tree-list">
      <!-- A családfák dinamiusan töltődnek ide -->
    </div>
  </main>

  <!-- 2. CSALÁDFA EGYEDI NÉZET (Módosítható Háttér) -->
  <main id="familyTree" class="page-view">
    <!-- Háttérváltó vezérlő (Kizárólag az adott családfához) -->
    <div class="controls">
      <label for="bgInput"><b>Adott családfa háttere:</b> </label>
      <input type="text" id="bgInput" placeholder="Kép URL vagy színkód (pl. #ff0000)">
      <button onclick="applyTreeBackground()">Háttér Mentése</button>
    </div>

    <div class="tree-canvas">
      <h2 id="tree-name">Családfa</h2>
      <div id="tree-content">Itt jelennek meg a családfa elemei...</div>
    </div>
  </main>

  <script>
    // FIX FŐMENÜ HÁTTÉR (Nem módosítható a menüből)
    const MAIN_MENU_BACKGROUND = "#1a1a2e";

    // Családfák adatai saját, egyedi háttérrel
    let familyTrees = [
      {
        id: 'tree_1',
        name: 'Kovács család',
        background: 'linear-gradient(to right, #2c3e50, #000000)'
      },
      {
        id: 'tree_2',
        name: 'Nagy család',
        background: 'linear-gradient(to right, #11998e, #38ef7d)'
      }
    ];

    let currentTreeId = null;

    // Nézetek és Háttér kezelése
    function showView(viewId, treeId = null) {
      // Összes nézet elrejtése
      document.querySelectorAll('.page-view').forEach(view => view.classList.remove('active'));

      const bodyStyle = document.body.style;
      const backBtn = document.getElementById('back-btn');

      if (viewId === 'mainMenu') {
        currentTreeId = null;
        document.getElementById('mainMenu').classList.add('active');
        document.getElementById('page-title').innerText = 'Főmenü';
        backBtn.style.display = 'none';

        // FIX Háttér visszaállítása a főmenüben
        bodyStyle.background = MAIN_MENU_BACKGROUND;
        renderMainMenu();

      } else if (viewId === 'familyTree' && treeId) {
        currentTreeId = treeId;
        const currentTree = familyTrees.find(t => t.id === treeId);

        document.getElementById('familyTree').classList.add('active');
        document.getElementById('page-title').innerText = currentTree.name;
        document.getElementById('tree-name').innerText = currentTree.name;
        backBtn.style.display = 'block';

        // Egyedi Háttér betöltése az adott családfához
        bodyStyle.background = currentTree.background || MAIN_MENU_BACKGROUND;
        document.getElementById('bgInput').value = currentTree.background || '';
      }
    }

    // Főmenü kártyáinak kirajzolása
    function renderMainMenu() {
      const container = document.getElementById('tree-list');
      container.innerHTML = '';

      familyTrees.forEach(tree => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <h3>${tree.name}</h3>
          <button onclick="showView('familyTree', '${tree.id}')">Megnyitás</button>
        `;
        container.appendChild(card);
      });
    }

    // Kizárólag az aktív családfa hátterének módosítása
    function applyTreeBackground() {
      if (!currentTreeId) return;

      const inputVal = document.getElementById('bgInput').value.trim();
      const tree = familyTrees.find(t => t.id === currentTreeId);

      if (tree) {
        // Ha URL-t adtak meg, képpé alakítjuk, különben megtartjuk színként/gradiensként
        const isUrl = inputVal.startsWith('http://') || inputVal.startsWith('https://') || inputVal.startsWith('assets/');
        tree.background = isUrl ? `url("${inputVal}") center/cover no-repeat` : inputVal;

        // Azonnali frissítés a képernyőn
        document.body.style.background = tree.background;
      }
    }

    // Indításkor a főmenűt töltjük be
    showView('mainMenu');
  </script>
</body>
</html>
