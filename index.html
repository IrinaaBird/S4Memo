<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S4Memo - Sims 4 Memorable</title>
    <style>
        :root {
            --bg-color: #f7ebe1;
            --bg-pattern: radial-gradient(#e2cebe 1.5px, transparent 1.5px);
            --card-bg: #fffbf7;
            --text-color: #4a3b32;
            --subtext-color: #7d685c;
            --border-color: #e6d7cd;
            --accent-color: #d97757;
            --accent-hover: #c46444;
            --active-glow: rgba(217, 119, 87, 0.4);
            --shadow-color: rgba(90, 60, 45, 0.08);
            --nav-bg: #f1e2d5;
            --input-bg: #ffffff;

            --btn-pink: #ff6b8b;
            --btn-pink-hover: #ff4770;
            --btn-green: #2ed573;
            --btn-green-hover: #26af5f;
            --line-pink: #ff4770;
            --line-green: #2ed573;

            /* Dinamikus Testreszabási Változók */
            --sim-node-radius: 50%;
            --line-stroke-width: 3.5px;
        }

        [data-theme="dark"] {
            --bg-color: #1a1715;
            --bg-pattern: radial-gradient(#332b26 1.5px, transparent 1.5px);
            --card-bg: #262220;
            --text-color: #f0e6e0;
            --subtext-color: #b0a095;
            --border-color: #3b3330;
            --accent-color: #d97757;
            --accent-hover: #e68868;
            --active-glow: rgba(217, 119, 87, 0.5);
            --shadow-color: rgba(0, 0, 0, 0.3);
            --nav-bg: #201c1a;
            --input-bg: #2d2724;

            --btn-pink: #ff5277;
            --btn-pink-hover: #ff2a55;
            --btn-green: #2ed573;
            --btn-green-hover: #219d52;
            --line-pink: #ff5277;
            --line-green: #2ed573;
        }

        /* HÁTTÉR MINTÁK */
        body.bg-dots { background-image: var(--bg-pattern); background-size: 24px 24px; }
        body.bg-clean { background-image: none !important; }
        body.bg-grid { 
            background-image: linear-gradient(var(--border-color) 1px, transparent 1px), linear-gradient(90deg, var(--border-color) 1px, transparent 1px);
            background-size: 30px 30px; 
        }

        * {
            box-sizing: border-box;
            font-family: 'Quicksand', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden; min-height: 100vh;
        }

        /* -------------------------------------------------- */
        /* VONAL STÍLUSOK (ANIMÁLT ÉS KLASSZIKUS)             */
        /* -------------------------------------------------- */
        @keyframes pulseGlowPath {
            0% { stroke-dashoffset: 200; opacity: 0.8; }
            50% { opacity: 1; }
            100% { stroke-dashoffset: 0; opacity: 0.8; }
        }

        svg path { fill: none !important; stroke-linecap: round; }

        /* Glow Stream Animált */
        .style-glow .line-love {
            stroke: var(--line-pink); stroke-width: var(--line-stroke-width);
            stroke-dasharray: 140 30; animation: pulseGlowPath 2.5s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 8px rgba(255, 71, 112, 0.75));
        }
        .style-glow .line-child {
            stroke: var(--line-green); stroke-width: var(--line-stroke-width);
            stroke-dasharray: 140 30; animation: pulseGlowPath 2.5s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 8px rgba(46, 213, 115, 0.75));
        }

        /* Folyamatos Neon (Nincs mozgás) */
        .style-solid .line-love {
            stroke: var(--line-pink); stroke-width: var(--line-stroke-width); stroke-dasharray: none; animation: none;
            filter: drop-shadow(0 0 6px rgba(255, 71, 112, 0.6));
        }
        .style-solid .line-child {
            stroke: var(--line-green); stroke-width: var(--line-stroke-width); stroke-dasharray: none; animation: none;
            filter: drop-shadow(0 0 6px rgba(46, 213, 115, 0.6));
        }

        /* Szaggatott Klasszikus */
        .style-dashed .line-love {
            stroke: var(--line-pink); stroke-width: var(--line-stroke-width); stroke-dasharray: 8 6; animation: none; filter: none;
        }
        .style-dashed .line-child {
            stroke: var(--line-green); stroke-width: var(--line-stroke-width); stroke-dasharray: 8 6; animation: none; filter: none;
        }

        /* -------------------------------------------------- */
        /* BAL OLDALI KINYITHATÓ TESTRESZABÁSI PANEL         */
        /* -------------------------------------------------- */
        .style-panel-drawer {
            position: absolute; bottom: 20px; left: 20px; z-index: 1060;
            background-color: var(--nav-bg); border: 2px solid var(--border-color);
            border-radius: 28px; box-shadow: 0 12px 35px var(--shadow-color);
            width: 270px; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }

        .style-panel-header {
            padding: 14px 20px; font-weight: 800; font-size: 14px;
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; background-color: var(--card-bg); border-bottom: 2px solid var(--border-color);
            user-select: none;
        }

        .style-panel-content {
            padding: 16px; display: flex; flex-direction: column; gap: 14px;
            max-height: 0; opacity: 0; transition: all 0.3s ease; pointer-events: none;
        }

        .style-panel-drawer.open .style-panel-content {
            max-height: 400px; opacity: 1; pointer-events: all;
        }

        .style-group { display: flex; flex-direction: column; gap: 6px; }
        .style-group label { font-size: 11px; font-weight: 800; color: var(--subtext-color); text-transform: uppercase; }
        .style-group select {
            padding: 8px 12px; border-radius: 14px; border: 2px solid var(--border-color);
            background-color: var(--input-bg); color: var(--text-color); font-weight: 700; font-size: 13px; outline: none;
        }

        /* NAVIGÁCIÓ ÉS ALAP ELEMEK */
        .top-nav-container { padding: 20px 20px 0 20px; }
        .top-nav {
            background-color: var(--nav-bg); padding: 14px 28px; display: flex; align-items: center; justify-content: space-between;
            border-radius: 30px; box-shadow: 0 10px 25px var(--shadow-color); border: 2px solid var(--border-color);
        }
        .nav-left { display: flex; align-items: center; gap: 30px; }
        .nav-links { display: flex; gap: 12px; align-items: center; }
        .top-nav a.nav-item { text-decoration: none; font-size: 15px; color: var(--subtext-color); padding: 8px 18px; border-radius: 20px; font-weight: 700; cursor: pointer; }
        .top-nav a.nav-item.active { color: #ffffff; background-color: var(--accent-color); }
        
        .user-profile-btn, .theme-toggle-btn {
            background-color: var(--card-bg); color: var(--text-color); border: 2px solid var(--border-color);
            padding: 9px 18px; border-radius: 25px; font-weight: 700; font-size: 14px; cursor: pointer;
        }

        .logo { display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 800; }
        .plumbob {
            width: 14px; height: 22px; background: linear-gradient(135deg, #2ed573 0%, #1e90ff 100%);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); display: inline-block;
        }

        .page-view { display: none; padding: 30px 20px; max-width: 1100px; margin: 0 auto; }
        .page-view.active { display: block; }
        .main-card { background-color: var(--card-bg); padding: 50px; border-radius: 40px; border: 2px solid var(--border-color); }

        .page-view#treeView { display: none; padding: 0; max-width: 100%; width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; z-index: 100; }
        .page-view#treeView.active { display: block; }
        .tree-full-controls { position: absolute; top: 20px; right: 80px; z-index: 1050; display: flex; gap: 12px; }

        .tree-left-sidebar {
            position: absolute; top: 20px; left: 20px; width: 270px; background-color: var(--nav-bg);
            border: 2px solid var(--border-color); border-radius: 32px; padding: 22px 16px; box-shadow: 0 10px 30px var(--shadow-color);
            z-index: 1050; display: flex; flex-direction: column; gap: 12px;
        }

        .add-tree-btn { background-color: transparent; color: var(--accent-color); border: 2px dashed var(--accent-color); padding: 12px 16px; border-radius: 20px; font-weight: 700; cursor: pointer; }

        .add-sim-floating-btn {
            position: absolute; bottom: 25px; right: 25px; z-index: 1050;
            background: linear-gradient(135deg, var(--btn-pink) 0%, var(--accent-color) 100%);
            color: #ffffff; border: none; padding: 16px 28px; border-radius: 30px; font-weight: 800; cursor: pointer;
        }

        .zoom-controls {
            position: absolute; bottom: 25px; left: 310px; z-index: 1050; display: flex; gap: 8px;
            background-color: var(--nav-bg); padding: 8px; border-radius: 25px; border: 2px solid var(--border-color);
        }
        .zoom-btn { background-color: var(--card-bg); color: var(--text-color); border: 2px solid var(--border-color); width: 38px; height: 38px; border-radius: 50%; font-weight: 800; cursor: pointer; }

        .tree-canvas-viewport { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; overflow: hidden; cursor: grab; }
        .tree-canvas-world { width: 5000px; height: 5000px; position: absolute; top: 0; left: 0; transform-origin: 0 0; }
        .tree-svg-layer { position: absolute; top: 0; left: 0; width: 5000px; height: 5000px; pointer-events: none; z-index: 1; }

        /* DINAMIKUS SIM CSOMÓPONT (KERETSTÍLUSOKKAL) */
        .sim-node {
            position: absolute; width: 94px; height: 94px;
            border-radius: var(--sim-node-radius); background-color: var(--card-bg);
            border: 4px solid var(--accent-color); box-shadow: 0 10px 25px var(--shadow-color);
            cursor: pointer; z-index: 2; user-select: none;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .sim-node-avatar {
            width: 100%; height: 100%; border-radius: var(--sim-node-radius); overflow: hidden;
            display: flex; align-items: center; justify-content: center; font-size: 34px;
            background-size: cover; background-position: center; pointer-events: none;
        }

        .sim-node-label {
            position: absolute; bottom: -28px; white-space: nowrap; font-weight: 800; font-size: 13px;
            color: var(--text-color); background-color: var(--card-bg); padding: 4px 12px; border-radius: 20px;
            border: 2px solid var(--border-color); pointer-events: none;
        }

        .sim-edit-pencil {
            position: absolute; top: -4px; right: -4px; width: 26px; height: 26px;
            background-color: var(--card-bg); border: 2px solid var(--border-color); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; z-index: 6;
        }

        .add-btn-node { position: absolute; width: 28px; height: 28px; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; cursor: pointer; border: 2px solid #ffffff; z-index: 5; }
        .add-partner-btn { right: -8px; top: 50%; transform: translateY(-50%); background-color: var(--btn-pink); }
        .add-child-btn { bottom: -8px; left: 50%; transform: translateX(-50%); background-color: var(--btn-green); }

        /* RIGHT SIDEBAR */
        .right-sidebar { position: fixed; top: 20px; right: -290px; width: 270px; height: calc(100vh - 40px); background-color: var(--nav-bg); padding: 40px 18px 20px 18px; z-index: 2000; border-radius: 36px 0 0 36px; border: 2px solid var(--border-color); border-right: none; transition: right 0.4s ease; }
        .right-sidebar.open { right: 0; }
        .toggle-btn { position: fixed; top: 50%; right: 0; transform: translateY(-50%); background-color: var(--nav-bg); color: var(--text-color); border: 2px solid var(--border-color); border-right: none; padding: 18px 12px; cursor: pointer; font-size: 16px; border-radius: 20px 0 0 20px; z-index: 2001; transition: right 0.4s ease; }
        .toggle-btn.open { right: 270px; }
    </style>
</head>
<body class="bg-dots">

    <!-- NAVIGÁCIÓ -->
    <div class="top-nav-container" id="topNavContainer">
        <nav class="top-nav">
            <div class="nav-left">
                <div class="logo"><span class="plumbob"></span> S4Memo</div>
                <div class="nav-links">
                    <a class="nav-item active" id="navHome" onclick="switchView('home')">Főoldal</a>
                    <a class="nav-item" id="navPublic" onclick="switchView('public')">Publikum</a>
                </div>
            </div>
            <div class="nav-right">
                <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark</button>
            </div>
        </nav>
    </div>

    <!-- FŐOLDAL -->
    <div class="page-view active" id="homeView">
        <main class="main-card">
            <h1>Üdvözöllek a Sims 4 Memorable oldalán!</h1>
            <p>Nyisd meg a Családfát az oldalsó menüből, és szabd személyre a hátteret, vonalakat és simeket!</p>
        </main>
    </div>

    <!-- CSALÁDFÁK NÉZET -->
    <div class="page-view" id="treeView">
        <div class="tree-full-controls">
            <button class="theme-toggle-btn" onclick="toggleTheme()" id="treeThemeBtn">🌙 Dark</button>
        </div>

        <div class="tree-left-sidebar">
            <div style="font-size: 13px; font-weight: 800; color: var(--subtext-color); text-transform: uppercase;">Családfák</div>
            <div id="treeTabsList"></div>
            <button class="add-tree-btn" onclick="createNewTree()">+ Családfa hozzáadása</button>
        </div>

        <!-- BAL ALSÓ KINYITHATÓ TESTRESZABÁSI PANEL -->
        <div class="style-panel-drawer" id="styleDrawer">
            <div class="style-panel-header" onclick="toggleStyleDrawer()">
                <span>🎨 Stílusok & Testreszabás</span>
                <span id="drawerArrow">▲</span>
            </div>
            <div class="style-panel-content">
                <div class="style-group">
                    <label>Háttér Stílusa</label>
                    <select id="bgStyleSelect" onchange="changeBgStyle(this.value)">
                        <option value="dots" selected>Pöttyös (Alapértelmezett)</option>
                        <option value="clean">Letisztult (Sima)</option>
                        <option value="grid">Rácsos Műszaki</option>
                    </select>
                </div>
                <div class="style-group">
                    <label>Kötél / Vonal Animáció</label>
                    <select id="lineStyleSelect" onchange="changeLineStyle(this.value)">
                        <option value="style-glow" selected>Glow Stream (Animált)</option>
                        <option value="style-solid">Folyamatos Neon</option>
                        <option value="style-dashed">Szaggatott Klasszikus</option>
                    </select>
                </div>
                <div class="style-group">
                    <label>Sim Keret Alakja</label>
                    <select id="simShapeSelect" onchange="changeSimShape(this.value)">
                        <option value="50%" selected>Kör (Alapértelmezett)</option>
                        <option value="22px">Lekerekített Négyzet</option>
                        <option value="4px">Éles Négyzet</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="zoom-controls">
            <button class="zoom-btn" onclick="adjustZoom(0.1)">+</button>
            <button class="zoom-btn" onclick="adjustZoom(-0.1)">-</button>
        </div>

        <button class="add-sim-floating-btn" onclick="addNewSimDialog()">+ Új Sim Hozzáadása</button>

        <div class="tree-canvas-viewport" id="treeViewport">
            <div class="tree-canvas-world style-glow" id="treeWorld">
                <svg class="tree-svg-layer" id="svgLayer"></svg>
            </div>
        </div>
    </div>

    <!-- JOBB MENÜ -->
    <div class="right-sidebar" id="sidebar">
        <ul>
            <li><a onclick="switchView('home')" id="menuHome" class="active">🏠 Főoldal</a></li>
            <li><a onclick="switchView('tree')" id="menuTree">🌳 Családfák</a></li>
        </ul>
    </div>
    <button class="toggle-btn" id="toggleBtn">◀</button>

    <script>
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('toggleBtn');
        const styleDrawer = document.getElementById('styleDrawer');
        const treeWorld = document.getElementById('treeWorld');
        const svgLayer = document.getElementById('svgLayer');

        const defaultTrees = [{
            id: 'tree_1', name: 'Goth család',
            sims: [
                { id: 'sim_1', firstName: 'Bella', lastName: 'Goth', color: '#ff4770', x: 450, y: 200, parentId: null, partnerId: null },
                { id: 'sim_2', firstName: 'Mortimer', lastName: 'Goth', color: '#d97757', x: 650, y: 200, parentId: null, partnerId: null }
            ]
        }];

        let familyTrees = defaultTrees;
        let currentTreeId = 'tree_1';
        let zoomLevel = 1, panX = 0, panY = 0;

        function switchView(viewName) {
            document.querySelectorAll('.page-view').forEach(el => el.classList.remove('active'));
            if (viewName === 'home') {
                document.getElementById('topNavContainer').style.display = 'block';
                document.getElementById('homeView').classList.add('active');
            } else if (viewName === 'tree') {
                document.getElementById('topNavContainer').style.display = 'none';
                document.getElementById('treeView').classList.add('active');
                loadCurrentTreeCanvas();
            }
            sidebar.classList.remove('open');
            toggleBtn.classList.remove('open');
        }

        /* STÍLUS BEÁLLÍTÁSOK KEZELÉSE */
        function toggleStyleDrawer() {
            styleDrawer.classList.toggle('open');
            document.getElementById('drawerArrow').innerText = styleDrawer.classList.contains('open') ? '▼' : '▲';
        }

        function changeBgStyle(style) {
            document.body.className = `bg-${style}`;
        }

        function changeLineStyle(styleClass) {
            treeWorld.className = `tree-canvas-world ${styleClass}`;
        }

        function changeSimShape(radiusValue) {
            document.documentElement.style.setProperty('--sim-node-radius', radiusValue);
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            document.documentElement.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
        }

        function loadCurrentTreeCanvas() {
            treeWorld.querySelectorAll('.sim-node').forEach(n => n.remove());
            const tree = familyTrees.find(t => t.id === currentTreeId);
            if (tree) {
                tree.sims.forEach(renderSimNode);
                updateConnections();
            }
        }

        function renderSimNode(sim) {
            const node = document.createElement('div');
            node.className = 'sim-node';
            node.id = sim.id;
            node.style.left = sim.x + 'px';
            node.style.top = sim.y + 'px';
            if (sim.color) node.style.borderColor = sim.color;

            node.innerHTML = `
                <div class="sim-edit-pencil">✏️</div>
                <div class="sim-node-avatar">👤</div>
                <div class="sim-node-label">${sim.firstName} ${sim.lastName}</div>
            `;
            treeWorld.appendChild(node);
        }

        function updateConnections() {
            svgLayer.innerHTML = '';
            const tree = familyTrees.find(t => t.id === currentTreeId);
            if (!tree || tree.sims.length < 2) return;

            const sim1 = tree.sims[0];
            const sim2 = tree.sims[1];

            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', `M ${sim1.x + 94} ${sim1.y + 47} C ${sim1.x + 150} ${sim1.y + 47}, ${sim2.x - 50} ${sim2.y + 47}, ${sim2.x} ${sim2.y + 47}`);
            path.setAttribute('class', 'line-love');
            svgLayer.appendChild(path);
        }

        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('open');
            toggleBtn.classList.toggle('open');
        });

        switchView('tree');
    </script>
</body>
</html>
