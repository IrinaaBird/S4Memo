<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S4Memo - Sims 4 Memorable</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4ede6;
            --bg-pattern: radial-gradient(#d5c4b3 1.5px, transparent 1.5px);
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-solid: #ffffff;
            --text-color: #2c221e;
            --subtext-color: #7a6a60;
            --border-color: rgba(213, 196, 179, 0.5);
            --accent-color: #2ed573;
            --accent-hover: #26af5f;
            --active-glow: rgba(46, 213, 115, 0.35);
            --shadow-color: rgba(44, 34, 30, 0.08);
            --nav-bg: rgba(255, 255, 255, 0.75);
            --input-bg: #fcf9f6;

            --btn-pink: #ff5e7e;
            --btn-pink-hover: #e04867;
            --btn-green: #2ed573;
            --btn-green-hover: #24b05d;
            --line-pink: #ff5e7e;
            --line-green: #2ed573;
            --line-blue: #70a1ff;

            --sim-node-clip-path: none;
            --sim-node-radius: 50%;
            --line-stroke-width: 3.5px;
            
            --custom-bg-size: cover;
            --custom-bg-position: center;
            --bg-blur: 0px;
        }

        [data-theme="dark"] {
            --bg-color: #121110;
            --bg-pattern: radial-gradient(#2a2623 1.5px, transparent 1.5px);
            --card-bg: rgba(30, 26, 24, 0.85);
            --card-solid: #1e1a18;
            --text-color: #f5ebe6;
            --subtext-color: #a39288;
            --border-color: rgba(60, 50, 45, 0.6);
            --accent-color: #2ed573;
            --accent-hover: #3be380;
            --active-glow: rgba(46, 213, 115, 0.4);
            --shadow-color: rgba(0, 0, 0, 0.4);
            --nav-bg: rgba(24, 20, 18, 0.75);
            --input-bg: #26211e;

            --btn-pink: #ff5e7e;
            --btn-pink-hover: #ff3b61;
            --btn-green: #2ed573;
            --btn-green-hover: #219d52;
            --line-pink: #ff5e7e;
            --line-green: #2ed573;
            --line-blue: #70a1ff;
        }

        #bgBlurOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            backdrop-filter: blur(var(--bg-blur));
            -webkit-backdrop-filter: blur(var(--bg-blur));
            transition: backdrop-filter 0.1s ease;
        }

        body.bg-dots { background-image: var(--bg-pattern); background-size: 24px 24px; }
        body.bg-clean { background-image: none !important; }
        body.bg-grid { 
            background-image: linear-gradient(var(--border-color) 1px, transparent 1px), linear-gradient(90deg, var(--border-color) 1px, transparent 1px);
            background-size: 30px 30px; 
        }
        body.bg-custom {
            background-size: var(--custom-bg-size);
            background-position: var(--custom-bg-position);
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        * {
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* ANIMÁCIÓK */
        @keyframes pulseGlowPath {
            0% { stroke-dashoffset: 200; opacity: 0.8; }
            50% { opacity: 1; }
            100% { stroke-dashoffset: 0; opacity: 0.8; }
        }

        @keyframes flickerPath {
            0%, 100% { opacity: 1; filter: drop-shadow(0 0 8px rgba(255, 94, 126, 0.8)); }
            50% { opacity: 0.5; filter: drop-shadow(0 0 2px rgba(255, 94, 126, 0.2)); }
        }

        @keyframes flowDots {
            from { stroke-dashoffset: 40; }
            to { stroke-dashoffset: 0; }
        }

        svg path {
            fill: none !important;
            stroke-linecap: round;
        }

        .style-glow .line-love {
            stroke: var(--line-pink); stroke-width: var(--line-stroke-width);
            stroke-dasharray: 140 30; animation: pulseGlowPath 2.5s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 8px rgba(255, 94, 126, 0.6));
        }
        .style-glow .line-child {
            stroke: var(--line-green); stroke-width: var(--line-stroke-width);
            stroke-dasharray: 140 30; animation: pulseGlowPath 2.5s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 8px rgba(46, 213, 115, 0.6));
        }
        .style-glow .line-sibling {
            stroke: var(--line-blue); stroke-width: var(--line-stroke-width);
            stroke-dasharray: 140 30; animation: pulseGlowPath 2.5s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 8px rgba(112, 161, 255, 0.6));
        }

        .style-solid .line-love { stroke: var(--line-pink); stroke-width: var(--line-stroke-width); filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15)); }
        .style-solid .line-child { stroke: var(--line-green); stroke-width: var(--line-stroke-width); filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15)); }
        .style-solid .line-sibling { stroke: var(--line-blue); stroke-width: var(--line-stroke-width); filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15)); }

        .style-dashed .line-love { stroke: var(--line-pink); stroke-width: var(--line-stroke-width); stroke-dasharray: 8 6; }
        .style-dashed .line-child { stroke: var(--line-green); stroke-width: var(--line-stroke-width); stroke-dasharray: 8 6; }
        .style-dashed .line-sibling { stroke: var(--line-blue); stroke-width: var(--line-stroke-width); stroke-dasharray: 8 6; }

        .style-flicker .line-love { stroke: var(--line-pink); stroke-width: var(--line-stroke-width); animation: flickerPath 1.8s infinite ease-in-out; }
        .style-flicker .line-child { stroke: var(--line-green); stroke-width: var(--line-stroke-width); animation: flickerPath 2.2s infinite ease-in-out; }
        .style-flicker .line-sibling { stroke: var(--line-blue); stroke-width: var(--line-stroke-width); animation: flickerPath 2.0s infinite ease-in-out; }

        .style-dots-flow .line-love { stroke: var(--line-pink); stroke-width: var(--line-stroke-width); stroke-dasharray: 6 10; animation: flowDots 1s linear infinite; }
        .style-dots-flow .line-child { stroke: var(--line-green); stroke-width: var(--line-stroke-width); stroke-dasharray: 6 10; animation: flowDots 1s linear infinite; }
        .style-dots-flow .line-sibling { stroke: var(--line-blue); stroke-width: var(--line-stroke-width); stroke-dasharray: 6 10; animation: flowDots 1s linear infinite; }

        /* TESTRESZABÁSI PANEL */
        .style-panel-drawer {
            position: fixed; bottom: 24px; left: 24px; z-index: 1060;
            background-color: var(--nav-bg); border: 1px solid var(--border-color);
            border-radius: 20px; box-shadow: 0 12px 32px var(--shadow-color);
            width: 260px; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        }

        .style-panel-header {
            padding: 10px 16px; font-weight: 800; font-size: 12px;
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; background: rgba(255, 255, 255, 0.05); border-bottom: 1px solid var(--border-color);
            user-select: none; letter-spacing: 0.5px;
        }

        .style-panel-content {
            padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;
            max-height: 0; opacity: 0; transition: all 0.25s ease; pointer-events: none;
        }

        .style-panel-drawer.open .style-panel-content {
            max-height: 560px; opacity: 1; pointer-events: all;
        }

        .style-group { display: flex; flex-direction: column; gap: 4px; text-align: left; }
        .style-group label { font-size: 10px; font-weight: 800; color: var(--subtext-color); text-transform: uppercase; letter-spacing: 0.5px; display: flex; justify-content: space-between; align-items: center; }
        .style-group select, .style-group input[type="file"] {
            padding: 6px 10px; border-radius: 10px; border: 1px solid var(--border-color);
            background-color: var(--input-bg); color: var(--text-color); font-weight: 700; font-size: 11px; outline: none;
        }
        
        .style-group input[type="range"] { width: 100%; accent-color: var(--accent-color); cursor: pointer; }

        .custom-file-upload { display: none; }
        .custom-file-btn {
            background-color: var(--card-solid); border: 1px dashed var(--accent-color);
            color: var(--accent-color); padding: 6px 10px; border-radius: 10px;
            font-size: 10px; font-weight: 800; text-align: center; cursor: pointer;
        }

        /* UI ELEMEK & STÍLUSOS FEJLÉC */
        .top-nav-container { padding: 16px 24px 0 24px; position: relative; z-index: 1100; }
        .top-nav {
            background-color: var(--nav-bg); padding: 10px 24px;
            display: flex; align-items: center; justify-content: space-between;
            border-radius: 24px; box-shadow: 0 8px 25px var(--shadow-color); border: 1px solid var(--border-color);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        }
        /* (truncated for brevity in commit) */
    </style>
</head>
<body class="bg-dots">

    <div id="bgBlurOverlay"></div>

    <!-- NAVIGÁCIÓ -->
    <div class="top-nav-container" id="topNavContainer">
        <nav class="top-nav">
            <div class="nav-left">
                <div class="logo"><span class="plumbob"></span> S4Memo</div>
                <div class="nav-links">
                    <a class="nav-item active" id="navHome" onclick="switchView('home')">Főoldal</a>
                    <a class="nav-item" id="navTree" onclick="switchView('tree')">Családfák</a>
                    <a class="nav-item" id="navActivity" onclick="switchView('activity')">Aktivitás</a>
                    <a class="nav-item" id="navPublic" onclick="switchView('public')">Publikum</a>
                </div>
            </div>
            <div class="nav-right">
                <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark</button>
                <button class="user-profile-btn" onclick="openProfile()">👤 <span>Profilom</span></button>
            </div>
        </nav>
    </div>

    <!-- ... (page content omitted for brevity) ... -->


    <script src="assets/animals-module.js"></script>
</body>
</html>
