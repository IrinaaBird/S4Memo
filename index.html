<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S4Memo - Sims 4 Memorable</title>
    <style>
        :root {
            --bg-color: #f7ebe1;
            --bg-pattern: radial-gradient(#e2cebe 1.5px, transparent 1.5px);
            --card-bg: #fffbf7;
            --text-color: #4a3b32;
            --subtext-color: #7d685c;
            --border-color: #e6d7cd;
            --accent-color: #d97757;
            --shadow-color: rgba(90, 60, 45, 0.08);
            --nav-bg: #f1e2d5;
            --input-bg: #ffffff;

            --btn-pink: #ff6b8b;
            --btn-pink-hover: #ff4770;
            --btn-green: #2ed573;
            --btn-green-hover: #26af5f;
            --line-pink: #ff4770;
            --line-green: #2ed573;
        }

        [data-theme="dark"] {
            --bg-color: #1a1715;
            --bg-pattern: radial-gradient(#332b26 1.5px, transparent 1.5px);
            --card-bg: #262220;
            --text-color: #f0e6e0;
            --subtext-color: #b0a095;
            --border-color: #3b3330;
            --accent-color: #d97757;
            --shadow-color: rgba(0, 0, 0, 0.3);
            --nav-bg: #201c1a;
            --input-bg: #2d2724;

            --btn-pink: #ff5277;
            --btn-pink-hover: #ff2a55;
            --btn-green: #2ed573;
            --btn-green-hover: #219d52;
            --line-pink: #ff5277;
            --line-green: #2ed573;
        }

        * {
            box-sizing: border-box;
            font-family: 'Quicksand', 'Segoe UI', -apple-system, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            background-image: var(--bg-pattern);
            background-size: 24px 24px;
            color: var(--text-color);
            overflow: hidden; min-height: 100vh;
        }

        /* -------------------------------------------------- */
        /* CSODÁS FOLYTONOS ANIMÁLT KÖTÉL (JAVÍTVA A FEKETE HIRBA)*/
        /* -------------------------------------------------- */
        svg path {
            fill: none !important; /* MEGAKADÁLYOZZA A FEKETE KITÖLTÉST */
        }

        @keyframes ropeGlowPink {
            0% { stroke-width: 4px; filter: drop-shadow(0 0 4px rgba(255, 71, 112, 0.5)); }
            50% { stroke-width: 6px; filter: drop-shadow(0 0 10px rgba(255, 71, 112, 0.9)); }
            100% { stroke-width: 4px; filter: drop-shadow(0 0 4px rgba(255, 71, 112, 0.5)); }
        }

        @keyframes ropeGlowGreen {
            0% { stroke-width: 4px; filter: drop-shadow(0 0 4px rgba(46, 213, 115, 0.5)); }
            50% { stroke-width: 6px; filter: drop-shadow(0 0 10px rgba(46, 213, 115, 0.9)); }
            100% { stroke-width: 4px; filter: drop-shadow(0 0 4px rgba(46, 213, 115, 0.5)); }
        }

        .line-love {
            stroke: var(--line-pink);
            stroke-linecap: round;
            animation: ropeGlowPink 2.5s ease-in-out infinite;
        }

        .line-child {
            stroke: var(--line-green);
            stroke-linecap: round;
            animation: ropeGlowGreen 2.5s ease-in-out infinite;
        }

        /* TOP NAV */
        .top-nav-container { padding: 20px 20px 0 20px; }
        .top-nav {
            background-color: var(--nav-bg); padding: 14px 28px;
            display: flex; align-items: center; justify-content: space-between;
            border-radius: 30px; box-shadow: 0 10px 25px var(--shadow-color); border: 2px solid var(--border-color);
        }
        .nav-left { display: flex; align-items: center; gap: 30px; }
        .nav-links { display: flex; gap: 12px; align-items: center; }
        .top-nav a.nav-item {
            text-decoration: none; font-size: 15px; color: var(--subtext-color);
            padding: 8px 18px; border-radius: 20px; font-weight: 700; cursor: pointer;
        }
        .top-nav a.nav-item.active { color: #ffffff; background-color: var(--accent-color); }
        
        .user-profile-btn, .theme-toggle-btn {
            background-color: var(--card-bg); color: var(--text-color);
            border: 2px solid var(--border-color); padding: 9px 18px; border-radius: 25px;
            font-weight: 700; font-size: 14px; cursor: pointer;
        }

        .logo { font-size: 24px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
        .plumbob {
            width: 14px; height: 22px; background: linear-gradient(135deg, #2ed573 0%, #1e90ff 100%);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); display: inline-block;
        }

        /* CANVAS */
        .page-view { display: none; padding: 30px 20px; max-width: 1100px; margin: 0 auto; }
        .page-view.active { display: block; }

        .page-view#treeView {
            display: none; padding: 0; max-width: 100%; width: 100vw; height: 100vh;
            position: fixed; top: 0; left: 0; z-index: 100;
        }
        .page-view#treeView.active { display: block; }
        .tree-full-controls { position: absolute; top: 20px; right: 80px; z-index: 1050; display: flex; gap: 12px; }

        .tree-left-sidebar {
            position: absolute; top: 20px; left: 20px; width: 270px;
            background-color: var(--nav-bg); border: 2px solid var(--border-color);
            border-radius: 32px; padding: 22px 16px; box-shadow: 0 10px 30px var(--shadow-color);
            z-index: 1050; display: flex; flex-direction: column; gap: 12px;
        }

        .add-tree-btn {
            background-color: transparent; color: var(--accent-color); border: 2px dashed var(--accent-color);
            padding: 12px 16px; border-radius: 20px; font-weight: 700; cursor: pointer;
        }

        .add-sim-floating-btn {
            position: absolute; bottom: 25px; right: 25px; z-index: 1050;
            background: linear-gradient(135deg, var(--btn-pink) 0%, var(--accent-color) 100%);
            color: #ffffff; border: none; padding: 16px 28px;
            border-radius: 30px; font-weight: 800; cursor: pointer;
            box-shadow: 0 8px 22px rgba(255, 71, 112, 0.4);
        }

        .zoom-controls {
            position: absolute; bottom: 25px; left: 310px; z-index: 1050;
            display: flex; gap: 8px; background-color: var(--nav-bg);
            padding: 8px; border-radius: 25px; border: 2px solid var(--border-color);
        }
        .zoom-btn {
            background-color: var(--card-bg); color: var(--text-color);
            border: 2px solid var(--border-color); width: 38px; height: 38px;
            border-radius: 50%; font-weight: 800; cursor: pointer;
        }

        .tree-canvas-viewport { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; overflow: hidden; cursor: grab; }
        .tree-canvas-viewport:active { cursor: grabbing; }
        .tree-canvas-world { width: 5000px; height: 5000px; position: absolute; top: 0; left: 0; transform-origin: 0 0; }
        .tree-svg-layer { position: absolute; top: 0; left: 0; width: 5000px; height: 5000px; pointer-events: none; z-index: 1; }

        /* SIM ELEM */
        @keyframes borderRainbow {
            0% { border-color: #ff4770; box-shadow: 0 0 18px rgba(255, 71, 112, 0.6); }
            50% { border-color: #2ed573; box-shadow: 0 0 18px rgba(46, 213, 115, 0.6); }
            100% { border-color: #ff4770; box-shadow: 0 0 18px rgba(255, 71, 112, 0.6); }
        }

        .sim-node {
            position: absolute; width: 94px; height: 94px;
            border-radius: 50%; background-color: var(--card-bg);
            border: 4px solid var(--accent-color); box-shadow: 0 10px 25px var(--shadow-color);
            cursor: pointer; z-index: 2; user-select: none;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .sim-node.selected { animation: borderRainbow 3s linear infinite; z-index: 10 !important; }

        .sim-node-avatar {
            width: 100%; height: 100%; border-radius: 50%; overflow: hidden;
            display: flex; align-items: center; justify-content: center; font-size: 34px;
            background-size: cover; background-position: center; pointer-events: none;
        }

        .sim-node-label {
            position: absolute; bottom: -28px; white-space: nowrap;
            font-weight: 800; font-size: 13px; color: var(--text-color);
            background-color: var(--card-bg); padding: 4px 12px; border-radius: 20px;
            border: 2px solid var(--border-color); box-shadow: 0 4px 10px var(--shadow-color);
        }

        .sim-edit-pencil {
            position: absolute; top: -4px; right: -4px;
            width: 26px; height: 26px; background-color: var(--card-bg);
            border: 2px solid var(--border-color); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; cursor: pointer; z-index: 6;
        }

        .add-btn-node {
            position: absolute; width: 28px; height: 28px; color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 16px; cursor: pointer; border: 2px solid #ffffff; z-index: 5;
        }
        .add-partner-btn { right: -8px; top: 50%; transform: translateY(-50%); background-color: var(--btn-pink); }
        .add-child-btn { bottom: -8px; left: 50%; transform: translateX(-50%); background-color: var(--btn-green); }

        /* MODALOK */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(0, 0, 0, 0.45); z-index: 3000;
            display: none; align-items: center; justify-content: center; backdrop-filter: blur(6px);
        }
        .modal-overlay.active { display: flex; }
        .modal-card {
            background-color: var(--card-bg); border: 2px solid var(--border-color);
            border-radius: 36px; width: 480px; max-width: 92%; padding: 28px;
            box-shadow: 0 20px 45px var(--shadow-color); max-height: 90vh; overflow-y: auto;
        }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; font-weight: 800; color: var(--subtext-color); margin-bottom: 6px; text-transform: uppercase; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 12px 16px; border-radius: 20px;
            border: 2px solid var(--border-color); background-color: var(--input-bg);
            color: var(--text-color); font-size: 14px; font-weight: 600; outline: none;
        }
        .form-row { display: flex; gap: 12px; }

        /* KÉPSZERKESZTŐ UI (CROP, ZOOM, FILTER, ROTATE) */
        .image-editor-container {
            display: none; flex-direction: column; gap: 12px;
            background-color: var(--nav-bg); padding: 16px; border-radius: 24px;
            border: 2px solid var(--border-color); margin-top: 10px;
        }
        .image-editor-container.active { display: flex; }

        .crop-preview-box {
            width: 160px; height: 160px; margin: 0 auto; border-radius: 50%;
            overflow: hidden; border: 4px solid var(--accent-color);
            position: relative; background-color: #000; display: flex;
            align-items: center; justify-content: center;
        }
        .crop-preview-img {
            max-width: none; transition: transform 0.1s ease, filter 0.2s ease;
            transform-origin: center center;
        }

        .editor-controls-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: center;
        }

        .btn-small {
            padding: 8px 12px; font-size: 12px; font-weight: 700; border-radius: 14px;
            border: 2px solid var(--border-color); background-color: var(--card-bg);
            color: var(--text-color); cursor: pointer; text-align: center;
        }
        .btn-small:hover { border-color: var(--accent-color); color: var(--accent-color); }

        /* KERESŐ ÉS LISTA A KAPCSOLATOKHOZ */
        .sim-search-results {
            max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
            margin-top: 8px; padding-right: 4px;
        }
        .sim-search-item {
            display: flex; align-items: center; gap: 12px; padding: 10px 14px;
            border-radius: 18px; background-color: var(--nav-bg); border: 2px solid transparent;
            cursor: pointer; transition: all 0.2s ease;
        }
        .sim-search-item:hover, .sim-search-item.selected {
            border-color: var(--accent-color); background-color: var(--card-bg); transform: translateX(4px);
        }
        .sim-search-avatar {
            width: 40px; height: 40px; border-radius: 50%; background-size: cover;
            background-position: center; border: 2px solid var(--border-color);
            display: flex; align-items: center; justify-content: center; font-size: 18px;
        }

        .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 22px; }
        .btn-secondary { background-color: transparent; border: 2px solid var(--border-color); color: var(--text-color); padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: 700; }
        .btn-primary { background-color: var(--btn-pink); border: none; color: white; padding: 10px 24px; border-radius: 20px; cursor: pointer; font-weight: 700; }
        .btn-danger { background-color: #d9534f; border: none; color: white; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: 700; margin-right: auto; }

        /* RIGHT SIDEBAR */
        .right-sidebar {
            position: fixed; top: 20px; right: -290px; width: 270px; height: calc(100vh - 40px);
            background-color: var(--nav-bg); box-shadow: -15px 0 35px var(--shadow-color);
            transition: right 0.4s ease; padding: 40px 18px 20px 18px; z-index: 2000;
            border-radius: 36px 0 0 36px; border: 2px solid var(--border-color); border-right: none;
        }
        .right-sidebar.open { right: 0; }
        .right-sidebar ul { list-style: none; padding: 0; margin: 0; }
        .right-sidebar ul li a { display: flex; align-items: center; gap: 14px; padding: 14px 20px; color: var(--text-color); text-decoration: none; font-weight: 700; border-radius: 20px; cursor: pointer; }
        .toggle-btn { position: fixed; top: 50%; right: 0; transform: translateY(-50%); background-color: var(--nav-bg); color: var(--text-color); border: 2px solid var(--border-color); padding: 18px 12px; cursor: pointer; border-radius: 20px 0 0 20px; z-index: 2001; }
        .toggle-btn.open { right: 270px; }
    </style>
</head>
<body>

    <!-- NAVIGÁCIÓ -->
    <div class="top-nav-container" id="topNavContainer">
        <nav class="top-nav">
            <div class="nav-left">
                <div class="logo"><span class="plumbob"></span> S4Memo</div>
                <div class="nav-links">
                    <a class="nav-item active" id="navHome" onclick="switchView('home')">Főoldal</a>
                    <a class="nav-item" id="navPublic" onclick="switchView('public')">Publikum</a>
                </div>
            </div>
            <div class="nav-right">
                <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark</button>
            </div>
        </nav>
    </div>

    <!-- FŐOLDAL -->
    <div class="page-view active" id="homeView">
        <main style="background:var(--card-bg); padding:40px; border-radius:30px; border:2px solid var(--border-color);">
            <h1>S4Memo Családfa Építő</h1>
            <p>Válassz a jobb oldali menüből a 🌳 Családfák megnyitásához.</p>
        </main>
    </div>

    <!-- CSALÁDFÁK NÉZET -->
    <div class="page-view" id="treeView">
        <div class="tree-full-controls">
            <button class="theme-toggle-btn" onclick="toggleTheme()" id="treeThemeBtn">🌙 Dark</button>
        </div>

        <div class="tree-left-sidebar">
            <div style="font-size: 12px; font-weight: 800; color: var(--subtext-color);">CSALÁDFÁK</div>
            <div id="treeTabsList"></div>
            <button class="add-tree-btn" onclick="createNewTree()">+ Családfa hozzáadása</button>
        </div>

        <div class="zoom-controls">
            <button class="zoom-btn" onclick="adjustZoom(0.1)">+</button>
            <button class="zoom-btn" onclick="adjustZoom(-0.1)">-</button>
            <button class="zoom-btn" onclick="resetZoom()">100%</button>
        </div>

        <button class="add-sim-floating-btn" onclick="addNewSimDialog()">+ Új Sim Hozzáadása</button>

        <div class="tree-canvas-viewport" id="treeViewport">
            <div class="tree-canvas-world" id="treeWorld">
                <svg class="tree-svg-layer" id="svgLayer"></svg>
            </div>
        </div>
    </div>

    <!-- SIM SZERKESZTŐ MODAL + KÉPSZERKESZTŐLEHETŐSÉG -->
    <div class="modal-overlay" id="simModal">
        <div class="modal-card">
            <h2>Sim Szerkesztése</h2>
            <form id="simForm" onsubmit="saveSimDetails(event)">
                <div class="form-row">
                    <div class="form-group" style="flex:1;">
                        <label>Vezetéknév</label>
                        <input type="text" id="editLastName" required>
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label>Keresztnév</label>
                        <input type="text" id="editFirstName" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group" style="flex:1;">
                        <label>Életkor</label>
                        <select id="editAge">
                            <option value="Tipegő">Tipegő</option>
                            <option value="Gyermek">Gyermek</option>
                            <option value="Tini">Tini</option>
                            <option value="Fiatal felnőtt" selected>Fiatal felnőtt</option>
                            <option value="Felnőtt">Felnőtt</option>
                            <option value="Idős">Idős</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label>Keretszín</label>
                        <input type="color" id="editColor" value="#d97757">
                    </div>
                </div>

                <!-- KÉP FELTÖLTÉS ÉS SZERKESZTÉS -->
                <div class="form-group">
                    <label>Profilkép feltöltése & szerkesztése</label>
                    <input type="file" id="editImageInput" accept="image/*" onchange="loadEditorImage(event)">
                </div>

                <div class="image-editor-container" id="imageEditorBox">
                    <div class="crop-preview-box">
                        <img id="cropImgPreview" class="crop-preview-img" src="" alt="Előnézet">
                    </div>

                    <div class="editor-controls-grid">
                        <div>
                            <label style="font-size:10px; font-weight:800;">ZOOM</label>
                            <input type="range" id="imgZoom" min="1" max="3" step="0.1" value="1" oninput="applyImageTransforms()">
                        </div>
                        <div>
                            <label style="font-size:10px; font-weight:800;">FORGATÁS</label>
                            <button type="button" class="btn-small" style="width:100%;" onclick="rotateImage()">🔄 +90°</button>
                        </div>
                    </div>

                    <div class="form-group" style="margin-bottom:0;">
                        <label style="font-size:10px;">FILTEREK</label>
                        <select id="imgFilterSelect" onchange="applyImageTransforms()">
                            <option value="none">Normál</option>
                            <option value="grayscale(100%)">Fekete-Fehér</option>
                            <option value="sepia(80%)">Szépia</option>
                            <option value="saturate(200%)">Élénk</option>
                            <option value="contrast(150%) hue-rotate(30deg)">Vintage</option>
                        </select>
                    </div>
                </div>

                <div class="form-group" style="margin-top:14px;">
                    <label>Leírás / Jegyek</label>
                    <textarea id="editTraits" rows="2"></textarea>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-danger" onclick="deleteCurrentSimModal()">Törlés</button>
                    <button type="button" class="btn-secondary" onclick="closeSimModal()">Mégse</button>
                    <button type="submit" class="btn-primary">Mentés</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODERN KAPCSOLAT VÁLASZTÓ MODAL (ÉLŐ KERESŐVEL ÉS KÉPEKKEL) -->
    <div class="modal-overlay" id="connectionModal">
        <div class="modal-card">
            <h2 id="connectionModalTitle">Kapcsolat Hozzáadása</h2>
            
            <div class="form-group">
                <label>Sim keresése (Név / Kezdőbetű)</label>
                <input type="text" id="simSearchInput" placeholder="Kezdd el írni a nevet..." oninput="filterSimList()">
            </div>

            <div class="form-group">
                <label>Válassz Simet a listából</label>
                <div class="sim-search-results" id="simSearchResultsBox"></div>
            </div>

            <div class="form-group" style="margin-top: 18px;">
                <label>Kapcsolat típusa</label>
                <select id="relationTypeSelect">
                    <option value="Házas">Házas (Rózsaszín kötél)</option>
                    <option value="Jegyes">Jegyes (Rózsaszín kötél)</option>
                    <option value="Szerelmes">Szerelmes (Rózsaszín kötél)</option>
                    <option value="Gyerek">Gyerek (Zöld kötél)</option>
                    <option value="Szülő">Szülő (Zöld kötél)</option>
                </select>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn-secondary" onclick="closeConnectionModal()">Mégse</button>
                <button type="button" class="btn-primary" onclick="confirmConnection()">Kapcsolás</button>
            </div>
        </div>
    </div>

    <!-- ELŐUGRÓ JOBB MENÜ -->
    <div class="right-sidebar" id="sidebar">
        <ul>
            <li><a onclick="switchView('home')">🏠 Főoldal</a></li>
            <li><a onclick="switchView('tree')">🌳 Családfák</a></li>
        </ul>
    </div>
    <button class="toggle-btn" id="toggleBtn">◀</button>

    <script>
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('toggleBtn');
        const themeBtn = document.getElementById('themeBtn');
        const treeThemeBtn = document.getElementById('treeThemeBtn');
        const topNavContainer = document.getElementById('topNavContainer');
        const treeWorld = document.getElementById('treeWorld');
        const treeViewport = document.getElementById('treeViewport');
        const svgLayer = document.getElementById('svgLayer');
        const treeTabsList = document.getElementById('treeTabsList');
        const simModal = document.getElementById('simModal');
        const connectionModal = document.getElementById('connectionModal');

        // Képszerkesztő állapota
        let imageEditorState = { zoom: 1, rotation: 0, filter: 'none', rawData: '' };
        let selectedTargetSimId = null;

        let familyTrees = [
            {
                id: 'tree_1',
                name: 'Goth család',
                sims: [
                    { id: 'sim_1', firstName: 'Bella', lastName: 'Goth', age: 'Fiatal felnőtt', traits: '', color: '#ff4770', image: '', x: 450, y: 200, parentId: null, partnerId: null, relationType: null }
                ]
            }
        ];
        let currentTreeId = 'tree_1';
        let editingSimId = null;
        let contextSimId = null;
        let selectedSimId = null;

        let zoomLevel = 1;
        let panX = 0, panY = 0;
        let isPanning = false, startPanX = 0, startPanY = 0;
        let activeDrag = null, dragStartMouse = { x: 0, y: 0 }, dragStartSimPos = { x: 0, y: 0 };

        function switchView(viewName) {
            document.querySelectorAll('.page-view').forEach(el => el.classList.remove('active'));
            if (viewName === 'home') {
                topNavContainer.style.display = 'block';
                document.getElementById('homeView').classList.add('active');
            } else if (viewName === 'tree') {
                topNavContainer.style.display = 'none';
                document.getElementById('treeView').classList.add('active');
                renderTreeTabs();
                loadCurrentTreeCanvas();
            }
            sidebar.classList.remove('open'); toggleBtn.classList.remove('open');
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            updateConnections();
        }

        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('open'); toggleBtn.classList.toggle('open');
        });

        function adjustZoom(delta) {
            zoomLevel = Math.min(Math.max(0.4, zoomLevel + delta), 2.0);
            treeWorld.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;
        }
        function resetZoom() { zoomLevel = 1; panX = 0; panY = 0; treeWorld.style.transform = `translate(0px, 0px) scale(1)`; }

        treeViewport.addEventListener('mousedown', (e) => {
            if (e.target.closest('.sim-node') || e.target.closest('.modal-overlay')) return;
            setSelectedSim(null); isPanning = true;
            startPanX = e.clientX - panX; startPanY = e.clientY - panY;
        });

        window.addEventListener('mousemove', (e) => {
            if (isPanning) {
                panX = e.clientX - startPanX; panY = e.clientY - startPanY;
                treeWorld.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;
                return;
            }
            if (!activeDrag) return;
            const dx = (e.clientX - dragStartMouse.x) / zoomLevel;
            const dy = (e.clientY - dragStartMouse.y) / zoomLevel;
            activeDrag.x = Math.max(0, dragStartSimPos.x + dx);
            activeDrag.y = Math.max(0, dragStartSimPos.y + dy);

            const node = document.getElementById(activeDrag.id);
            if (node) { node.style.left = activeDrag.x + 'px'; node.style.top = activeDrag.y + 'px'; }
            updateConnections();
        });

        window.addEventListener('mouseup', () => { isPanning = false; activeDrag = null; });

        function getCurrentTree() { return familyTrees.find(t => t.id === currentTreeId); }

        function renderTreeTabs() {
            treeTabsList.innerHTML = '';
            familyTrees.forEach(tree => {
                const btn = document.createElement('button');
                btn.style.cssText = 'background:none; border:none; font-weight:700; color:var(--text-color); cursor:pointer; font-size:14px; text-align:left; padding:6px;';
                btn.innerText = (tree.id === currentTreeId ? '• ' : '') + tree.name;
                btn.onclick = () => { currentTreeId = tree.id; renderTreeTabs(); loadCurrentTreeCanvas(); };
                treeTabsList.appendChild(btn);
            });
        }

        function createNewTree() {
            const name = prompt("Új családfa neve:", "Családfa");
            if (!name) return;
            const newTree = { id: 'tree_' + Date.now(), name: name, sims: [] };
            familyTrees.push(newTree); currentTreeId = newTree.id;
            renderTreeTabs(); loadCurrentTreeCanvas();
        }

        function loadCurrentTreeCanvas() {
            treeWorld.querySelectorAll('.sim-node').forEach(n => n.remove());
            const tree = getCurrentTree();
            if (tree) {
                tree.sims.forEach(sim => renderSimNode(sim));
                updateConnections();
            }
        }

        function setSelectedSim(simId) {
            selectedSimId = simId;
            document.querySelectorAll('.sim-node').forEach(n => {
                if (n.id === simId) n.classList.add('selected');
                else n.classList.remove('selected');
            });
        }

        function addNewSimDialog() {
            addNewSim("Új", "Sim", 500 - panX / zoomLevel, 300 - panY / zoomLevel);
        }

        function addNewSim(firstName = "Új", lastName = "Sim", x = 400, y = 200, parentId = null, partnerId = null, relationType = null) {
            const tree = getCurrentTree(); if (!tree) return;
            const newSim = {
                id: 'sim_' + Date.now() + '_' + Math.floor(Math.random()*100),
                firstName, lastName, age: 'Fiatal felnőtt', traits: '', color: '#ff4770', image: '', x, y, parentId, partnerId, relationType
            };
            tree.sims.push(newSim);
            renderSimNode(newSim);
            updateConnections();
            setSelectedSim(newSim.id);
            return newSim;
        }

        function renderSimNode(sim) {
            const node = document.createElement('div');
            node.className = `sim-node ${selectedSimId === sim.id ? 'selected' : ''}`;
            node.id = sim.id;
            node.style.left = sim.x + 'px';
            node.style.top = sim.y + 'px';
            if (sim.color) node.style.borderColor = sim.color;

            const editPencil = document.createElement('div');
            editPencil.className = 'sim-edit-pencil'; editPencil.innerHTML = '✏️';
            editPencil.onclick = (e) => { e.stopPropagation(); openSimModal(sim.id); };
            node.appendChild(editPencil);

            const avatar = document.createElement('div');
            avatar.className = 'sim-node-avatar';
            if (sim.image) { avatar.style.backgroundImage = `url(${sim.image})`; avatar.innerText = ''; }
            else { avatar.style.backgroundImage = 'none'; avatar.innerText = '👤'; }

            const label = document.createElement('div');
            label.className = 'sim-node-label'; label.innerText = `${sim.firstName} ${sim.lastName}`;

            node.appendChild(avatar); node.appendChild(label);

            // RÓZSASZÍN + GOMB
            const partnerBtn = document.createElement('div');
            partnerBtn.className = 'add-btn-node add-partner-btn'; partnerBtn.innerText = '+';
            partnerBtn.onclick = (e) => { e.stopPropagation(); openConnectionPicker(sim.id, 'Szerelmes'); };

            // ZÖLD + GOMB
            const childBtn = document.createElement('div');
            childBtn.className = 'add-btn-node add-child-btn'; childBtn.innerText = '+';
            childBtn.onclick = (e) => {
                e.stopPropagation();
                addNewSim("Gyermek", sim.lastName, sim.x, sim.y + 160, sim.id, null, 'Gyerek');
            };

            node.appendChild(partnerBtn); node.appendChild(childBtn);

            node.addEventListener('mousedown', (e) => {
                if (e.target.classList.contains('add-btn-node') || e.target.classList.contains('sim-edit-pencil')) return;
                setSelectedSim(sim.id);
                activeDrag = sim; dragStartMouse = { x: e.clientX, y: e.clientY };
                dragStartSimPos = { x: sim.x, y: sim.y };
            });

            treeWorld.appendChild(node);
        }

        /* -------------------------------------------------- */
        /* CSODÁS FOLYTONOS VONALAK (ODA-VISSZA DUPLÁZÁS ELEMZÉSE) */
        /* -------------------------------------------------- */
        function updateConnections() {
            svgLayer.innerHTML = '';
            const tree = getCurrentTree(); if (!tree) return;

            const drawnPairs = new Set(); // MEGAKADÁLYOZZA AZ ODA-VISSZA DUPLA VONALAKAT

            tree.sims.forEach(sim => {
                // 1. SZÜLŐ-GYEREK (ALSÓ ZÖLD VONAL)
                if (sim.parentId) {
                    const parent = tree.sims.find(s => s.id === sim.parentId);
                    if (parent) {
                        const startX = parent.x + 47, startY = parent.y + 94;
                        const endX = sim.x + 47, endY = sim.y;
                        const midY = startY + (endY - startY) / 2;

                        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        path.setAttribute('d', `M ${startX} ${startY} C ${startX} ${midY}, ${endX} ${midY}, ${endX} ${endY}`);
                        path.setAttribute('class', 'line-child');
                        svgLayer.appendChild(path);
                    }
                }

                // 2. SZERELEM / PARTNER (JOBB OLDALI RÓZSASZÍN KÖTÉL)
                if (sim.partnerId) {
                    const pairKey = [sim.id, sim.partnerId].sort().join('_');
                    if (!drawnPairs.has(pairKey)) {
                        drawnPairs.add(pairKey);

                        const partner = tree.sims.find(s => s.id === sim.partnerId);
                        if (partner) {
                            const startX = sim.x + 94, startY = sim.y + 47;
                            const endX = partner.x, endY = partner.y + 47;
                            const midX = startX + (endX - startX) / 2;

                            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                            path.setAttribute('d', `M ${startX} ${startY} C ${midX} ${startY}, ${midX} ${endY}, ${endX} ${endY}`);
                            path.setAttribute('class', 'line-love');
                            svgLayer.appendChild(path);
                        }
                    }
                }
            });
        }

        // --------------------------------------------------
        // KÉPSZERKESZTŐ LÓGIKA (ZOOM, ROTATE, FILTER)
        // --------------------------------------------------
        function loadEditorImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imageEditorState.rawData = e.target.result;
                    imageEditorState.zoom = 1;
                    imageEditorState.rotation = 0;
                    imageEditorState.filter = 'none';

                    document.getElementById('imgZoom').value = 1;
                    document.getElementById('imgFilterSelect').value = 'none';
                    const preview = document.getElementById('cropImgPreview');
                    preview.src = e.target.result;

                    document.getElementById('imageEditorBox').classList.add('active');
                    applyImageTransforms();
                };
                reader.readAsDataURL(file);
            }
        }

        function rotateImage() {
            imageEditorState.rotation = (imageEditorState.rotation + 90) % 360;
            applyImageTransforms();
        }

        function applyImageTransforms() {
            imageEditorState.zoom = document.getElementById('imgZoom').value;
            imageEditorState.filter = document.getElementById('imgFilterSelect').value;

            const preview = document.getElementById('cropImgPreview');
            preview.style.transform = `scale(${imageEditorState.zoom}) rotate(${imageEditorState.rotation}deg)`;
            preview.style.filter = imageEditorState.filter;
        }

        function generateEditedCanvasImage() {
            if (!imageEditorState.rawData) return '';
            
            // Ha a képszerkesztő meg van nyitva, összefűzzük a hatásokat egy canvas-ra
            const canvas = document.createElement('canvas');
            canvas.width = 200; canvas.height = 200;
            const ctx = canvas.getContext('2d');
            const img = document.getElementById('cropImgPreview');

            ctx.filter = imageEditorState.filter;
            ctx.translate(100, 100);
            ctx.rotate((imageEditorState.rotation * Math.PI) / 180);
            ctx.scale(imageEditorState.zoom, imageEditorState.zoom);
            ctx.drawImage(img, -100, -100, 200, 200);

            return canvas.toDataURL();
        }

        // --------------------------------------------------
        // MODALOK LÓGIKÁJA
        // --------------------------------------------------
        function openSimModal(simId) {
            const tree = getCurrentTree(); if (!tree) return;
            const sim = tree.sims.find(s => s.id === simId); if (!sim) return;

            editingSimId = simId;
            imageEditorState.rawData = sim.image || '';

            document.getElementById('editFirstName').value = sim.firstName || '';
            document.getElementById('editLastName').value = sim.lastName || '';
            document.getElementById('editAge').value = sim.age || 'Fiatal felnőtt';
            document.getElementById('editColor').value = sim.color || '#ff4770';
            document.getElementById('editTraits').value = sim.traits || '';

            const editorBox = document.getElementById('imageEditorBox');
            if (sim.image) {
                document.getElementById('cropImgPreview').src = sim.image;
                editorBox.classList.add('active');
            } else {
                editorBox.classList.remove('active');
            }

            simModal.classList.add('active');
        }

        function closeSimModal() { simModal.classList.remove('active'); editingSimId = null; }

        function saveSimDetails(event) {
            event.preventDefault();
            const tree = getCurrentTree(); if (!tree) return;
            const sim = tree.sims.find(s => s.id === editingSimId); if (!sim) return;

            sim.firstName = document.getElementById('editFirstName').value;
            sim.lastName = document.getElementById('editLastName').value;
            sim.age = document.getElementById('editAge').value;
            sim.color = document.getElementById('editColor').value;
            sim.traits = document.getElementById('editTraits').value;

            if (imageEditorState.rawData) {
                sim.image = generateEditedCanvasImage() || imageEditorState.rawData;
            }

            closeSimModal();
            loadCurrentTreeCanvas();
        }

        function deleteCurrentSimModal() {
            if (!editingSimId) return;
            const tree = getCurrentTree(); if (!tree) return;
            tree.sims = tree.sims.filter(s => s.id !== editingSimId);
            closeSimModal(); loadCurrentTreeCanvas();
        }

        // --------------------------------------------------
        // KERESŐS CSALÁDI KAPCSOLAT MODAL KÉPEKKEL
        // --------------------------------------------------
        function openConnectionPicker(simId, defaultType = 'Házas') {
            contextSimId = simId;
            const tree = getCurrentTree(); if (!tree) return;
            const currentSim = tree.sims.find(s => s.id === simId); if (!currentSim) return;

            document.getElementById('connectionModalTitle').innerText = `${currentSim.firstName} ${currentSim.lastName} összekapcsolása`;
            document.getElementById('relationTypeSelect').value = defaultType;
            document.getElementById('simSearchInput').value = '';
            selectedTargetSimId = null;

            filterSimList();
            connectionModal.classList.add('active');
        }

        function filterSimList() {
            const tree = getCurrentTree(); if (!tree) return;
            const query = document.getElementById('simSearchInput').value.toLowerCase().trim();
            const resultsBox = document.getElementById('simSearchResultsBox');
            resultsBox.innerHTML = '';

            const availableSims = tree.sims.filter(s => s.id !== contextSimId && (
                s.firstName.toLowerCase().includes(query) ||
                s.lastName.toLowerCase().includes(query) ||
                `${s.firstName} ${s.lastName}`.toLowerCase().includes(query)
            ));

            if (availableSims.length === 0) {
                resultsBox.innerHTML = '<div style="font-size:13px; color:var(--subtext-color); padding:8px;">Nincs találat...</div>';
                return;
            }

            availableSims.forEach(sim => {
                const item = document.createElement('div');
                item.className = `sim-search-item ${selectedTargetSimId === sim.id ? 'selected' : ''}`;
                
                const avatar = document.createElement('div');
                avatar.className = 'sim-search-avatar';
                if (sim.image) { avatar.style.backgroundImage = `url(${sim.image})`; avatar.innerText = ''; }
                else { avatar.innerText = '👤'; }

                const info = document.createElement('div');
                info.innerHTML = `<strong>${sim.firstName} ${sim.lastName}</strong><div style="font-size:11px; color:var(--subtext-color);">${sim.age}</div>`;

                item.appendChild(avatar); item.appendChild(info);
                item.onclick = () => {
                    selectedTargetSimId = sim.id;
                    document.querySelectorAll('.sim-search-item').forEach(el => el.classList.remove('selected'));
                    item.classList.add('selected');
                };

                resultsBox.appendChild(item);
            });
        }

        function confirmConnection() {
            if (!selectedTargetSimId) return alert('Válassz ki egy Simet a listából!');
            const relationType = document.getElementById('relationTypeSelect').value;
            const tree = getCurrentTree(); if (!tree) return;

            const sourceSim = tree.sims.find(s => s.id === contextSimId);
            const targetSim = tree.sims.find(s => s.id === selectedTargetSimId);

            if (sourceSim && targetSim) {
                if (relationType === 'Gyerek') targetSim.parentId = sourceSim.id;
                else if (relationType === 'Szülő') sourceSim.parentId = targetSim.id;
                else {
                    sourceSim.partnerId = targetSim.id;
                    sourceSim.relationType = relationType;
                }
            }

            closeConnectionModal();
            loadCurrentTreeCanvas();
        }

        function closeConnectionModal() { connectionModal.classList.remove('active'); }
    </script>
</body>
</html>
