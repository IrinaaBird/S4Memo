<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S4Memo - Sims 4 Memorable</title>
    <style>
        :root {
            --bg-color: #f7ebe1;
            --bg-pattern: radial-gradient(#e2cebe 1.5px, transparent 1.5px);
            --card-bg: #fffbf7;
            --text-color: #4a3b32;
            --subtext-color: #7d685c;
            --border-color: #e6d7cd;
            --accent-color: #d97757;
            --accent-hover: #c46444;
            --active-glow: rgba(217, 119, 87, 0.4);
            --shadow-color: rgba(90, 60, 45, 0.08);
            --nav-bg: #f1e2d5;
            --input-bg: #ffffff;

            --btn-pink: #ff6b8b;
            --btn-pink-hover: #ff4770;
            --btn-green: #2ed573;
            --btn-green-hover: #26af5f;
            --line-pink: #ff4770;
            --line-green: #2ed573;

            --sim-node-clip-path: none;
            --sim-node-radius: 50%;
            --line-stroke-width: 3.5px;
            
            --custom-bg-size: cover;
            --custom-bg-position: center;
            --bg-blur: 0px;
        }

        [data-theme="dark"] {
            --bg-color: #1a1715;
            --bg-pattern: radial-gradient(#332b26 1.5px, transparent 1.5px);
            --card-bg: #262220;
            --text-color: #f0e6e0;
            --subtext-color: #b0a095;
            --border-color: #3b3330;
            --accent-color: #d97757;
            --accent-hover: #e68868;
            --active-glow: rgba(217, 119, 87, 0.5);
            --shadow-color: rgba(0, 0, 0, 0.3);
            --nav-bg: #201c1a;
            --input-bg: #2d2724;

            --btn-pink: #ff5277;
            --btn-pink-hover: #ff2a55;
            --btn-green: #2ed573;
            --btn-green-hover: #219d52;
            --line-pink: #ff5277;
            --line-green: #2ed573;
        }

        #bgBlurOverlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 0; backdrop-filter: blur(var(--bg-blur));
            -webkit-backdrop-filter: blur(var(--bg-blur)); transition: backdrop-filter 0.1s ease;
        }

        body.bg-dots { background-image: var(--bg-pattern); background-size: 24px 24px; }
        body.bg-clean { background-image: none !important; }
        body.bg-grid { 
            background-image: linear-gradient(var(--border-color) 1px, transparent 1px), linear-gradient(90deg, var(--border-color) 1px, transparent 1px);
            background-size: 30px 30px; 
        }

        * {
            box-sizing: border-box;
            font-family: 'Quicksand', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        body {
            margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-color);
            overflow: hidden; min-height: 100vh;
        }

        svg path { fill: none !important; stroke-linecap: round; }

        .line-love {
            stroke: var(--line-pink); stroke-width: var(--line-stroke-width);
            filter: drop-shadow(0 0 6px rgba(255, 71, 112, 0.6));
        }
        .line-child {
            stroke: var(--line-green); stroke-width: var(--line-stroke-width);
            filter: drop-shadow(0 0 6px rgba(46, 213, 115, 0.6));
        }

        .top-nav-container { padding: 20px 20px 0 20px; position: relative; z-index: 10; }
        .top-nav {
            background-color: var(--nav-bg); padding: 14px 28px;
            display: flex; align-items: center; justify-content: space-between;
            border-radius: 30px; box-shadow: 0 10px 25px var(--shadow-color); border: 2px solid var(--border-color);
        }
        .nav-left, .nav-right { display: flex; align-items: center; gap: 12px; }
        
        .save-btn, .import-btn, .theme-toggle-btn {
            background-color: var(--card-bg); color: var(--text-color);
            border: 2px solid var(--border-color); padding: 9px 16px; border-radius: 25px;
            font-weight: 700; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px;
            box-shadow: 0 4px 12px var(--shadow-color);
        }
        .save-btn { background-color: var(--accent-color); color: #ffffff; border-color: var(--accent-color); }
        .save-btn:hover { background-color: var(--accent-hover); transform: translateY(-2px); }
        .import-btn:hover, .theme-toggle-btn:hover { border-color: var(--accent-color); color: var(--accent-color); transform: translateY(-2px); }

        .logo { display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 800; color: var(--text-color); }
        .plumbob {
            width: 14px; height: 22px; background: linear-gradient(135deg, #2ed573 0%, #1e90ff 100%);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); display: inline-block;
        }

        .page-view#treeView {
            display: block; padding: 0; max-width: 100%; width: 100vw; height: 100vh;
            position: fixed; top: 0; left: 0; z-index: 100;
        }
        .tree-full-controls { position: absolute; top: 20px; right: 20px; z-index: 1050; display: flex; gap: 10px; }

        .tree-left-sidebar {
            position: absolute; top: 20px; left: 20px; width: 270px;
            background-color: var(--nav-bg); border: 2px solid var(--border-color);
            border-radius: 32px; padding: 22px 16px; box-shadow: 0 10px 30px var(--shadow-color);
            z-index: 1050; display: flex; flex-direction: column; gap: 12px;
        }

        .tree-tab-btn {
            background: none; border: none; font-weight: 700; color: var(--text-color);
            cursor: pointer; font-size: 14px; width: 100%; text-align: left;
            padding: 8px 12px; border-radius: 12px;
        }
        .tree-tab-wrapper.active .tree-tab-btn { background-color: var(--accent-color); color: #ffffff; }

        .add-tree-btn {
            background-color: transparent; color: var(--accent-color); border: 2px dashed var(--accent-color);
            padding: 10px 16px; border-radius: 20px; font-weight: 700; font-size: 13px; cursor: pointer; text-align: center;
        }

        .add-sim-floating-btn {
            position: absolute; bottom: 25px; right: 25px; z-index: 1050;
            background: linear-gradient(135deg, var(--btn-pink) 0%, var(--accent-color) 100%);
            color: #ffffff; border: none; padding: 16px 28px;
            border-radius: 30px; font-weight: 800; font-size: 15px; cursor: pointer;
            box-shadow: 0 8px 22px rgba(255, 71, 112, 0.4);
        }

        .toast-notification {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
            background-color: var(--accent-color); color: white; padding: 12px 28px;
            border-radius: 30px; font-weight: 800; font-size: 14px; box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            z-index: 5000; opacity: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }
        .toast-notification.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        .tree-canvas-viewport {
            width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; overflow: hidden; cursor: grab; z-index: 5;
        }
        .tree-canvas-viewport:active { cursor: grabbing; }
        
        .tree-canvas-world {
            width: 5000px; height: 5000px; position: absolute; top: 0; left: 0;
            transform-origin: 0 0; will-change: transform;
        }
        .tree-svg-layer { position: absolute; top: 0; left: 0; width: 5000px; height: 5000px; pointer-events: none; z-index: 1; }

        .sim-node {
            position: absolute; width: 94px; height: 94px; cursor: pointer; z-index: 2; user-select: none;
            display: flex; align-items: center; justify-content: center; background: transparent;
        }
        .sim-node.selected .sim-node-avatar { border: 3px solid var(--btn-pink); box-shadow: 0 0 15px var(--btn-pink); }

        .sim-node-avatar {
            width: 100%; height: 100%; border-radius: 50%; overflow: hidden;
            display: flex; align-items: center; justify-content: center; font-size: 34px;
            background-color: var(--card-bg); background-size: cover; background-position: center;
            box-shadow: inset 0 0 0 4px var(--accent-color), 0 8px 20px var(--shadow-color);
        }

        .sim-node-label {
            position: absolute; bottom: -28px; white-space: nowrap; font-weight: 800; font-size: 13px;
            color: var(--text-color); background-color: var(--card-bg); padding: 4px 12px; border-radius: 20px;
            border: 2px solid var(--border-color); box-shadow: 0 4px 10px var(--shadow-color); pointer-events: none;
        }

        .sim-edit-pencil {
            position: absolute; top: -4px; right: -4px; width: 26px; height: 26px;
            background-color: var(--card-bg); border: 2px solid var(--border-color); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; z-index: 20;
        }
    </style>
</head>
<body class="bg-dots">

    <div id="toastNotification" class="toast-notification">💾 Sikeresen mentve!</div>

    <div class="page-view" id="treeView">
        <div class="tree-full-controls">
            <button class="save-btn" onclick="exportDataToFile()">💾 Mentés Fájlba</button>
            <button class="import-btn" onclick="document.getElementById('importFileInput').click()">📁 Betöltés Fájlból</button>
            <input type="file" id="importFileInput" style="display:none;" accept=".json" onchange="importDataFromFile(event)">
            <button class="theme-toggle-btn" onclick="toggleTheme()" id="treeThemeBtn">🌙 Dark</button>
        </div>

        <div class="tree-left-sidebar">
            <div style="font-size: 13px; font-weight: 800; color: var(--subtext-color); text-transform: uppercase;">Családfák</div>
            <div id="treeTabsList"></div>
            <button class="add-tree-btn" onclick="createNewTree()">+ Családfa hozzáadása</button>
        </div>

        <button class="add-sim-floating-btn" onclick="addNewSim()">+ Új Sim Hozzáadása</button>

        <div class="tree-canvas-viewport" id="treeViewport">
            <div class="tree-canvas-world" id="treeWorld">
                <svg class="tree-svg-layer" id="svgLayer"></svg>
            </div>
        </div>
    </div>

    <script>
        const treeWorld = document.getElementById('treeWorld');
        const treeViewport = document.getElementById('treeViewport');
        const svgLayer = document.getElementById('svgLayer');
        const treeTabsList = document.getElementById('treeTabsList');

        const defaultData = [
            {
                id: 'tree_1',
                name: 'Goth család',
                sims: [
                    { id: 'sim_1', firstName: 'Bella', lastName: 'Goth', age: 'Fiatal felnőtt', x: 450, y: 200, parentId: null, partnerId: 'sim_2' },
                    { id: 'sim_2', firstName: 'Mortimer', lastName: 'Goth', age: 'Felnőtt', x: 650, y: 200, parentId: null, partnerId: 'sim_1' },
                    { id: 'sim_3', firstName: 'Cassandra', lastName: 'Goth', age: 'Tini', x: 550, y: 380, parentId: 'sim_1', partnerId: null }
                ]
            }
        ];

        let familyTrees = loadTreesFromStorage();
        let currentTreeId = familyTrees.length > 0 ? familyTrees[0].id : 'tree_1';
        let selectedSimId = null;

        let zoomLevel = 1;
        let panX = 0; let panY = 0;
        let isPanning = false;
        let startPanX = 0; let startPanY = 0;
        let activeDrag = null;
        let dragStartMouse = { x: 0, y: 0 };
        let dragStartSimPos = { x: 0, y: 0 };

        function loadTreesFromStorage() {
            try {
                const saved = localStorage.getItem('s4memo_trees_data');
                if (saved) return JSON.parse(saved);
            } catch (e) {
                console.error("Nem sikerült a localStorage betöltése", e);
            }
            return defaultData;
        }

        function saveTreesToStorage() {
            try {
                localStorage.setItem('s4memo_trees_data', JSON.stringify(familyTrees));
            } catch (e) {
                console.warn("A localStorage betelt vagy tiltva van. Használd a Mentés Fájlba gombot!");
            }
        }

        function exportDataToFile() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(familyTrees, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `Sims4_Csaladfak_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast("💾 Adatok sikeresen kimentve fájlba!");
        }

        function importDataFromFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (Array.isArray(importedData)) {
                        familyTrees = importedData;
                        if (familyTrees.length > 0) currentTreeId = familyTrees[0].id;
                        saveTreesToStorage();
                        renderTreeTabs();
                        loadCurrentTreeCanvas();
                        showToast("📁 Adatok sikeresen betöltve!");
                    } else {
                        alert("Érvénytelen fájlformátum!");
                    }
                } catch (err) {
                    alert("Hiba történt a fájl beolvasása közben!");
                }
            };
            reader.readAsText(file);
        }

        function showToast(message) {
            const toast = document.getElementById('toastNotification');
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function renderTreeTabs() {
            treeTabsList.innerHTML = '';
            familyTrees.forEach(tree => {
                const wrapper = document.createElement('div');
                wrapper.className = `tree-tab-wrapper ${tree.id === currentTreeId ? 'active' : ''}`;
                const btn = document.createElement('button');
                btn.className = 'tree-tab-btn';
                btn.innerText = tree.name;
                btn.onclick = () => {
                    currentTreeId = tree.id;
                    renderTreeTabs();
                    loadCurrentTreeCanvas();
                };
                wrapper.appendChild(btn);
                treeTabsList.appendChild(wrapper);
            });
        }

        function createNewTree() {
            const name = prompt("Új családfa neve:", "Új családfa");
            if (!name) return;
            const newTree = { id: 'tree_' + Date.now(), name: name.trim(), sims: [] };
            familyTrees.push(newTree);
            currentTreeId = newTree.id;
            saveTreesToStorage();
            renderTreeTabs();
            loadCurrentTreeCanvas();
        }

        function getCurrentTree() {
            return familyTrees.find(t => t.id === currentTreeId) || familyTrees[0];
        }

        function loadCurrentTreeCanvas() {
            document.querySelectorAll('.sim-node').forEach(n => n.remove());
            const tree = getCurrentTree();
            if (tree && tree.sims) {
                tree.sims.forEach(sim => renderSimNode(sim));
                updateConnections();
            }
        }

        function addNewSim() {
            const tree = getCurrentTree();
            if (!tree) return;
            const name = prompt("Sim neve:", "Új Sim");
            if (!name) return;

            const newSim = {
                id: 'sim_' + Date.now(),
                firstName: name,
                lastName: '',
                age: 'Fiatal felnőtt',
                x: 400 - panX,
                y: 300 - panY,
                parentId: null, partnerId: null
            };
            tree.sims.push(newSim);
            saveTreesToStorage();
            renderSimNode(newSim);
            updateConnections();
        }

        function renderSimNode(sim) {
            const node = document.createElement('div');
            node.className = `sim-node ${selectedSimId === sim.id ? 'selected' : ''}`;
            node.id = sim.id;
            node.style.left = sim.x + 'px';
            node.style.top = sim.y + 'px';

            const avatar = document.createElement('div');
            avatar.className = 'sim-node-avatar';
            avatar.innerText = '👤';

            const label = document.createElement('div');
            label.className = 'sim-node-label';
            label.innerText = `${sim.firstName} ${sim.lastName}`.trim();

            node.appendChild(avatar);
            node.appendChild(label);

            node.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return;
                selectedSimId = sim.id;
                document.querySelectorAll('.sim-node').forEach(n => n.classList.remove('selected'));
                node.classList.add('selected');

                activeDrag = sim;
                dragStartMouse = { x: e.clientX, y: e.clientY };
                dragStartSimPos = { x: sim.x, y: sim.y };
            });

            treeWorld.appendChild(node);
        }

        function updateConnections() {
            svgLayer.innerHTML = '';
            const tree = getCurrentTree();
            if (!tree || !tree.sims) return;

            tree.sims.forEach(sim => {
                if (sim.parentId) {
                    const parent = tree.sims.find(s => s.id === sim.parentId);
                    if (parent) {
                        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        path.setAttribute('d', `M ${parent.x + 47} ${parent.y + 94} L ${sim.x + 47} ${sim.y}`);
                        path.setAttribute('class', 'line-child');
                        svgLayer.appendChild(path);
                    }
                }
                if (sim.partnerId) {
                    const partner = tree.sims.find(s => s.id === sim.partnerId);
                    if (partner) {
                        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        path.setAttribute('d', `M ${sim.x + 94} ${sim.y + 47} L ${partner.x} ${partner.y + 47}`);
                        path.setAttribute('class', 'line-love');
                        svgLayer.appendChild(path);
                    }
                }
            });
        }

        window.addEventListener('mousemove', (e) => {
            if (isPanning) {
                panX = e.clientX - startPanX;
                panY = e.clientY - startPanY;
                treeWorld.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;
                return;
            }

            if (!activeDrag) return;
            const dx = (e.clientX - dragStartMouse.x) / zoomLevel;
            const dy = (e.clientY - dragStartMouse.y) / zoomLevel;

            activeDrag.x = Math.max(0, dragStartSimPos.x + dx);
            activeDrag.y = Math.max(0, dragStartSimPos.y + dy);

            const node = document.getElementById(activeDrag.id);
            if (node) {
                node.style.left = activeDrag.x + 'px';
                node.style.top = activeDrag.y + 'px';
            }
            updateConnections();
        });

        window.addEventListener('mouseup', () => {
            if (activeDrag) saveTreesToStorage();
            isPanning = false;
            activeDrag = null;
        });

        treeViewport.addEventListener('mousedown', (e) => {
            if (e.button !== 0 || e.target.closest('.sim-node') || e.target.closest('.tree-left-sidebar') || e.target.closest('.tree-full-controls')) return;
            isPanning = true;
            startPanX = e.clientX - panX;
            startPanY = e.clientY - panY;
        });

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
        }

        renderTreeTabs();
        loadCurrentTreeCanvas();
    </script>
</body>
</html>
